          const reason = isPaired ? 'Already paired' : isBenched ? 'Sitting out' : '';
          return `<button class="matchup-chip" style="margin:3px; ${unavailable ? 'opacity:0.45; cursor:not-allowed;' : ''}" ${unavailable ? 'disabled' : `onclick="quickPairSinglesFromSuggestion('${tbId}','${player.id}')"`}><span class="suggest-rank">${idx+1}</span> ${esc(tb.name)}${reason ? `<span class="sub">${reason}</span>` : ''}</button>`;
        }).join('') : `<div style="font-size:12px; color:var(--ink-soft);">No suggested matchups set yet.</div>`;
        inner += `<div style="font-size:11px; font-weight:800; color:var(--ink-soft); text-transform:uppercase; margin-bottom:6px;">Suggested Matchups</div>
          <div style="display:flex; flex-wrap:wrap;">${suggestionsHtml}</div>
          ${state.adminMode ? `<button class="btn btn-outline btn-sm" style="margin-top:8px;" onclick="openOppPlayerEditModal('${currentTeam.id}','${player.id}')">✏️ Edit Notes &amp; Suggestions</button>` : ''}`;
      }
    }
    inner += renderSeasonHistoryDropdown(player, isOpponent, teams); // applies to both Two Buff players and opponents alike
    // Sit-out toggle, scoped to the section's format. Only available with an event
    // selected AND when the player isn't already paired in that format — benching is a
    // "who's playing" decision made before matchups are formed.
    const isPairedInFormat = (id) => {
      if(format === 'singles') return singles[id] !== undefined || Object.values(singles).includes(id);
      return getDoublesBucket(ms).some(m => (m.tb || []).includes(id) || (m.opp || []).includes(id));
    };
    const fmtLabel = format === 'doubles' ? 'Doubles' : 'Singles';
    let benchBtn = '';
    if(state.adminMode){
      if(!selectedEventId){
        benchBtn = `<div style="font-size:10.5px; color:var(--ink-soft); margin-top:${isOpponent ? '8' : '0'}px;">Select an event to set the lineup.</div>`;
      } else if(isPairedInFormat(player.id)){
        benchBtn = '';
      } else {
        const benched = (format === 'doubles' ? benchedDoubles : benchedSingles).has(player.id);
        benchBtn = `<button class="btn ${benched ? 'btn-primary' : 'btn-outline'} btn-sm" style="width:100%; margin-top:${isOpponent ? '8' : '0'}px;" onclick="toggleBench('${player.id}','${format}')">${benched ? `↩️ Back in ${fmtLabel}` : `🪑 Sit out ${fmtLabel}`}</button>`;
      }
    }
    return `<div style="background:var(--chip-bg); border-radius:12px; padding:10px 12px; margin:4px 0 9px;">${inner}${benchBtn}</div>`;
  };


  const singlesTbIds = Object.keys(singles);
  const pairedSinglesHtml = [...singlesTbIds].map(tbId=>{ // first matchup made stays on top; new ones build downward
    const tb = activeTB.find(p=>p.id===tbId);
    const opp = currentTeam.players.find(p=>p.id===singles[tbId]);
    if(!tb || !opp) return '';
    const tbInfo = compactPlayerInfoLine(tb);
    const oppInfo = compactPlayerInfoLine(opp);
    const resultKey = `singles-${tbId}`;
    return `
      <div style="margin-bottom:9px;">
        <div class="matchup-paired-card" style="margin-bottom:0;">
          <button class="matchup-chip paired" style="margin:0; flex:1;" ${state.adminMode ? `onmousedown="startMatchupLongPress('${tbId}','singles')" onmouseup="cancelMatchupLongPress()" onmouseleave="cancelMatchupLongPress()" ontouchstart="startMatchupLongPress('${tbId}','singles')" ontouchend="cancelMatchupLongPress()" ontouchmove="cancelMatchupLongPress()" onclick="matchupChipTap(event, 'singlesTB', '${tbId}')"` : 'disabled'}>${esc(tb.name)} ${genderBadgeHtml(tb)}${tbInfo ? `<span class="sub">${esc(tbInfo)}</span>` : ''}</button>
          ${singlesConnector(tbId, opp.id, resultKey)}
          <button class="matchup-chip opp-paired" style="margin:0; flex:1;" ${state.adminMode ? `onmousedown="startMatchupLongPress('${opp.id}','singles')" onmouseup="cancelMatchupLongPress()" onmouseleave="cancelMatchupLongPress()" ontouchstart="startMatchupLongPress('${opp.id}','singles')" ontouchend="cancelMatchupLongPress()" ontouchmove="cancelMatchupLongPress()" onclick="matchupChipTap(event, 'singlesOpp', '${opp.id}')"` : 'disabled'}>${esc(opp.name)} ${genderBadgeHtml(opp)}${oppInfo ? `<span class="sub">${esc(oppInfo)}</span>` : ''}</button>
          ${state.adminMode ? `<button class="icon-btn" onclick="unpairSingles('${tbId}')">✕</button>` : ''}
        </div>
        ${renderMatchupCard(tb, false, 'singles')}
        ${renderMatchupCard(opp, true, 'singles')}
        ${singlesResultHtml(tbId, opp.id, resultKey)}
      </div>`;
  }).join('');

  const tbSinglesChips = availableTB.length ? availableTB.map(p=>{
    const isArmed = state.armedSinglesTB === p.id;
    const info = compactPlayerInfoLine(p);
    return `<button class="matchup-chip ${isArmed?'armed':''}" ${state.adminMode ? `onmousedown="startMatchupLongPress('${p.id}','singles')" onmouseup="cancelMatchupLongPress()" onmouseleave="cancelMatchupLongPress()" ontouchstart="startMatchupLongPress('${p.id}','singles')" ontouchend="cancelMatchupLongPress()" ontouchmove="cancelMatchupLongPress()" onclick="matchupChipTap(event, 'singlesTB', '${p.id}')"` : 'disabled'}>${esc(p.name)} ${genderBadgeHtml(p)}${info ? `<span class="sub">${esc(info)}</span>` : ''}${isArmed ? `<span class="sub">Tap an opponent →</span>` : ''}</button>${renderMatchupCard(p, false, 'singles')}`;
  }).join('') : `<div style="font-size:12.5px; color:var(--ink-soft); text-align:center; padding:10px 0;">Everyone's matched up</div>`;

  const oppSinglesChips = availableOpp.length ? availableOpp.map(o=>{
    const isArmed = state.armedSinglesOpp === o.id;
    const info = compactPlayerInfoLine(o);
    return `<button class="matchup-chip ${isArmed?'armed':''}" ${state.adminMode ? `onmousedown="startMatchupLongPress('${o.id}','singles')" onmouseup="cancelMatchupLongPress()" onmouseleave="cancelMatchupLongPress()" ontouchstart="startMatchupLongPress('${o.id}','singles')" ontouchend="cancelMatchupLongPress()" ontouchmove="cancelMatchupLongPress()" onclick="matchupChipTap(event, 'singlesOpp', '${o.id}')"` : 'disabled'}>${esc(o.name)} ${genderBadgeHtml(o)}${info ? `<span class="sub">${esc(info)}</span>` : ''}${isArmed ? `<span class="sub">← Tap a Two Buff player</span>` : ''}</button>${renderMatchupCard(o, true, 'singles')}`;
  }).join('') : `<div style="font-size:12.5px; color:var(--ink-soft); text-align:center; padding:10px 0;">${currentTeam.players.length ? 'All matched up' : 'No players on this roster yet'}</div>`;

  // ---- Doubles: now a real doubles-vs-doubles matchup (tap two on each side) ----
  const doubles = getDoublesBucket(ms);
  const pairedTBIds = new Set(doubles.flatMap(m=>m.tb));
  const pairedOppIds = new Set(doubles.flatMap(m=>m.opp));
  const availableDoublesTB = eligibleTB.filter(p=>!pairedTBIds.has(p.id) && !benchedDoubles.has(p.id));
  const availableDoublesOpp = currentTeam.players.filter(p=>p.active !== false && !pairedOppIds.has(p.id) && !benchedDoubles.has(p.id));

  const doublesConnector = (m, key) => {
    let statusEmoji = '';
    if(eventStats){
      const entry = (eventStats[m.tb[0]] && eventStats[m.tb[0]].doubles) || {};
      if(entry.played) statusEmoji = entry.result==='W' ? ' ✅' : entry.result==='T' ? ' 🤝' : ' ❌';
    }
    if(state.adminMode && selectedEventId){
      const expanded = state.expandedMockupResultKey === key;
      return `<button class="matchup-connector" style="background:none; border:none; padding:0; font:inherit; text-transform:uppercase; cursor:pointer;" onclick="toggleMockupResult('${key}')">vs${statusEmoji} ${expanded ? '▲' : '▼'}</button>`;
    }
    return `<div class="matchup-connector">vs${statusEmoji}</div>`;
  };
  const doublesResultHtml = (m, key) => {
    if(!selectedEventId || !state.adminMode || state.expandedMockupResultKey !== key) return '';
    const primaryTbId = m.tb[0];
    const entry = normalizeGroupEntry((eventStats[primaryTbId] && eventStats[primaryTbId].doubles) || blankResultEntry('doubles'));
    const rank = entry.powerRank || 5;
    const fmt = m.format || 'doubles';
    const winPts = groupFormatWinPoints(fmt);
    const tbArg = JSON.stringify(m.tb).replace(/"/g, '&quot;');
    const oppArg = JSON.stringify(m.opp).replace(/"/g, '&quot;');
    const recordCall = (r) => `recordGroupResult('${selectedEventId}', ${tbArg}, ${oppArg}, '${fmt}', '${r}')`;
    return `
      <div style="width:100%; margin-top:8px; padding-top:8px; border-top:1px dashed var(--line);">
        <div style="display:flex; gap:8px;">
          <button class="wl-btn ${entry.played && entry.result==='W' ? 'win-sel':''}" style="flex:1;" onclick="${recordCall('W')}">Won</button>
          <button class="wl-btn ${entry.played && entry.result==='T' ? 'tie-sel':''}" style="flex:1;" onclick="${recordCall('T')}">Tie</button>
          <button class="wl-btn ${entry.played && entry.result==='L' ? 'loss-sel':''}" style="flex:1;" onclick="${recordCall('L')}">Lost</button>
        </div>
        ${entry.played ? `
          <div style="display:flex; gap:8px; margin-top:8px;">
            <div style="flex:1;">
              <label style="display:block; font-size:10px; font-weight:800; color:var(--ink-soft); text-transform:uppercase; margin-bottom:4px;">Our Score</label>
              <input class="lunch-input" style="margin-top:0;" type="number" placeholder="e.g. 54" value="${entry.ourScore!=null ? entry.ourScore : ''}" onchange="setDoublesScore('${selectedEventId}','${primaryTbId}','our', this.value)">
            </div>
            <div style="flex:1;">
              <label style="display:block; font-size:10px; font-weight:800; color:var(--ink-soft); text-transform:uppercase; margin-bottom:4px;">Opponent Score</label>
              <input class="lunch-input" style="margin-top:0;" type="number" placeholder="e.g. 57" value="${entry.oppScore!=null ? entry.oppScore : ''}" onchange="setDoublesScore('${selectedEventId}','${primaryTbId}','opp', this.value)">
            </div>
          </div>
        ` : ''}
        ${entry.played && entry.result !== 'T' && entry.ourScore != null && entry.oppScore != null && entry.ourScore === entry.oppScore ? `
          <div style="margin-top:8px;">
            <label style="display:block; font-size:10px; font-weight:800; color:var(--ink-soft); text-transform:uppercase; margin-bottom:4px;">Playoff Holes</label>
            <input class="lunch-input" style="margin-top:0;" type="number" min="1" placeholder="Scores tied — how many holes was the playoff?" value="${entry.playoffHoles!=null ? entry.playoffHoles : ''}" onchange="setDoublesPlayoffHoles('${selectedEventId}','${primaryTbId}', this.value)">
          </div>
        ` : ''}
        ${entry.played && entry.result !== 'T' ? `
          <div style="display:flex; align-items:center; gap:8px; margin-top:8px;">
            <input type="range" min="1" max="10" value="${rank}" style="flex:1;" oninput="this.nextElementSibling.textContent=this.value" onchange="setPowerRank('${selectedEventId}','${primaryTbId}','doubles', this.value)">
            <span style="font-size:12px; font-weight:800; color:var(--forest-dark); width:16px; text-align:right;">${rank}</span>
          </div>
          <div style="font-size:10px; color:var(--ink-soft); margin-top:2px;">Opponent pair quality — 5+ strong, below 5 weaker</div>
        ` : ''}
        ${entry.played && entry.result === 'T' ? `<div style="font-size:10px; color:var(--ink-soft); margin-top:6px;">A tie splits the points — ${winPts/2} to each team.</div>` : ''}
      </div>`;
  };

  const doublesPairedHtml = doubles.map((m,i)=>{ // first matchup made stays on top; new ones build downward
    const fmt = m.format || 'doubles';
    const tbPlayers = m.tb.map(id=>activeTB.find(p=>p.id===id));
    const oppPlayers = m.opp.map(id=>currentTeam.players.find(p=>p.id===id));
    if(tbPlayers.some(p=>!p) || oppPlayers.some(p=>!p)) return ''; // a member was removed from a roster
    const resultKey = `doubles-${i}`;
    const tbChipsCol = tbPlayers.map(p=>`<div class="matchup-chip paired" style="margin:0; cursor:default;">${esc(p.name)} ${genderBadgeHtml(p)}</div>`).join('');
    const oppChipsCol = oppPlayers.map(p=>`<div class="matchup-chip opp-paired" style="margin:0; cursor:default;">${esc(p.name)} ${genderBadgeHtml(p)}</div>`).join('');
    const fmtBadge = `<div style="font-size:9px; font-weight:800; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.3px; margin-bottom:3px;">${groupFormatLabel(fmt)} · ${groupFormatWinPoints(fmt)} pt${groupFormatWinPoints(fmt)>1?'s':''}/win</div>`;
    return `
      <div style="margin-bottom:9px;">
        ${fmtBadge}
        <div class="matchup-paired-card" style="margin-bottom:0;">
          <div style="display:flex; flex-direction:column; gap:4px; flex:1;">${tbChipsCol}</div>
          ${doublesConnector(m, resultKey)}
          <div style="display:flex; flex-direction:column; gap:4px; flex:1;">${oppChipsCol}</div>
          ${state.adminMode ? `<button class="icon-btn" onclick="unpairDoublesMatchup(${i})">✕</button>` : ''}
        </div>
        ${doublesResultHtml(m, resultKey)}
      </div>`;
  }).join('');

  const doublesTBChips = availableDoublesTB.length ? availableDoublesTB.map(p=>{
    const isArmed = state.armedDoublesTBPair.includes(p.id);
    const info = compactPlayerInfoLine(p);
    return `<button class="matchup-chip ${isArmed?'armed':''}" ${state.adminMode ? `onmousedown="startMatchupLongPress('${p.id}','doubles')" onmouseup="cancelMatchupLongPress()" onmouseleave="cancelMatchupLongPress()" ontouchstart="startMatchupLongPress('${p.id}','doubles')" ontouchend="cancelMatchupLongPress()" ontouchmove="cancelMatchupLongPress()" onclick="matchupChipTap(event, 'doublesTB', '${p.id}')"` : 'disabled'}>${esc(p.name)} ${genderBadgeHtml(p)}${info ? `<span class="sub">${esc(info)}</span>` : ''}</button>${renderMatchupCard(p, false, 'doubles')}`;
  }).join('') : `<div style="font-size:12.5px; color:var(--ink-soft); text-align:center; padding:10px 0;">Everyone's grouped up</div>`;

  const doublesOppChips = availableDoublesOpp.length ? availableDoublesOpp.map(o=>{
    const isArmed = state.armedDoublesOppPair.includes(o.id);
    const info = compactPlayerInfoLine(o);
    return `<button class="matchup-chip ${isArmed?'armed':''}" ${state.adminMode ? `onmousedown="startMatchupLongPress('${o.id}','doubles')" onmouseup="cancelMatchupLongPress()" onmouseleave="cancelMatchupLongPress()" ontouchstart="startMatchupLongPress('${o.id}','doubles')" ontouchend="cancelMatchupLongPress()" ontouchmove="cancelMatchupLongPress()" onclick="matchupChipTap(event, 'doublesOpp', '${o.id}')"` : 'disabled'}>${esc(o.name)} ${genderBadgeHtml(o)}${info ? `<span class="sub">${esc(info)}</span>` : ''}</button>${renderMatchupCard(o, true, 'doubles')}`;
  }).join('') : `<div style="font-size:12.5px; color:var(--ink-soft); text-align:center; padding:10px 0;">${currentTeam.players.length ? 'All grouped up' : 'No players on this roster yet'}</div>`;

  const eventDetails = eventStats ? computeMatchDetailsFromData(eventStats) : null;
  const singlesScoreHtml = eventDetails ? renderScoreboard('Two Buff', eventDetails.mpUsPts, eventDetails.mpOppPts, currentTeam.name, false) : '';
  const doublesScoreHtml = eventDetails ? renderScoreboard('Two Buff', eventDetails.dbUsPts, eventDetails.dbOppPts, currentTeam.name, false) : '';
  const finalScoreHtml = eventDetails ? renderScoreboard('Two Buff', eventDetails.totalUsPts, eventDetails.totalOppPts, currentTeam.name, true) : '';

  // "Not playing" sections: players present but benched from a given format. Tap to restore.
  const benchSectionHtml = (format) => {
    if(!selectedEventId) return '';
    const ids = format === 'doubles' ? bench.doubles : bench.singles;
    if(!ids.length) return '';
    const fmtLabel = format === 'doubles' ? 'doubles' : 'singles';
    const chipFor = (id) => {
      const pl = resolveMatchupPlayer(id);
      if(!pl) return '';
      return `<button class="matchup-chip" style="margin:0 0 6px; opacity:0.85;" ${state.adminMode ? `onclick="toggleBench('${id}','${format}')"` : 'disabled'}>${esc(pl.name)} ${genderBadgeHtml(pl)}<span class="sub">tap to add back</span></button>`;
    };
    const tbBenched = ids.filter(id=>!currentTeam.players.some(x=>x.id===id));
    const oppBenched = ids.filter(id=>currentTeam.players.some(x=>x.id===id));
    const emptyCol = `<div style="font-size:11.5px; color:var(--ink-soft); text-align:center; padding:8px 0;">—</div>`;
    return `
      <div style="margin-top:10px; padding:10px 12px; background:var(--chip-bg); border-radius:12px;">
        <div style="font-size:11px; font-weight:800; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.3px; margin-bottom:8px;">🪑 Sitting out ${fmtLabel}</div>
        <div class="matchup-cols">
          <div>
            <div class="matchup-col-label">Two Buff</div>
            ${tbBenched.length ? tbBenched.map(chipFor).join('') : emptyCol}
          </div>
          <div>
            <div class="matchup-col-label">${esc(currentTeam.name)}</div>
            ${oppBenched.length ? oppBenched.map(chipFor).join('') : emptyCol}
          </div>
        </div>
      </div>`;
  };

  const adjustmentsHtml = eventDetails ? `
    <div class="stats-section-header">⚖️ Special / Penalty Points</div>
    <div style="font-size:11.5px; color:var(--ink-soft); margin-bottom:8px;">Extra points that don't come from a specific matchup — penalties, bonuses, tiebreak rulings, etc. Counted only in the final total below, not in Singles or Doubles.</div>
    ${eventDetails.adjustments.length ? eventDetails.adjustments.map(a=>`
      <div class="matchup-pair-row">
        <div>
          <div style="font-size:13px; font-weight:800; color:${a.team==='us' ? 'var(--forest)' : 'var(--red)'};">${a.points>=0?'+':''}${a.points} pts — ${a.team==='us' ? 'Two Buff' : esc(currentTeam.name)}</div>
          ${a.note ? `<div style="font-size:11.5px; color:var(--ink-soft); margin-top:2px;">${esc(a.note)}</div>` : ''}
        </div>
        ${state.adminMode ? `<button class="icon-btn" onclick="removePointsAdjustment('${selectedEventId}','${a.id}')">✕</button>` : ''}
      </div>
    `).join('') : `<div style="font-size:12.5px; color:var(--ink-soft); padding:4px 0 10px;">No adjustments recorded.</div>`}
    ${state.adminMode ? `<button class="btn btn-outline btn-sm" onclick="openAddPointsAdjustmentModal('${selectedEventId}')">+ Add Points Adjustment</button>` : ''}
  ` : '';

  return `
    <div class="page-title">Matchups &amp; Mockup</div>
    <div class="page-sub">Select a team to run a mockup and try out matchup strategies. Tap a specific event linked to that opponent to perform the actual matchups and record real results. Only admins can make changes — everyone else can view.</div>
    ${teamPills}
    ${eventPillsHtml}
    ${resultBannerHtml}
    ${state.adminMode ? `
    <div class="btn-row" style="margin:6px 0 4px;">
      <button class="btn btn-ghost btn-sm" onclick="confirmResetMatchup()">↺ Reset Board</button>
    </div>` : ''}

    <div class="stats-section-header">🥏 Singles</div>
    ${pairedSinglesHtml}
    <div class="matchup-cols">
      <div>
        <div class="matchup-col-label">Two Buff</div>
        ${tbSinglesChips}
      </div>
      <div>
        <div class="matchup-col-label">${esc(currentTeam.name)}</div>
        ${oppSinglesChips}
      </div>
    </div>
    ${benchSectionHtml('singles')}
    ${singlesScoreHtml}

    <div class="stats-section-header">👥 Doubles</div>
    ${state.adminMode ? `
      <div style="display:flex; align-items:center; gap:8px; margin-bottom:6px;">
        <button class="matchup-format-pill" onmousedown="startFormatLongPress()" onmouseup="cancelFormatLongPress()" onmouseleave="cancelFormatLongPress()" ontouchstart="startFormatLongPress()" ontouchend="cancelFormatLongPress()" ontouchmove="cancelFormatLongPress()" onclick="handleFormatPillClick(event)">${groupFormatLabel(state.groupFormat)}</button>
        <span style="font-size:10.5px; color:var(--ink-soft); font-weight:700;">Long-press to switch format</span>
      </div>
    ` : ''}
    ${doublesPairedHtml}
    <div class="matchup-cols">
      <div>
        <div class="matchup-col-label">Two Buff${state.armedDoublesTBPair.length ? ` (${state.armedDoublesTBPair.length}/${groupTeamSize(state.groupFormat)})` : ''}</div>
        ${doublesTBChips}
      </div>
      <div>
        <div class="matchup-col-label">${esc(currentTeam.name)}${state.armedDoublesOppPair.length ? ` (${state.armedDoublesOppPair.length}/${groupTeamSize(state.groupFormat)})` : ''}</div>
        ${doublesOppChips}
      </div>
    </div>
    ${benchSectionHtml('doubles')}
    ${doublesScoreHtml}

    ${adjustmentsHtml}

    ${eventDetails ? `
      <div class="stats-section-header">🏁 Final Event Score</div>
      ${finalScoreHtml}
    ` : ''}
  `;
}

async function selectMatchupTeam(teamId){
  const ms = state.matchupStateCache || await loadMatchupState();
  ms.currentTeamId = (ms.currentTeamId === teamId) ? null : teamId; // tap the selected pill again to deselect
  if(!ms.singlesByTeam[teamId]) ms.singlesByTeam[teamId] = {}; // ensure a slot exists, doesn't touch other teams' data
  if(!ms.doublesByTeam[teamId]) ms.doublesByTeam[teamId] = [];
  state.armedSinglesTB = null;
  state.armedSinglesOpp = null;
  state.armedDoublesTBPair = [];
  state.armedDoublesOppPair = [];
  state.matchupStateCache = ms;
  render(); // instant — the cache already reflects the change
  saveMatchupState(ms).catch(err=>console.error('Matchup save failed', err));
}
function toggleMockupResult(key){
  state.expandedMockupResultKey = (state.expandedMockupResultKey === key) ? null : key;
  render();
}
async function selectMockupEvent(teamId, eventId){
  const ms = state.matchupStateCache || await loadMatchupState();
  ms.eventIdByTeam[teamId] = (ms.eventIdByTeam[teamId] === eventId) ? null : eventId; // tap again to go back to trial mode
  state.matchupStateCache = ms;
  render();
  saveMatchupState(ms).catch(err=>console.error('Matchup save failed', err));
}
async function confirmResetMatchup(){
  const ms = state.matchupStateCache || await loadMatchupState();
  state.matchupStateCache = ms;
  const eventId = ms.currentTeamId ? ms.eventIdByTeam[ms.currentTeamId] : null;
  // Detect whether this event has any recorded results/adjustments to warn about.
  let hasResults = false;
  if(eventId){
    const stats = await loadStats(eventId);
    hasResults = Object.keys(stats).some(k=>{
      if(k === '__adjustments') return Array.isArray(stats[k]) && stats[k].length > 0;
      const s = stats[k];
      return (s.matchplay && s.matchplay.played) || (s.doubles && s.doubles.played);
    });
  }
  const modal = document.getElementById('modalRoot');
  modal.innerHTML = `
    <div class="overlay" onclick="closeModalIfBackdrop(event)">
      <div class="sheet" onclick="event.stopPropagation()">
        <h3>Reset the board?</h3>
        <div style="font-size:13px; color:var(--ink); line-height:1.5; margin-bottom:8px;">
          This clears every matchup, the sitting-out lineup, and all inputs for ${eventId ? 'this event' : 'this mockup'}.
        </div>
        ${hasResults ? `<div style="font-size:12.5px; color:var(--red); font-weight:700; line-height:1.5; margin-bottom:14px;">⚠️ Recorded match results and scores for this event will also be reset. This can't be undone.</div>` : `<div style="font-size:12.5px; color:var(--ink-soft); line-height:1.5; margin-bottom:14px;">Nothing has been recorded yet, so this just clears the arrangement.</div>`}
        <div class="btn-row">
          <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
          <button class="btn btn-danger" onclick="performResetMatchup()">Reset Board</button>
        </div>
      </div>
    </div>`;
}
async function performResetMatchup(){
  // Full wipe of the current board: pairings, the sitting-out bench, AND any recorded
  // results/scores/adjustments for the selected event. Trial (mockup) mode has no stored
  // results, so it only clears the on-screen arrangement.
  const ms = state.matchupStateCache || await loadMatchupState();
  if(ms.currentTeamId){
    const eventId = ms.eventIdByTeam[ms.currentTeamId];
    if(eventId){
      ms.singlesByEvent[eventId] = {};
      ms.doublesByEvent[eventId] = [];
      const emptyBench = { singles: [], doubles: [] };
      state.benchCache[eventId] = emptyBench;
      saveBench(eventId, emptyBench).catch(err=>console.error('Bench reset failed', err));
      // Wipe all recorded results/scores/adjustments for this event.
      const emptyStats = {};
      state.statsCache[eventId] = emptyStats;
      if(state.allStatsCache) state.allStatsCache[eventId] = emptyStats;
      saveStats(eventId, emptyStats).catch(err=>console.error('Stats reset failed', err));
    } else {
      ms.singlesByTeam[ms.currentTeamId] = {};
      ms.doublesByTeam[ms.currentTeamId] = [];
    }
  }
  state.armedSinglesTB = null;
  state.armedSinglesOpp = null;
  state.armedDoublesTBPair = [];
  state.armedDoublesOppPair = [];
  state.expandedMatchupKey = null;
  state.matchupStateCache = ms;
  closeModal();
  showToast('Board reset');
  render();
  saveMatchupState(ms).catch(err=>console.error('Matchup save failed', err));
}
async function tapSinglesTB(tbId){
  const ms = state.matchupStateCache || await loadMatchupState();
  state.matchupStateCache = ms;
  const singles = getSinglesBucket(ms);
  const eventId = ms.eventIdByTeam[ms.currentTeamId];
  if(state.armedSinglesTB === tbId){ state.armedSinglesTB = null; render(); return; }
  if(state.armedSinglesOpp !== null){
    // An opponent is already armed — complete the pairing in this direction.
    if(singles[tbId] !== undefined){
      delete singles[tbId];
      if(eventId) clearSinglesResultIfExists(eventId, tbId); // that old pairing's result no longer applies
    }
    singles[tbId] = state.armedSinglesOpp;
    state.armedSinglesOpp = null;
    render();
    saveMatchupState(ms).catch(err=>console.error('Matchup save failed', err));
    return;
  }
  if(singles[tbId] !== undefined){
    delete singles[tbId]; // free their current opponent so the pairing can be redone
    saveMatchupState(ms).catch(err=>console.error('Matchup save failed', err));
    if(eventId) clearSinglesResultIfExists(eventId, tbId);
  }
  state.armedSinglesTB = tbId;
  render();
}
async function tapSinglesOpp(oppId){
  const ms = state.matchupStateCache || await loadMatchupState();
  state.matchupStateCache = ms;
  const singles = getSinglesBucket(ms);
  const eventId = ms.eventIdByTeam[ms.currentTeamId];
  if(state.armedSinglesOpp === oppId){ state.armedSinglesOpp = null; render(); return; }
  if(state.armedSinglesTB !== null){
    // A Two Buff player is already armed — complete the pairing in this direction.
    if(singles[state.armedSinglesTB] !== undefined){
      delete singles[state.armedSinglesTB];
      if(eventId) clearSinglesResultIfExists(eventId, state.armedSinglesTB);
    }
    singles[state.armedSinglesTB] = oppId;
    state.armedSinglesTB = null;
    render();
    saveMatchupState(ms).catch(err=>console.error('Matchup save failed', err));
    return;
  }
  const existingTbId = Object.keys(singles).find(tid => singles[tid] === oppId);
  if(existingTbId){
    delete singles[existingTbId]; // free their current Two Buff opponent so the pairing can be redone
    saveMatchupState(ms).catch(err=>console.error('Matchup save failed', err));
    if(eventId) clearSinglesResultIfExists(eventId, existingTbId);
  }
  state.armedSinglesOpp = oppId;
  render();
}
// Long-press support for matchup chips. Holding a chip opens that player's card (scouting
// notes/suggestions for opponents, plus a "sit out" toggle scoped to the section you're in),
// instead of arming it for pairing. A normal short tap does the usual pairing action — the
// click the browser fires after a touch release is swallowed only when the press was long.
let _longPressTimer = null;
let _longPressFired = false;
const LONG_PRESS_MS = 550;
function startMatchupLongPress(playerId, format){
  _longPressFired = false;
  clearTimeout(_longPressTimer);
  _longPressTimer = setTimeout(()=>{
    _longPressFired = true;
    toggleMatchupCard(playerId, format);
  }, LONG_PRESS_MS);
}
function cancelMatchupLongPress(){
  clearTimeout(_longPressTimer);
}
// Dispatches a short tap to the correct pairing action, or swallows the click if a
// long-press just fired. kind: 'singlesTB' | 'singlesOpp' | 'doublesTB' | 'doublesOpp'.
function matchupChipTap(event, kind, playerId){
  if(_longPressFired){
    _longPressFired = false;
    event.preventDefault();
    event.stopPropagation();
    return;
  }
  if(kind === 'singlesTB') tapSinglesTB(playerId);
  else if(kind === 'singlesOpp') tapSinglesOpp(playerId);
  else if(kind === 'doublesTB') tapDoublesTBMember(playerId);
  else if(kind === 'doublesOpp') tapDoublesOppMember(playerId);
}
function toggleMatchupCard(playerId, format){
  const key = format + ':' + playerId;
  state.expandedMatchupKey = (state.expandedMatchupKey === key) ? null : key;
  render();
}
// One-tap shortcut from a suggested-matchup chip. The chip is disabled when the player is
// already paired or sitting out singles, but we guard here too as a safety net.
async function quickPairSinglesFromSuggestion(tbId, oppId){
  const ms = state.matchupStateCache || await loadMatchupState();
  state.matchupStateCache = ms;
  const singles = getSinglesBucket(ms);
  if(singles[tbId] !== undefined){ showToast('That player is already matched up'); render(); return; }
  const eventId = ms.eventIdByTeam[ms.currentTeamId];
  if(eventId){
    const bench = await loadBench(eventId);
    if(bench.singles.includes(tbId)){ showToast('That player is sitting out singles'); render(); return; }
  }
  const existingTbId = Object.keys(singles).find(tid => singles[tid] === oppId);
  if(existingTbId){
    delete singles[existingTbId];
    if(eventId) clearSinglesResultIfExists(eventId, existingTbId);
  }
  singles[tbId] = oppId;
  state.armedSinglesTB = null;
  state.armedSinglesOpp = null;
  state.expandedMatchupKey = null;
  render();
  saveMatchupState(ms).catch(err=>console.error('Matchup save failed', err));
  showToast('Matched up!');
}
async function unpairSingles(tbId){
  const ms = state.matchupStateCache || await loadMatchupState();
  state.matchupStateCache = ms;
  const singles = getSinglesBucket(ms);
  const eventId = ms.eventIdByTeam[ms.currentTeamId];
  delete singles[tbId];
  render();

  if(eventId) clearSinglesResultIfExists(eventId, tbId);
}
// How many players each side needs for the currently-armed format.
function groupTeamSize(format){
  return format === 'singles' ? 1 : format === 'triples' ? 3 : 2;
}
function setGroupFormat(format){
  if(state.groupFormat === format) return; // already active — no change
  state.groupFormat = format;
  // Switching format mid-selection would leave an ambiguous partial group — clear it.
  state.armedDoublesTBPair = [];
  state.armedDoublesOppPair = [];
  render();
}
// The format pill defaults to Doubles (the common case) and cycles on long-press only,
// so a stray tap never silently changes the format. Order: Doubles -> Singles -> Triples -> Doubles.
let _formatLongPressTimer = null;
let _formatLongPressFired = false;
function cycleGroupFormat(){
  const order = ['doubles','singles','triples'];
  const next = order[(order.indexOf(state.groupFormat) + 1) % order.length];
  setGroupFormat(next);
  showToast(groupFormatLabel(next) + ' selected');
}
function startFormatLongPress(){
  _formatLongPressFired = false;
  clearTimeout(_formatLongPressTimer);
  _formatLongPressTimer = setTimeout(()=>{ _formatLongPressFired = true; cycleGroupFormat(); }, LONG_PRESS_MS);
}
function cancelFormatLongPress(){
  clearTimeout(_formatLongPressTimer);
}
function handleFormatPillClick(event){
  if(_formatLongPressFired){ _formatLongPressFired = false; event.preventDefault(); event.stopPropagation(); return; } // long-press already handled it
  showToast('Long-press to switch format');
}
function finalizeDoublesMatchupIfReady(ms){
  const need = groupTeamSize(state.groupFormat);
  if(state.armedDoublesTBPair.length === need && state.armedDoublesOppPair.length === need){
    const doubles = getDoublesBucket(ms);
    doubles.push({ tb: [...state.armedDoublesTBPair], opp: [...state.armedDoublesOppPair], format: state.groupFormat });
    state.armedDoublesTBPair = [];
    state.armedDoublesOppPair = [];
    saveMatchupState(ms).catch(err=>console.error('Matchup save failed', err));
  }
}
async function tapDoublesTBMember(playerId){
  const ms = state.matchupStateCache || await loadMatchupState();
  state.matchupStateCache = ms;
  const need = groupTeamSize(state.groupFormat);
  const idx = state.armedDoublesTBPair.indexOf(playerId);
  if(idx !== -1){ state.armedDoublesTBPair.splice(idx, 1); render(); return; } // tap again to deselect
  if(state.armedDoublesTBPair.length >= need){ showToast(need === 1 ? 'Singles is 1 player — tap an opponent' : 'Deselect one first'); return; }
  state.armedDoublesTBPair.push(playerId);
  finalizeDoublesMatchupIfReady(ms);
  render();
}
async function tapDoublesOppMember(oppId){
  const ms = state.matchupStateCache || await loadMatchupState();
  state.matchupStateCache = ms;
  const need = groupTeamSize(state.groupFormat);
  const idx = state.armedDoublesOppPair.indexOf(oppId);
  if(idx !== -1){ state.armedDoublesOppPair.splice(idx, 1); render(); return; } // tap again to deselect
  if(state.armedDoublesOppPair.length >= need){ showToast(need === 1 ? 'Singles is 1 player — tap a Two Buff player' : 'Deselect one first'); return; }
  state.armedDoublesOppPair.push(oppId);
  finalizeDoublesMatchupIfReady(ms);
  render();
}
async function unpairDoublesMatchup(index){
  const ms = state.matchupStateCache || await loadMatchupState();
  state.matchupStateCache = ms;
  const doubles = getDoublesBucket(ms);
  const eventId = ms.eventIdByTeam[ms.currentTeamId];
  const removed = doubles[index];
  doubles.splice(index, 1);
  render();
  saveMatchupState(ms).catch(err=>console.error('Matchup save failed', err));
  if(eventId && removed) clearDoublesResultIfExists(eventId, removed.tb[0]);
}
async function clearSinglesResultIfExists(eventId, tbId){
  const stats = await loadStats(eventId);
  const cur = stats[tbId];
  if(cur && cur.matchplay && cur.matchplay.played){
    cur.matchplay = blankResultEntry('matchplay');
    render();
    saveStats(eventId, stats).catch(err=>console.error('Result clear failed', err));
  }
}
async function clearDoublesResultIfExists(eventId, tbId){
  const stats = await loadStats(eventId);
  const cur = stats[tbId];
  if(cur && cur.doubles && cur.doubles.played){
    const norm = normalizeGroupEntry(cur.doubles);
    cur.doubles = blankResultEntry('doubles');
    (norm.partnerIds || []).forEach(pid=>{
      if(pid && stats[pid] && stats[pid].doubles){
        stats[pid].doubles = blankResultEntry('doubles');
      }
    });
    render();
    saveStats(eventId, stats).catch(err=>console.error('Result clear failed', err));
  }
}
async function recordSinglesResult(eventId, tbId, oppId, result){
  const teams = await loadOppTeams();
  const team = teams.find(t=>t.id === (state.matchupStateCache && state.matchupStateCache.currentTeamId));
  const opp = team && team.players.find(p=>p.id===oppId);
  const oppName = opp ? opp.name : '';
  const stats = await loadStats(eventId);
  const cur = stats[tbId] || {};
  const existing = cur.matchplay || blankResultEntry('matchplay');
  if(existing.played && existing.result === result){
    cur.matchplay = blankResultEntry('matchplay'); // tap again to clear
  } else {
    cur.matchplay = {played:true, result, powerRank: existing.powerRank || 5, opponentPlayerId: oppId, opponentName: oppName, marginUp: existing.marginUp ?? null, holesRemaining: existing.holesRemaining ?? null};
  }
  stats[tbId] = cur;
  render();
  saveStats(eventId, stats).catch(err=>console.error('Result save failed', err));
}
async function recordGroupResult(eventId, tbIds, oppIds, format, result){
  const teams = await loadOppTeams();
  const team = teams.find(t=>t.id === (state.matchupStateCache && state.matchupStateCache.currentTeamId));
  const tbPlayers = tbIds.map(id => state.players.find(p=>p.id===id)).filter(Boolean);
  const oppPlayers = oppIds.map(id => (team && team.players.find(p=>p.id===id)) || null);
  const oppIdsClean = [];
  const oppNames = [];
  oppIds.forEach((id,i)=>{ oppIdsClean.push(id); oppNames.push(oppPlayers[i] ? oppPlayers[i].name : ''); });

  const stats = await loadStats(eventId);
  const primaryId = tbIds[0];
  const existing = normalizeGroupEntry((stats[primaryId] && stats[primaryId].doubles) || blankResultEntry('doubles'));
  const clearing = existing.played && existing.result === result; // tap the same verdict again to clear

  tbIds.forEach(pid=>{
    const cur = stats[pid] || {};
    if(clearing){
      cur.doubles = blankResultEntry('doubles');
    } else {
      const partnerIds = [];
      const partnerNames = [];
      tbIds.forEach(otherId=>{
        if(otherId === pid) return; // teammates are everyone on this side except me
        partnerIds.push(otherId);
        const op = state.players.find(p=>p.id===otherId);
        partnerNames.push(op ? op.name : '');
      });
      cur.doubles = {
        played:true, result, format,
        powerRank: existing.powerRank || 5,
        partnerIds, partnerNames,
        oppIds: [...oppIdsClean], oppNames: [...oppNames],
        ourScore: existing.ourScore ?? null, oppScore: existing.oppScore ?? null, playoffHoles: existing.playoffHoles ?? null
      };
    }
    stats[pid] = cur;
  });
  render();
  saveStats(eventId, stats).catch(err=>console.error('Result save failed', err));
}
// Back-compat shim: existing doubles UI still calls recordDoublesResult with fixed args.
async function recordDoublesResult(eventId, tbId1, tbId2, oppId1, oppId2, result){
  return recordGroupResult(eventId, [tbId1, tbId2], [oppId1, oppId2], 'doubles', result);
}

            <label>Name</label>
            <input id="opp_edit_name" type="text" placeholder="Player name" value="${esc(player.name)}">
          </div>
          <div class="field">
            <label>Gender (optional)</label>
            <div class="seg-row" id="opp_edit_genderRow">
              <div class="seg-btn ${player.gender==='M' ? 'seg-sel':''}" data-v="M" onclick="selectSeg(this)">M · Male</div>
              <div class="seg-btn ${player.gender==='F' ? 'seg-sel':''}" data-v="F" onclick="selectSeg(this)">F · Female</div>
            </div>
          </div>
          <div class="divider"></div>
          ${renderPlayerBaselineFields('opp_edit', player)}
          <div class="divider"></div>
          <div class="field">
            <label>Suggested Two Buff Matchups (optional)</label>
            <div style="font-size:11.5px; color:var(--ink-soft); margin-bottom:8px;">Tap in order of preference — 1st tap is your top choice. Shown ranked as quick-pair shortcuts on the Matchups page.</div>
            <div class="seg-row" id="opp_edit_suggestedRow" style="flex-wrap:wrap;">
              ${state.players.map(p=>{
                const rank = _suggestEditOrder.indexOf(p.id);
                const sel = rank !== -1;
                return `<div class="seg-btn ${sel ? 'seg-sel':''}" data-v="${p.id}" onclick="toggleSuggestedPick('${p.id}')">${sel ? `<span class="suggest-rank">${rank+1}</span> ` : ''}${esc(p.name)}</div>`;
              }).join('')}
            </div>
          </div>
          <div class="btn-row">
            <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
            <button class="btn btn-primary" onclick="saveOppPlayerProfile('${teamId}','${playerId}')">Save</button>
          </div>
        </div>
      </div>`;
  });
}
async function saveOppPlayerProfile(teamId, playerId){
  const teams = await loadOppTeams();
  const team = teams.find(t=>t.id===teamId);
  const player = team && team.players.find(p=>p.id===playerId);
  if(!player) return;
  const name = document.getElementById('opp_edit_name').value.trim();
  if(!name){ showToast('Enter a name'); return; }
  const genderBtn = document.querySelector('#opp_edit_genderRow .seg-sel');
  player.name = name;
  player.gender = genderBtn ? genderBtn.dataset.v : null;
  Object.assign(player, readPlayerBaselineFields('opp_edit'));
  player.suggestedMatchups = [..._suggestEditOrder]; // preserve preference order
  await saveOppTeams(teams);
  closeModal();
  showToast('Player updated');
  render();
}

function openTeamEditModal(teamId){
  loadOppTeams().then(teams=>{
    const t = teamId ? teams.find(x=>x.id===teamId) : null;
    const modal = document.getElementById('modalRoot');
    modal.innerHTML = `
      <div class="overlay" onclick="closeModalIfBackdrop(event)">
        <div class="sheet" onclick="event.stopPropagation()">
          <h3>${t ? 'Edit Team' : 'Add Opponent Team'}</h3>
          <div class="field">
            <label>Team Name</label>
            <input id="opp_team_name" type="text" placeholder="e.g. Riverside Ravens" value="${t ? esc(t.name) : ''}">
          </div>
          <div class="field">
            <label>Roster — one player per line</label>
            <textarea id="opp_team_roster" rows="8" placeholder="Jane Smith&#10;John Doe&#10;..." style="width:100%; padding:12px; border-radius:12px; border:2px solid var(--line); font-size:14px; font-family:inherit; resize:vertical;">${t ? t.players.map(p=>esc(p.name)).join('\n') : ''}</textarea>
            <div style="font-size:11px; color:var(--ink-soft); margin-top:6px;">Quick-add by name here. After saving, tap any player on the Opponents page to add their skill rank, PDGA rating, throwing hand, age, or notes.</div>
          </div>
          <div class="btn-row">
            ${t ? `<button class="btn btn-danger" onclick="openDeleteTeamConfirm('${t.id}')">Delete</button>` : `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button>`}
            <button class="btn btn-primary" onclick="saveTeamFromModal('${teamId||''}')">${t ? 'Save Changes' : 'Add Team'}</button>
          </div>
        </div>
      </div>`;
  });
}
async function saveTeamFromModal(existingId){
  const name = document.getElementById('opp_team_name').value.trim();
  const lines = document.getElementById('opp_team_roster').value.split('\n').map(l=>l.trim()).filter(Boolean);
  if(!name){ showToast('Enter a team name'); return; }
  const teams = await loadOppTeams();
  const existingTeam = existingId ? teams.find(t=>t.id===existingId) : null;
  const players = lines.map(lineName=>{
    const existingPlayer = existingTeam && existingTeam.players.find(p=>p.name===lineName);
    return existingPlayer || { id: uid('opp'), name: lineName, notes: '', gender: null, skillRank: null, pdgaRating: null, throwHand: null, handedness: null, age: null };
  });
  if(existingTeam){
    const nameChanged = existingTeam.name !== name;
    existingTeam.name = name;
    existingTeam.players = players;
    await saveOppTeams(teams);
    // Auto-generated event titles embed the opponent's name, so refresh any events
    // linked to this team when it's renamed — keeps stored names current everywhere.
    if(nameChanged){
      let touched = false;
      state.events.forEach(evt=>{
        if(evt.opponentTeamId === existingTeam.id){
          const fresh = buildEventTitle(evt, teams);
          if(evt.name !== fresh){ evt.name = fresh; touched = true; }
        }
      });
      if(touched) await saveEvents();
    }
  } else {
    teams.push({ id: uid('oppteam'), name, players });
    await saveOppTeams(teams);
  }
  closeModal();
  showToast(existingTeam ? 'Team updated' : 'Team added');
  render();
}
function openDeleteTeamConfirm(teamId){
  loadOppTeams().then(teams=>{
    const t = teams.find(x=>x.id===teamId);
    if(!t) return;
    const modal = document.getElementById('modalRoot');
    modal.innerHTML = `
      <div class="overlay" onclick="closeModalIfBackdrop(event)">
        <div class="sheet" onclick="event.stopPropagation()">
          <h3>Remove ${esc(t.name)}?</h3>
          <div style="font-size:13.5px; color:var(--ink-soft); margin-bottom:16px;">This deletes the team and its roster. If it's the currently selected matchup opponent, the board will reset. This can't be undone.</div>
          <div class="btn-row">
            <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
            <button class="btn btn-danger" onclick="performDeleteTeam('${teamId}')">Delete</button>
          </div>
        </div>
      </div>`;
  });
}
async function performDeleteTeam(teamId){
  const teams = await loadOppTeams();
  const filtered = teams.filter(t=>t.id!==teamId);
  await saveOppTeams(filtered);
  const ms = await loadMatchupState();
  delete ms.singlesByTeam[teamId]; // that team's pairings no longer make sense once the roster is gone
  delete ms.doublesByTeam[teamId];
  if(ms.currentTeamId === teamId) ms.currentTeamId = null;
  state.matchupStateCache = null; // force a fresh fetch next time Matchups is opened
  await saveMatchupState(ms);
  closeModal();
  showToast('Team removed');
  render();
}

async function renderStats(){
  const FINALS_MIN_EVENTS = 3;
  const currentSeason = inferSeason(todayISO());

  // Map every known eventId -> its season, so stats keys (which are only keyed by eventId) can be filtered.
  const seasonByEvent = {};
  state.events.forEach(e=>{ seasonByEvent[e.id] = effectiveSeason(e); });

  const record = {}; // playerId -> {mpW,mpL,mpT,dbW,dbL,dbT, eventsPlayed:Set, powerScore}
  state.players.forEach(p=>{ record[p.id] = {mpW:0,mpL:0,mpT:0,dbW:0,dbL:0,dbT:0, eventsPlayed:new Set(), powerScore:0}; });

  // ---- Team Result aggregation state (filled in by the parallel block below) ----
  const teamEvents = []; // {event, result, ourScore, oppScore}
  let sumOur = 0, sumTotal = 0, tW=0, tL=0, tT=0;

  const loadPlayerStats = async ()=>{
    try{
      const allData = await getAllStatsData();
      Object.keys(allData).forEach(eventId=>{
        const eventSeason = seasonByEvent[eventId]; // undefined if the event was deleted
        if(eventSeason !== currentSeason) return; // Team Record and this page's quick-summary rows are current-season-only
        const data = allData[eventId];

        // Player-level aggregation (win/loss records, power score)
        Object.keys(data).forEach(pid=>{
          if(pid === '__adjustments') return; // not a player entry
          if(!record[pid]) record[pid] = {mpW:0,mpL:0,mpT:0,dbW:0,dbL:0,dbT:0, eventsPlayed:new Set(), powerScore:0};
          const s = data[pid];
          const playedThisEvent = !!((s.matchplay && s.matchplay.played) || (s.doubles && s.doubles.played));
          if(playedThisEvent) record[pid].eventsPlayed.add(eventId);
          [
            {entry: s.matchplay, weight: 1},   // singles matchplay counts full
            {entry: s.doubles, weight: 0.5}    // doubles is a shared effort, so it counts half toward individual ranking
          ].forEach(({entry, weight})=>{
            if(!entry || !entry.played) return;
            const rank = entry.powerRank || 5; // opponent quality, 1-10; defaults to a neutral 5 if never set
            if(entry.result==='W'){
              record[pid].powerScore += weight * ((rank >= 5) ? rank : 0); // beating a weak opponent doesn't boost you
            } else if(entry.result==='L'){
              record[pid].powerScore += weight * ((rank < 5) ? -(5 - rank) : 0); // losing to a quality opponent doesn't hurt you
            } // a tie is neutral — doesn't affect power score either way
          });
          if(s.matchplay && s.matchplay.played){
            if(s.matchplay.result==='W') record[pid].mpW++;
            else if(s.matchplay.result==='L') record[pid].mpL++;
            else if(s.matchplay.result==='T') record[pid].mpT++;
          }
          if(s.doubles && s.doubles.played){
            if(s.doubles.result==='W') record[pid].dbW++;
            else if(s.doubles.result==='L') record[pid].dbL++;
            else if(s.doubles.result==='T') record[pid].dbT++;
          }
        });

        // Team-level aggregation — derived live from the same data, doubles pairs deduped automatically.
        const ev = state.events.find(e=>e.id===eventId);
        if(!ev) return;
        const details = computeMatchDetailsFromData(data);
        if(details.result === null) return; // no results recorded at this event yet
        teamEvents.push({ event: ev, result: details.result, ourScore: details.totalUsPts, oppScore: details.totalOppPts });
        if(details.result==='W') tW++; else if(details.result==='L') tL++; else if(details.result==='T') tT++;
        sumOur += details.totalUsPts;
        sumTotal += details.totalUsPts + details.totalOppPts;
      });
    }catch(e){ /* no stats yet */ }
  };

  await loadPlayerStats();

  teamEvents.sort((a,b)=>b.event.date.localeCompare(a.event.date)); // most recent first
  const pointPct = sumTotal > 0 ? (sumOur/sumTotal*100) : null;

  const oppTeamsForRecord = await loadOppTeams();
  const teamEventCards = await Promise.all(teamEvents.map(async te=>{
    const d = fmtDate(te.event.date);
    const color = te.result==='W' ? 'var(--forest)' : te.result==='L' ? 'var(--red)' : '#8A6112';
    const bg = te.result==='W' ? '#E1E8F5' : te.result==='L' ? '#F5D9D6' : '#FBEFD8';
    const label = te.result==='W' ? 'WIN' : te.result==='L' ? 'LOSS' : te.result==='T' ? 'TIE' : '—';
    const evPct = (te.ourScore!=null && te.oppScore!=null && (te.ourScore+te.oppScore)>0) ? ((te.ourScore/(te.ourScore+te.oppScore))*100).toFixed(1)+'%' : '—';
    const expanded = state.expandedTeamEventId === te.event.id;
    const breakdownHtml = expanded ? await renderEventMatchBreakdown(te.event.id) : '';
    let oppLabelForCard = 'Opponent';
    if(te.event.opponentTeamId){
      const t = oppTeamsForRecord.find(x=>x.id===te.event.opponentTeamId);
      if(t) oppLabelForCard = t.name;
    } else if(te.event.opponentName){
      oppLabelForCard = te.event.opponentName;
    }
    return `
      <div class="player-stat-card" onclick="toggleExpandTeamEvent('${te.event.id}')">
        <div class="row-grid" style="grid-template-columns: 0.7fr 1.5fr 0.9fr;">
          <div style="text-align:center;">
            <span class="pill" style="background:${bg}; color:${color};">${label}</span>
          </div>
          <div>
            <div style="display:flex; align-items:center; gap:6px;">
              <span class="pname" style="font-size:13.5px;">${esc(formatMatchupTitle(te.event, oppLabelForCard))}</span>
              <span style="font-size:10px; color:var(--ink-soft);">${expanded ? '▲' : '▼'}</span>
            </div>
            <div style="font-size:10.5px; color:var(--ink-soft); font-weight:700;">${d.mon} ${d.day}</div>
          </div>
          <div class="rec" style="color:${color};">${(te.ourScore!=null && te.oppScore!=null) ? te.ourScore+'–'+te.oppScore : '—'}<span class="sub">${evPct} PTS</span></div>
        </div>
        ${expanded ? `<div onclick="event.stopPropagation()">${breakdownHtml}</div>` : ''}
      </div>`;
  }));
  const teamEventsHtml = teamEventCards.join('');

  const teamRecordSection = `
    <div class="stats-section-header">🏆 Team Record</div>
    <div class="card">
      <div class="stat-grid">
        <div class="stat-box"><div class="num" style="color:var(--forest);">${tW}-${tL}-${tT}</div><div class="lbl">Win-Loss-Tie</div></div>
        <div class="stat-box"><div class="num" style="color:var(--orange-dark);">${pointPct!=null ? pointPct.toFixed(1)+'%' : '—'}</div><div class="lbl">Point %</div></div>
      </div>
      <button class="btn btn-outline btn-sm" style="width:100%; margin-top:10px;" onclick="shareTeamRecordCard()">⬇️ Share Image</button>
    </div>
    ${teamEventsHtml ? teamEventsHtml : `<div class="card empty" style="padding:20px;"><p style="margin:0; font-size:13px;">No team results recorded yet for ${esc(currentSeason)}.</p></div>`}
  `;

  const sortedPlayers = [...state.players].sort((a,b)=> record[b.id].powerScore - record[a.id].powerScore);
  const rowCards = await Promise.all(sortedPlayers.map(async p=>{
    const r = record[p.id];
    const hasMp = (r.mpW+r.mpL+r.mpT) > 0;
    const hasDb = (r.dbW+r.dbL+r.dbT) > 0;
    const eventsPlayed = r.eventsPlayed.size;
    const qualified = eventsPlayed >= FINALS_MIN_EVENTS;
    const expanded = state.expandedPlayerId === p.id;
    const historyHtml = expanded ? await renderPlayerHistoryHtml(p.id) : '';
    return `
      <div class="player-stat-card" style="${qualified ? 'background:#FFF3E6; border-color:var(--orange);' : ''}" onclick="toggleExpandPlayer('${p.id}')">
        <div class="row-grid">
          <div>
            <div style="display:flex; align-items:center; gap:6px;">
              <span class="pname">${esc(p.name)}</span>
              <span style="font-size:10px; color:var(--ink-soft);">${expanded ? '▲' : '▼'}</span>
            </div>
            <div style="font-size:10.5px; font-weight:700; color:${qualified ? 'var(--orange-dark)' : 'var(--ink-soft)'}; margin-top:2px;">
              Events Played: ${eventsPlayed}${qualified ? ' ⭐' : ''}
            </div>
          </div>
          <div class="rec" style="color:${hasMp ? 'var(--forest-dark)':'var(--ink-soft)'};">${hasMp ? r.mpW+'-'+r.mpL+'-'+r.mpT : '—'}<span class="sub">Singles</span></div>
          <div class="rec" style="color:${hasDb ? 'var(--forest-dark)':'var(--ink-soft)'};">${hasDb ? r.dbW+'-'+r.dbL+'-'+r.dbT : '—'}<span class="sub">Doubles</span></div>
        </div>
        ${expanded ? `<div onclick="event.stopPropagation()">${renderPlayerProfileSummary(p, false)}${historyHtml}</div>` : ''}
      </div>`;
  }));
  const rows = rowCards.join('');

  return `
    ${teamRecordSection}
    <div class="stats-section-header">👤 Player Stats</div>
    <div class="stats-header-row">
      <div>Player</div><div style="text-align:center;">Singles W-L</div><div style="text-align:center;">Doubles W-L</div>
    </div>
    ${rows || `<div class="card empty"><span class="em">🏆</span><p>No results recorded yet for ${esc(currentSeason)}. Enter results from an event page in Admin mode.</p></div>`}
    <div class="card" style="background:var(--chip-bg); border:none; box-shadow:none; margin-top:6px;">
      <div style="font-size:12.5px; color:var(--ink-soft); line-height:1.5;">Showing <strong>${esc(currentSeason)}</strong> only. Players are ranked using their win-loss record, weighted behind the scenes by the quality of competition they faced — a loss to a strong opponent won't hurt someone's ranking, and a win over a weak one won't boost it. <strong style="color:var(--orange-dark);">🏁 Finals Qualified</strong> means a recorded result at ${FINALS_MIN_EVENTS}+ different events — just being confirmed doesn't count. Stats are optional per player — someone who only plays doubles just shows a dash for Singles.</div>
    </div>
  `;
}

/* ============================= BACKUP / RESTORE ============================= */
async function exportBackup(){
  try{
    const backup = { version: 1, exportedAt: new Date().toISOString(), players: state.players, events: state.events, rsvp: {}, stats: {}, teamResults: {} };
    const rsvpList = await window.storage.list('dg_rsvp_', true);
    const rsvpKeys = (rsvpList && rsvpList.keys) || [];
    const rsvpRaws = await Promise.all(rsvpKeys.map(k=>storeGet(k, true)));
    rsvpKeys.forEach((k,i)=>{ if(rsvpRaws[i]) backup.rsvp[k] = JSON.parse(rsvpRaws[i]); });

    const statsList = await window.storage.list('dg_stats_', true);
    const statsKeys = (statsList && statsList.keys) || [];
    const statsRaws = await Promise.all(statsKeys.map(k=>storeGet(k, true)));
    statsKeys.forEach((k,i)=>{ if(statsRaws[i]) backup.stats[k] = JSON.parse(statsRaws[i]); });

    const teamResultList = await window.storage.list('dg_teamresult_', true);
    const teamResultKeys = (teamResultList && teamResultList.keys) || [];
    const teamResultRaws = await Promise.all(teamResultKeys.map(k=>storeGet(k, true)));
    teamResultKeys.forEach((k,i)=>{ if(teamResultRaws[i]) backup.teamResults[k] = JSON.parse(teamResultRaws[i]); });
    const blob = new Blob([JSON.stringify(backup, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const stamp = new Date().toISOString().slice(0,10);
    a.href = url;
    a.download = `two-buff-team-hub-backup-${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('Backup downloaded');
  }catch(e){
    console.error(e);
    showToast('Export failed — try again');
  }
}

async function importBackup(file){
  if(!file) return;
  try{
    const text = await file.text();
    const backup = JSON.parse(text);
    if(!backup || !Array.isArray(backup.players) || !Array.isArray(backup.events)){
      showToast('That file doesn\'t look like a valid backup');
      return;
    }
    state.players = backup.players;
    state.events = backup.events;
    await savePlayers();
    await saveEvents();
    for(const k of Object.keys(backup.rsvp || {})){
      await storeSet(k, JSON.stringify(backup.rsvp[k]), true);
    }
    for(const k of Object.keys(backup.stats || {})){
      await storeSet(k, JSON.stringify(backup.stats[k]), true);
    }
    for(const k of Object.keys(backup.teamResults || {})){
      await storeSet(k, JSON.stringify(backup.teamResults[k]), true);
    }
    state.rsvpCache = {};
    state.statsCache = {};
    state.benchCache = {};
    showToast('Backup restored');
    render();
  }catch(e){
    console.error(e);
    showToast('Restore failed — check the file');
  }
}

function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function cleanPhoneHref(phone){
  // Keep a leading + (country code) and digits only, for sms:/tel: links.
  const trimmed = String(phone||'').trim();
  const plus = trimmed.startsWith('+') ? '+' : '';
  return plus + trimmed.replace(/[^0-9]/g,'');
}
