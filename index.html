}
async function setDoublesScore(eventId, tbId, side, value){
  const stats = await loadStats(eventId);
  const cur = stats[tbId] || {};
  const existing = normalizeGroupEntry(cur.doubles || blankResultEntry('doubles'));
  if(!existing.played) return;
  const num = value === '' ? null : Number(value);
  const parsed = (num===null || isNaN(num)) ? null : num;
  if(side === 'our') existing.ourScore = parsed;
  else existing.oppScore = parsed;
  cur.doubles = existing;
  stats[tbId] = cur;
  // Every teammate holds their own mirrored copy of the shared team score — keep all in sync.
  (existing.partnerIds || []).forEach(pid=>{
    if(!pid) return;
    const curPartner = stats[pid] || {};
    const partnerEntry = normalizeGroupEntry(curPartner.doubles || blankResultEntry('doubles'));
    if(side === 'our') partnerEntry.ourScore = parsed; else partnerEntry.oppScore = parsed;
    curPartner.doubles = partnerEntry;
    stats[pid] = curPartner;
  });
  render();
  saveStats(eventId, stats).catch(err=>console.error('Score save failed', err));
}
async function setDoublesPlayoffHoles(eventId, tbId, value){
  const stats = await loadStats(eventId);
  const cur = stats[tbId] || {};
  const existing = normalizeGroupEntry(cur.doubles || blankResultEntry('doubles'));
  if(!existing.played) return;
  const num = value === '' ? null : Math.max(1, Number(value));
  const parsed = (num===null || isNaN(num)) ? null : num;
  existing.playoffHoles = parsed;
  cur.doubles = existing;
  stats[tbId] = cur;
  (existing.partnerIds || []).forEach(pid=>{
    if(!pid) return;
    const curPartner = stats[pid] || {};
    const partnerEntry = normalizeGroupEntry(curPartner.doubles || blankResultEntry('doubles'));
    partnerEntry.playoffHoles = parsed;
    curPartner.doubles = partnerEntry;
    stats[pid] = curPartner;
  });
  render();
  saveStats(eventId, stats).catch(err=>console.error('Playoff holes save failed', err));
}
async function setPowerRank(eventId, playerId, kind, value){
  const stats = await loadStats(eventId);
  const cur = stats[playerId] || {};
  const existing = cur[kind] || {played:false, result:null, powerRank:null};
  if(!existing.played) return;
  const rankValue = Math.max(1, Math.min(10, Number(value) || 5));
  existing.powerRank = rankValue;
  cur[kind] = existing;
  stats[playerId] = cur;
  if(kind === 'doubles'){
    const norm = normalizeGroupEntry(existing);
    (norm.partnerIds || []).forEach(pid=>{
      if(!pid) return;
      const curPartner = stats[pid] || {};
      const partnerEntry = normalizeGroupEntry(curPartner.doubles || blankResultEntry('doubles'));
      partnerEntry.powerRank = rankValue;
      curPartner.doubles = partnerEntry;
      stats[pid] = curPartner;
    });
  }
  render();
  saveStats(eventId, stats).catch(err=>console.error('Power rank save failed', err));
}

/* ============================= TEAM ============================= */
async function getAllStatsData(){
  if(state.allStatsCache) return state.allStatsCache;
  const listRes = await window.storage.list('dg_stats_', true);
  const keys = (listRes && listRes.keys) || [];
  const map = {};
  if(listRes && listRes.values){
    // Fast path: the list query already returned every document's data — no extra round trips needed.
    keys.forEach(k=>{
      const raw = listRes.values[k];
      if(raw) map[k.slice('dg_stats_'.length)] = JSON.parse(raw);
    });
  } else {
    // Fallback for storage backends that only return key names from list().
    const raws = await Promise.all(keys.map(k=>storeGet(k, true)));
    keys.forEach((k,i)=>{
      if(!raws[i]) return;
      map[k.slice('dg_stats_'.length)] = JSON.parse(raws[i]);
    });
  }
  state.allStatsCache = map;
  return map;
}
async function getPlayerEventHistory(playerId){
  const allData = await getAllStatsData();
  const history = [];
  Object.keys(allData).forEach(eventId=>{
    const ev = state.events.find(e=>e.id===eventId);
    if(!ev) return; // event deleted
    const s = allData[eventId][playerId];
    if(!s) return;
    const playedMp = !!(s.matchplay && s.matchplay.played);
    const playedDb = !!(s.doubles && s.doubles.played);
    if(!playedMp && !playedDb) return;
    history.push({ event: ev, matchplay: playedMp ? s.matchplay : null, doubles: playedDb ? normalizeGroupEntry(s.doubles) : null });
  });
  history.sort((a,b)=> b.event.date.localeCompare(a.event.date));
  return history;
}
// Pure, synchronous core shared by both the Stats page (async wrapper, fresh data) and
// the Matchups page (sync wrapper, reads from already-loaded caches) — takes
// already-resolved opponent rosters and stats data so it never needs to fetch anything
// itself. Builds two lists (singles, doubles) for one player, filtered to one season
// (or 'all'), merging the historical archive (matchHistory, singles and doubles, imported from
// past seasons) with live in-app results (dg_stats_, both formats, this season forward).
// For opponents, dg_stats_ never has an entry keyed by their own id — results are only
// ever recorded keyed by our own player — so their singles results are reconstructed by
// scanning every event for any entry that names them and flipping the result to their
// side. Opponent-side doubles are reconstructed the same way — their partner's name,
// team, and flipped score are all resolved from our own recorded entry.
function buildHistoryRows(player, isOpponent, scope, oppTeamsList, statsMap){
  const resolveOppContext = (oppId, fallbackName) => {
    for(const t of oppTeamsList){
      const found = (t.players || []).find(pl => pl.id === oppId);
      if(found) return { name: found.name, team: t.name, pdga: found.pdgaRating || null, rank: found.skillRank != null ? found.skillRank : null };
    }
    return { name: fallbackName || 'Unknown', team: null, pdga: null, rank: null };
  };
  const resultStyle = (result) => ({
    color: result==='W' ? 'var(--forest)' : result==='T' ? '#8A6112' : 'var(--red)',
    bg: result==='W' ? '#E1E8F5' : result==='T' ? '#FBEFD8' : '#F5D9D6'
  });
  const rowHtml = (nameLabel, identifier, subLabel, result) => {
    const { color, bg } = resultStyle(result);
    return `
      <div style="display:flex; align-items:center; gap:8px; padding:6px 0; border-top:1px solid var(--line); font-size:12px;">
        <span class="pill" style="background:${bg}; color:${color}; font-size:10px; font-weight:800; white-space:nowrap; flex-shrink:0;">${result}</span>
        <span>${nameLabel} ${identifier ? `<span style="color:var(--ink-soft); font-size:11px;">(${esc(identifier)})</span>` : ''}<span style="color:var(--ink-soft); font-size:10.5px; display:block;">${esc(subLabel)}</span></span>
      </div>`;
  };
  const matchScope = (season) => scope === 'all' || season === scope;

  // ---- SINGLES: historical archive + live ----
  // Each row also carries a `raw` copy of its plain-text fields (no HTML escaping/
  // markup) so canvas-based renderers (the share images) can draw the exact same
  // data as this HTML list without re-deriving it or parsing HTML back out.
  let singlesRows = [];
  (player.matchHistory || []).filter(h => (h.type||'singles')==='singles').forEach(h=>{
    if(!matchScope(h.season)) return;
    const identifier = [h.opponentTeam, h.opponentPdga?`PDGA ${h.opponentPdga}`:null, h.opponentPowerRank!=null?`Rank ${Number(h.opponentPowerRank).toFixed(1)}`:null].filter(Boolean).join(' · ');
    singlesRows.push({ sortKey: h.season||'', html: rowHtml(`vs ${esc(h.opponent)}`, identifier, h.event, h.result), result: h.result,
      raw: { title: `vs ${h.opponent}`, identifier, subLabel: h.event, scoreLabel: null, formatLabel: null } });
  });
  Object.keys(statsMap).forEach(eventId=>{
    const ev = state.events.find(e=>e.id===eventId);
    if(!ev) return;
    const season = effectiveSeason(ev);
    if(!matchScope(season)) return;
    const d = fmtDate(ev.date);
    const data = statsMap[eventId];
    if(isOpponent){
      Object.keys(data).forEach(tbId=>{
        if(tbId === '__adjustments') return;
        const s = data[tbId];
        if(!s.matchplay || !s.matchplay.played || s.matchplay.opponentPlayerId !== player.id) return;
        const tb = state.players.find(p=>p.id===tbId);
        const oppResult = s.matchplay.result === 'W' ? 'L' : s.matchplay.result === 'L' ? 'W' : 'T';
        const tbName = tb ? tb.name : 'Two Buff player';
        singlesRows.push({ sortKey: ev.date, html: rowHtml(`vs ${esc(tbName)}`, '2Buff', `${esc(ev.name)} · ${d.mon} ${d.day}`, oppResult), result: oppResult,
          raw: { title: `vs ${tbName}`, identifier: '2Buff', subLabel: `${ev.name} · ${d.mon} ${d.day}`, scoreLabel: null, formatLabel: null } });
      });
    } else {
      const s = data[player.id];
      if(s && s.matchplay && s.matchplay.played){
        const ctx = resolveOppContext(s.matchplay.opponentPlayerId, s.matchplay.opponentName);
        const identifier = [ctx.team, ctx.pdga?`PDGA ${ctx.pdga}`:null, ctx.rank!=null?`Rank ${Number(ctx.rank).toFixed(1)}`:null].filter(Boolean).join(' · ');
        const margin = formatMatchplayMargin(s.matchplay);
        singlesRows.push({ sortKey: ev.date, html: rowHtml(`vs ${esc(ctx.name)}`, identifier, `${esc(ev.name)} · ${d.mon} ${d.day}`, s.matchplay.result), result: s.matchplay.result,
          raw: { title: `vs ${ctx.name}`, identifier, subLabel: `${ev.name} · ${d.mon} ${d.day}`, scoreLabel: margin || null, formatLabel: null } });
      }
    }
  });
  singlesRows.sort((a,b)=> (b.sortKey||'').localeCompare(a.sortKey||''));
  const sRec = singlesRows.reduce((acc,r)=>{ acc[r.result]=(acc[r.result]||0)+1; return acc; }, {});
  const singlesRecordLine = `${sRec.W||0}-${sRec.L||0}${sRec.T?`-${sRec.T}`:''}`;

  // ---- DOUBLES: historical archive (imported, type:'doubles') + live ----
  let doublesRows = [];
  (player.matchHistory || []).filter(h => h.type === 'doubles').forEach(h=>{
    if(!matchScope(h.season)) return;
    const nameLabelRaw = (h.partner ? `w/ ${h.partner} ` : '') + 'vs ' + h.opponent;
    const nameLabel = esc(nameLabelRaw);
    const identifier = h.opponentTeam || '';
    doublesRows.push({ sortKey: h.season||'', html: rowHtml(nameLabel, identifier, h.event, h.result), result: h.result,
      raw: { title: nameLabelRaw, identifier, subLabel: h.event, scoreLabel: null, formatLabel: null } });
  });
  Object.keys(statsMap).forEach(eventId=>{
    const ev = state.events.find(e=>e.id===eventId);
    if(!ev) return;
    const season = effectiveSeason(ev);
    if(!matchScope(season)) return;
    const d = fmtDate(ev.date);
    const data = statsMap[eventId];

    if(!isOpponent){
      const s = data[player.id];
      if(!s || !s.doubles || !s.doubles.played) return;
      const e = normalizeGroupEntry(s.doubles);
      const oppContexts = (e.oppIds||[]).map((id,i)=>resolveOppContext(id, (e.oppNames||[])[i]));
      const oppNamesJoined = oppContexts.map(c=>c.name).join(' & ') || 'Unknown opponents';
      const team = oppContexts.find(c=>c.team)?.team;
      const partners = (e.partnerNames||[]).filter(Boolean).join(' & ');
      const scoreText = formatDoublesScore(e);
      const identifier = [team, scoreText].filter(Boolean).join(' · ');
      const nameLabelRaw = (partners?`w/ ${partners} `:'') + 'vs ' + oppNamesJoined;
      const nameLabel = esc(nameLabelRaw);
      doublesRows.push({ sortKey: ev.date, html: rowHtml(nameLabel, identifier, `${groupFormatLabel(e.format)} · ${esc(ev.name)} · ${d.mon} ${d.day}`, e.result), result: e.result,
        raw: { title: nameLabelRaw, identifier: [team, scoreText].filter(Boolean).join(' · '), subLabel: `${ev.name} · ${d.mon} ${d.day}`, scoreLabel: scoreText || null,
          formatLabel: (e.format && e.format !== 'doubles') ? groupFormatLabel(e.format) : null } });
    } else {
      // Same reconstruction idea as opponent singles: dg_stats_ only ever stores a
      // doubles entry keyed by our own players, with the opponent pair referenced
      // inside it. Scan every one of our players' doubles entries in this event for
      // any that name this specific opponent, then flip perspective — their side's
      // "opponent" is our TB pairing, their partner is the other name in oppIds, and
      // the score/result both flip. Every TB partner on our side carries an identical
      // duplicated copy of the same entry, so a signature (the sorted oppIds) is
      // tracked per event to avoid counting the same real match twice.
      const seenSignatures = new Set();
      Object.keys(data).forEach(tbId=>{
        if(tbId === '__adjustments') return;
        const s = data[tbId];
        if(!s.doubles || !s.doubles.played) return;
        const e = normalizeGroupEntry(s.doubles);
        if(!(e.oppIds||[]).includes(player.id)) return;
        const signature = [...(e.oppIds||[])].sort().join(',');
        if(seenSignatures.has(signature)) return;
        seenSignatures.add(signature);

        const tb = state.players.find(p=>p.id===tbId);
        const tbSideNames = [tb ? tb.name : 'Two Buff player', ...(e.partnerNames||[])].filter(Boolean).join(' & ');
        const partnerNames = (e.oppIds||[]).filter(id=>id!==player.id).map(id=>{
          for(const t of oppTeamsList){
            const found = (t.players||[]).find(pl=>pl.id===id);
            if(found) return found.name;
          }
          return null;
        }).filter(Boolean);
        const partners = partnerNames.join(' & ');
        const oppResult = e.result === 'W' ? 'L' : e.result === 'L' ? 'W' : 'T';
        const flippedScore = formatDoublesScore({ ourScore: e.oppScore, oppScore: e.ourScore, playoffHoles: e.playoffHoles });
        const identifier = ['2Buff', flippedScore].filter(Boolean).join(' · ');
        const nameLabelRaw = (partners?`w/ ${partners} `:'') + 'vs ' + tbSideNames;
        const nameLabel = esc(nameLabelRaw);
        doublesRows.push({ sortKey: ev.date, html: rowHtml(nameLabel, identifier, `${groupFormatLabel(e.format)} · ${esc(ev.name)} · ${d.mon} ${d.day}`, oppResult), result: oppResult,
          raw: { title: nameLabelRaw, identifier, subLabel: `${ev.name} · ${d.mon} ${d.day}`, scoreLabel: flippedScore || null,
            formatLabel: (e.format && e.format !== 'doubles') ? groupFormatLabel(e.format) : null } });
      });
    }
  });
  doublesRows.sort((a,b)=> (b.sortKey||'').localeCompare(a.sortKey||''));
  const dRec = doublesRows.reduce((acc,r)=>{ acc[r.result]=(acc[r.result]||0)+1; return acc; }, {});
  const doublesRecordLine = `${dRec.W||0}-${dRec.L||0}${dRec.T?`-${dRec.T}`:''}`;

  return { singlesRows, doublesRows, singlesRecordLine, doublesRecordLine };
}
// Every distinct season we have any data for, newest first, for building season-pill
// selectors. Pulls from both the historical archive (matchHistory, tagged at import
// time — our own roster already carries the same season tags as every opponent, since
// they were imported from the same source files) and live events — so it stays correct
// automatically as new seasons get added, with no hardcoded season list to maintain.
function getAvailableSeasons(){
  const seasons = new Set();
  state.players.forEach(p => (p.matchHistory||[]).forEach(h => { if(h.season) seasons.add(h.season); }));
  state.events.forEach(e => seasons.add(effectiveSeason(e)));
  return [...seasons].sort().reverse();
}

function computeMatchDetailsFromData(stats){
  const singles = [];   // matchplay singles only
  const doubles = [];   // all stroke-play group results (singles-stroke, doubles, triples)
  const countedForDoubles = new Set();
  Object.keys(stats).forEach(pid=>{
    if(pid === '__adjustments') return; // not a player entry — handled separately below
    const s = stats[pid];
    const ourPlayer = state.players.find(p=>p.id===pid);
    const ourName = ourPlayer ? ourPlayer.name : 'Former player';
    if(s.matchplay && s.matchplay.played){
      singles.push({ ourName, result: s.matchplay.result, opponentName: s.matchplay.opponentName || 'Unknown opponent', marginUp: s.matchplay.marginUp, holesRemaining: s.matchplay.holesRemaining });
    }
    if(s.doubles && s.doubles.played && !countedForDoubles.has(pid)){
      const db = normalizeGroupEntry(s.doubles);
      countedForDoubles.add(pid);
      (db.partnerIds || []).forEach(id=>countedForDoubles.add(id));
      const ourNames = [ourName, ...(db.partnerNames || [])].filter(Boolean);
      const ourSide = ourNames.join(' & ') || ourName;
      const oppSide = (db.oppNames || []).filter(Boolean).join(' & ') || 'Unknown opponents';
      doubles.push({ ourSide, format: db.format || 'doubles', result: db.result, opponentName: oppSide, ourScore: db.ourScore, oppScore: db.oppScore, playoffHoles: db.playoffHoles });
    }
  });
  // A win is worth its format's full point value; a tie splits that value evenly between both teams.
  const mpUsPts = singles.filter(s=>s.result==='W').length * 1 + singles.filter(s=>s.result==='T').length * 0.5;
  const mpOppPts = singles.filter(s=>s.result==='L').length * 1 + singles.filter(s=>s.result==='T').length * 0.5;
  let dbUsPts = 0, dbOppPts = 0;
  doubles.forEach(d=>{
    const pts = groupFormatWinPoints(d.format);
    if(d.result === 'W') dbUsPts += pts;
    else if(d.result === 'L') dbOppPts += pts;
    else if(d.result === 'T'){ dbUsPts += pts/2; dbOppPts += pts/2; }
  });

  const adjustments = Array.isArray(stats.__adjustments) ? stats.__adjustments : [];
  const adjUsPts = adjustments.filter(a=>a.team==='us').reduce((sum,a)=>sum + a.points, 0);
  const adjOppPts = adjustments.filter(a=>a.team==='opponent').reduce((sum,a)=>sum + a.points, 0);

  const totalUsPts = mpUsPts + dbUsPts + adjUsPts;
  const totalOppPts = mpOppPts + dbOppPts + adjOppPts;
  const hasAnyResult = (singles.length + doubles.length + adjustments.length) > 0;
  const result = !hasAnyResult ? null : totalUsPts > totalOppPts ? 'W' : totalUsPts < totalOppPts ? 'L' : 'T';
  return { singles, doubles, mpUsPts, mpOppPts, dbUsPts, dbOppPts, adjustments, adjUsPts, adjOppPts, totalUsPts, totalOppPts, result };
}
async function getTeamRecordData(){
  const currentSeason = inferSeason(todayISO());
  const scope = 'season'; // Team Record is always current-season-only now, per design
  const seasonByEvent = {};
  state.events.forEach(e=>{ seasonByEvent[e.id] = effectiveSeason(e); });

  const teamEvents = []; // {event, result, ourScore, oppScore}
  let sumOur = 0, sumTotal = 0, tW=0, tL=0, tT=0;

  try{
    const allData = await getAllStatsData();
    Object.keys(allData).forEach(eventId=>{
      const eventSeason = seasonByEvent[eventId];
      if(scope === 'season' && eventSeason !== currentSeason) return;
      const data = allData[eventId];
      const ev = state.events.find(e=>e.id===eventId);
      if(!ev) return;
      const details = computeMatchDetailsFromData(data);
      if(details.result === null) return; // no results recorded at this event yet
      teamEvents.push({ event: ev, result: details.result, ourScore: details.totalUsPts, oppScore: details.totalOppPts });
      if(details.result==='W') tW++; else if(details.result==='L') tL++; else if(details.result==='T') tT++;
      sumOur += details.totalUsPts;
      sumTotal += details.totalUsPts + details.totalOppPts;
    });
  }catch(e){ /* no stats yet */ }

  teamEvents.sort((a,b)=>b.event.date.localeCompare(a.event.date)); // most recent first
  const pointPct = sumTotal > 0 ? (sumOur/sumTotal*100) : null;
  return { currentSeason, scope, teamEvents, tW, tL, tT, pointPct };
}

function ctxRoundRect(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}
function ctxTruncateText(ctx, text, maxWidth){
  if(ctx.measureText(text).width <= maxWidth) return text;
  let t = text;
  while(t.length > 1 && ctx.measureText(t + '…').width > maxWidth){
    t = t.slice(0, -1);
  }
  return t + '…';
}
function loadImageAsync(src){
  return new Promise(resolve=>{
    if(!src){ resolve(null); return; }
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => resolve(null);
    img.src = src;
  });
}
async function shareEventCard(eventId){
  // ---- 1. Gather every piece of data the card needs, up front ----
  const ev = state.events.find(e=>e.id===eventId);
  if(!ev){ showToast('Event not found'); return; }
  let opponentLabel = 'Opponent';
  if(ev.opponentTeamId){
    const teams = await loadOppTeams();
    const t = teams.find(x=>x.id===ev.opponentTeamId);
    if(t) opponentLabel = t.name;
  } else if(ev.opponentName){
    opponentLabel = ev.opponentName;
  }
  const { singles, doubles, mpUsPts, mpOppPts, dbUsPts, dbOppPts, totalUsPts, totalOppPts, result, adjustments } = await getEventMatchDetails(eventId);
  showToast('Generating image…');
  const logoEl = document.querySelector('.brand-mark img');
  const logoImg = await loadImageAsync(logoEl ? logoEl.src : null);

  // ---- 2. Core geometry. CENTER_X is the single source of truth for centering —
  // every centered element anchors to this value, nothing else. ----
  const W = 760, scale = 2, marginX = 60, cardRadius = 20;
  const CENTER_X = W / 2;
  const contentW = W - marginX*2;
  const FONT = '-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif';

  const rowH = 48, compactRowH = 30, colHeaderH = 22, sectionHeaderH = 32, headerH = 112, scoreH = 100, subtotalH = 38, gapAfterSection = 20, bottomPad = 24;
  // Beyond a handful of matches, one tall column of rows would make the image far
  // too tall to share well. Past 8 rows we switch to a compact style split across
  // 2 or 3 side-by-side columns instead, capping height growth for big events.
  const sectionLayout = (rowCount) => {
    if(rowCount <= 8) return { numCols: 1, rowsPerCol: Math.max(rowCount, 1), rh: rowH, compact: false };
    const numCols = rowCount <= 18 ? 2 : 3;
    return { numCols, rowsPerCol: Math.ceil(rowCount / numCols), rh: compactRowH, compact: true };
  };
  const singlesLayout = sectionLayout(singles.length);
  const doublesLayout = sectionLayout(doubles.length);
  const singlesSectionH = sectionHeaderH + colHeaderH + singlesLayout.rowsPerCol*singlesLayout.rh + subtotalH + gapAfterSection;
  const doublesSectionH = sectionHeaderH + colHeaderH + doublesLayout.rowsPerCol*doublesLayout.rh + subtotalH;
  const adjRowH = 40, adjRowHNoNote = 24;
  const adjustmentsRowsH = adjustments.reduce((sum,a)=> sum + (a.note ? adjRowH : adjRowHNoNote), 0);
  const adjustmentsSectionH = adjustments.length ? (gapAfterSection + sectionHeaderH + adjustmentsRowsH) : 0;
  const totalH = headerH + scoreH + singlesSectionH + doublesSectionH + adjustmentsSectionH + bottomPad;
  // Splits rows into numCols groups as evenly as possible (sizes never differ by
  // more than 1), instead of filling earlier columns first and leaving the last
  // one nearly empty.
  const distributeIntoColumns = (rows, numCols) => {
    const n = rows.length;
    const base = Math.floor(n / numCols);
    const remainder = n % numCols;
    const cols = [];
    let idx = 0;
    for(let i=0; i<numCols; i++){
      const size = base + (i < remainder ? 1 : 0);
      cols.push(rows.slice(idx, idx+size));
      idx += size;
    }
    return cols;
  };

  // ---- 3. Create the canvas ----
  const draw = document.createElement('canvas');
  draw.width = W*scale;
  draw.height = totalH*scale;
  const ctx = draw.getContext('2d');
  ctx.scale(scale, scale);

  // ---- 4. Background ----
  ctx.fillStyle = '#F4F6FA';
  ctx.fillRect(0, 0, W, totalH);

  // ---- 5. Header: gradient band, logo watermark, title, date ----
  const headerGrad = ctx.createLinearGradient(0, 0, W, headerH);
  headerGrad.addColorStop(0, '#0A1830');
  headerGrad.addColorStop(1, '#12294D');
  ctx.fillStyle = headerGrad;
  ctx.fillRect(0, 0, W, headerH);

  if(logoImg){
    ctx.save();
    ctx.globalAlpha = 0.16;
    const logoSize = 200;
    ctx.drawImage(logoImg, W - logoSize*0.62, -logoSize*0.28, logoSize, logoSize);
    ctx.restore();
  }

  ctx.textAlign = 'left';
  ctx.fillStyle = '#FFFFFF';
  ctx.font = `800 24px ${FONT}`;
  ctx.fillText(ctxTruncateText(ctx, formatMatchupTitle(ev, opponentLabel), contentW), marginX, 54);
  ctx.fillStyle = '#FFCB57';
  ctx.fillRect(marginX, 65, 42, 4);
  ctx.fillStyle = '#B8C4D9';
  ctx.font = `600 14px ${FONT}`;
  ctx.fillText(fmtDateLong(ev.date), marginX, 90);

  let y = headerH;

  // ---- 6. Score marquee. This is the anchor for the whole card, so it's built
  // first and centered using text-align anchoring rather than measured offsets —
  // the left score's RIGHT edge sits exactly at CENTER_X-gap, the right score's
  // LEFT edge sits exactly at CENTER_X+gap. The gap between them is the true
  // center of the card, guaranteed by the browser's own text layout, not by math
  // that could drift if a number or name changes width. ----
  ctx.fillStyle = '#FFFFFF';
  ctx.fillRect(0, y, W, scoreH);

  const midGap = 26; // empty gap between the two columns, centered exactly on CENTER_X
  const boxPad = 30;
  const labelFont = `800 13px ${FONT}`;
  const numberFont = `800 30px ${FONT}`;

  const leftLabelFull = 'TWO BUFF';
  const rightLabelFull = opponentLabel.toUpperCase();
  const leftScoreStr = `${totalUsPts}`;
  const rightScoreStr = `${totalOppPts}`;

  ctx.font = numberFont;
  const leftNumW = ctx.measureText(leftScoreStr).width;
  const rightNumW = ctx.measureText(rightScoreStr).width;
  ctx.font = labelFont;
  let leftLabel = leftLabelFull, rightLabel = rightLabelFull;
  let leftLabelW = ctx.measureText(leftLabelFull).width;
  let rightLabelW = ctx.measureText(rightLabelFull).width;

  // Each column is as wide as its widest element (label or number). Both columns use the
  // same half-width, so they sit as true mirror images of each other around CENTER_X.
  let columnHalfW = Math.max(leftNumW, leftLabelW, rightNumW, rightLabelW) / 2;
  let boxW = (columnHalfW*2 + midGap/2 + boxPad) * 2;
  if(boxW > contentW){
    boxW = contentW;
    const maxLabelW = Math.max((boxW - midGap - 2*boxPad) / 2, 40);
    leftLabel = ctxTruncateText(ctx, leftLabelFull, maxLabelW);
    rightLabel = ctxTruncateText(ctx, rightLabelFull, maxLabelW);
    leftLabelW = ctx.measureText(leftLabel).width;
    rightLabelW = ctx.measureText(rightLabel).width;
    columnHalfW = Math.max(leftNumW, leftLabelW, rightNumW, rightLabelW) / 2;
  }

  const boxH = 66, boxX = CENTER_X - boxW/2, boxY = y + 20;
  ctx.save();
  ctx.shadowColor = 'rgba(18,41,77,0.18)';
  ctx.shadowBlur = 16;
  ctx.shadowOffsetY = 5;
  ctx.fillStyle = '#12294D';
  ctxRoundRect(ctx, boxX, boxY, boxW, boxH, 14);
  ctx.fill();
  ctx.restore();

  const leftColX = CENTER_X - midGap/2 - columnHalfW;
  const rightColX = CENTER_X + midGap/2 + columnHalfW;

  ctx.textAlign = 'center';
  ctx.font = labelFont;
  ctx.fillStyle = '#9FB2CE';
  ctx.fillText(leftLabel, leftColX, boxY + 24);
  ctx.fillText(rightLabel, rightColX, boxY + 24);
  ctx.font = numberFont;
  ctx.fillStyle = '#FFC94A';
  ctx.fillText(leftScoreStr, leftColX, boxY + 55);
  ctx.fillText(rightScoreStr, rightColX, boxY + 55);

  ctx.textAlign = 'left';
  y += scoreH;

  // ---- 7. Match rows: for a given target width, find the largest font size (down
  // to a floor) that lets "our name — score — opponent name" fit as one line;
  // only truncates a name as a last resort. Doubles gets a smaller starting size
  // since "A & B" pairs are inherently longer than a single name. ----
  const fitNameToWidth = (label, availableW, isHighlighted, startSize, minSize) => {
    let fontSize = startSize;
    const minFontSize = minSize || 10;
    let text = label, w;
    do {
      ctx.font = `800 ${fontSize}px ${FONT}`;
      text = label;
      w = ctx.measureText(text).width;
      const slot = w + (isHighlighted ? 16 : 0);
      if(slot <= availableW || fontSize <= minFontSize) break;
      fontSize -= 0.5;
    } while(true);
    let slot = w + (isHighlighted ? 16 : 0);
    if(slot > availableW){
      ctx.font = `800 ${fontSize}px ${FONT}`;
      const overflow = slot - availableW + 6;
      text = ctxTruncateText(ctx, label, Math.max(w - overflow, 30));
      w = ctx.measureText(text).width;
    }
    return { fontSize, text, w };
  };

  // Compact table row used once a section has more than 8 matches and splits into
  // side-by-side columns. The score sits between the two names on one line — same
  // "anchor the score, names flow outward from it" technique as everywhere else —
  // just centered on this column's own center instead of the whole card's.
  // "Matt Grayum" -> "Matt G." — also handles doubles pairs like "Matt Grayum & Tanner Grayum"
  const abbreviateOneName = (name) => {
    const parts = name.trim().split(/\s+/);
    if(parts.length < 2) return name;
    return `${parts[0]} ${parts[parts.length-1][0]}.`;
  };
  const abbreviatePlayerLabel = (label) => {
    return label.includes(' & ')
      ? label.split(' & ').map(abbreviateOneName).join(' & ')
      : abbreviateOneName(label);
  };

  const drawCompactRow = (colX, rowTop, colW, r) => {
    const isOurWin = r.result === 'W';
    const isOppWin = r.result === 'L';
    const isTie = r.result === 'T';
    const centerLabel = r.scoreLabel || (isTie ? 'TIE' : '—');
    const colCenterX = colX + colW/2;
    const gap = 8;
    const fontSize = 9; // one fixed size for every name and score in the compact table — no per-row variation

    const ourLabel = abbreviatePlayerLabel(r.ourLabel);
    const oppLabel = abbreviatePlayerLabel(r.oppLabel);

    ctx.font = `700 ${fontSize}px ${FONT}`;
    const centerW = Math.min(ctx.measureText(centerLabel).width, colW * 0.3);
    const sideAvailW = (colW - centerW)/2 - gap;

    ctx.font = `800 ${fontSize}px ${FONT}`;
    const ourText = ctxTruncateText(ctx, ourLabel, sideAvailW - (isOurWin ? 16 : 0));
    const oppText = ctxTruncateText(ctx, oppLabel, sideAvailW - (isOppWin ? 16 : 0));
    const ourW = ctx.measureText(ourText).width;
    const oppW = ctx.measureText(oppText).width;
    const ourRightEdge = colCenterX - centerW/2 - gap;
    const oppLeftEdge = colCenterX + centerW/2 + gap;

    ctx.textAlign = 'right';
    ctx.font = `800 ${fontSize}px ${FONT}`;
    if(isOurWin){
      const slotW = ourW + 10;
      ctx.fillStyle = '#E1E8F5';
      ctxRoundRect(ctx, ourRightEdge - slotW, rowTop - 11, slotW, 20, 6);
      ctx.fill();
      ctx.fillStyle = '#12294D';
      ctx.fillText(ourText, ourRightEdge - 5, rowTop + 4);
    } else {
      ctx.fillStyle = '#0E1B2E';
      ctx.fillText(ourText, ourRightEdge, rowTop + 4);
    }
    if(r.ourIsHot){
      const ourBlockLeftEdge = ourRightEdge - (isOurWin ? ourW + 10 : ourW);
      ctx.font = `800 11px ${FONT}`;
      ctx.fillStyle = '#C68A1E';
      ctx.fillText('★', ourBlockLeftEdge - 3, rowTop + 4);
    }

    ctx.textAlign = 'center';
    ctx.font = `700 ${fontSize}px ${FONT}`;
    ctx.fillStyle = isTie ? '#8A6112' : '#5C6B84';
    ctx.fillText(centerLabel, colCenterX, rowTop + 4);

    ctx.textAlign = 'left';
    ctx.font = `800 ${fontSize}px ${FONT}`;
    if(isOppWin){
      const slotW = oppW + 10;
      ctx.fillStyle = '#E1E8F5';
      ctxRoundRect(ctx, oppLeftEdge, rowTop - 11, slotW, 20, 6);
      ctx.fill();
      ctx.fillStyle = '#12294D';
      ctx.fillText(oppText, oppLeftEdge + 5, rowTop + 4);
    } else {
      ctx.fillStyle = '#0E1B2E';
      ctx.fillText(oppText, oppLeftEdge, rowTop + 4);
    }
    if(r.oppIsHot){
      const oppBlockRightEdge = oppLeftEdge + (isOppWin ? oppW + 10 : oppW);
      ctx.textAlign = 'left';
      ctx.font = `800 11px ${FONT}`;
      ctx.fillStyle = '#C68A1E';
      ctx.fillText('★', oppBlockRightEdge + 3, rowTop + 4);
    }
    ctx.textAlign = 'left';
  };

  // Column header — "TWO BUFF" / opponent name — drawn above a block of rows so
  // it's unambiguous which side is which, repeated for every side-by-side column.
  const drawColumnHeader = (x, w) => {
    ctx.font = `800 10px ${FONT}`;
    ctx.fillStyle = '#5C6B84';
    ctx.textAlign = 'center';
    ctx.fillText('TWO BUFF', x + w*0.25, y + colHeaderH - 8);
    ctx.fillText(ctxTruncateText(ctx, opponentLabel.toUpperCase(), w*0.42), x + w*0.75, y + colHeaderH - 8);
    ctx.textAlign = 'left';
    ctx.strokeStyle = '#DFE4EE';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x, y + colHeaderH);
    ctx.lineTo(x + w, y + colHeaderH);
    ctx.stroke();
  };

  // ---- 8. Section drawer: title/subtitle row, column headers, then each match,
  // then a subtotal. The score summary is the anchor for each row — drawn fixed
  // at its column's center, exactly like the marquee above — and both player
  // names are fitted and positioned as mirror images flowing outward from it. ----
  const drawSection = (title, subtitle, accent, rows, usPts, oppPts, startFontSize) => {
    ctx.textAlign = 'left';
    ctx.fillStyle = accent;
    ctxRoundRect(ctx, marginX, y+11, 10, 10, 3);
    ctx.fill();
    ctx.fillStyle = '#12294D';
    ctx.font = `800 14px ${FONT}`;
    ctx.fillText(title.toUpperCase(), marginX + 18, y+21);
    ctx.fillStyle = '#5C6B84';
    ctx.font = `700 12px ${FONT}`;
    ctx.textAlign = 'right';
    ctx.fillText(subtitle, W-marginX, y+21);
    ctx.textAlign = 'left';
    y += sectionHeaderH;

    if(rows.length === 0){
      ctx.fillStyle = '#5C6B84';
      ctx.font = `600 13px ${FONT}`;
      ctx.textAlign = 'center';
      ctx.fillText('No results recorded.', CENTER_X, y+28);
      ctx.textAlign = 'left';
      y += rowH;
    } else if(!sectionLayout(rows.length).compact){
      drawColumnHeader(marginX, contentW);
      y += colHeaderH;
      const gap = 14;
      const halfContentW = contentW / 2;
      rows.forEach(r=>{
        ctx.strokeStyle = '#DFE4EE';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(marginX, y);
        ctx.lineTo(W-marginX, y);
        ctx.stroke();

        const midY = y + rowH/2;
        const isOurWin = r.result === 'W';
        const isOppWin = r.result === 'L';
        const isTie = r.result === 'T';
        const centerLabel = r.scoreLabel || (isTie ? 'TIE' : '—');

        // A format tag (e.g. "TRIPLES · 3 PTS") for any group format other than
        // plain doubles, since the points a win is worth differs by format.
        if(r.formatLabel){
          ctx.font = `800 8px ${FONT}`;
          ctx.fillStyle = '#5C6B84';
          ctx.textAlign = 'center';
          ctx.fillText(r.formatLabel.toUpperCase(), CENTER_X, y + 11);
          ctx.textAlign = 'left';
        }

        // The full score summary — e.g. "4 UP · 2 to play" — is one indivisible
        // piece of text, drawn dead-center on the card first.
        ctx.font = `700 12px ${FONT}`;
        const centerW = Math.min(ctx.measureText(centerLabel).width, halfContentW * 0.55);
        const sideAvailableW = halfContentW - centerW/2 - gap;

        const ourFit = fitNameToWidth(r.ourLabel, sideAvailableW, isOurWin, startFontSize);
        const oppFit = fitNameToWidth(r.oppLabel, sideAvailableW, isOppWin, startFontSize);
        const ourRightEdge = CENTER_X - centerW/2 - gap;
        const oppLeftEdge = CENTER_X + centerW/2 + gap;

        ctx.textAlign = 'right';
        ctx.font = `800 ${ourFit.fontSize}px ${FONT}`;
        if(isOurWin){
          const slotW = ourFit.w + 16;
          ctx.fillStyle = '#E1E8F5';
          ctxRoundRect(ctx, ourRightEdge - slotW, midY - 15, slotW, 28, 8);
          ctx.fill();
          ctx.fillStyle = '#12294D';
          ctx.fillText(ourFit.text, ourRightEdge - 8, midY + 5);
        } else {
          ctx.fillStyle = '#0E1B2E';
          ctx.fillText(ourFit.text, ourRightEdge, midY + 5);
        }
        if(r.ourIsHot){
          const ourBlockLeftEdge = ourRightEdge - (isOurWin ? ourFit.w + 16 : ourFit.w);
          ctx.font = `800 16px ${FONT}`;
          ctx.fillStyle = '#C68A1E';
          ctx.fillText('★', ourBlockLeftEdge - 4, midY + 5);
        }

        ctx.textAlign = 'center';
        ctx.font = `700 12px ${FONT}`;
        ctx.fillStyle = isTie ? '#8A6112' : '#5C6B84';
        ctx.fillText(centerLabel, CENTER_X, midY + 4);

        ctx.textAlign = 'left';
        ctx.font = `800 ${oppFit.fontSize}px ${FONT}`;
        if(isOppWin){
          const slotW = oppFit.w + 16;
          ctx.fillStyle = '#E1E8F5';
          ctxRoundRect(ctx, oppLeftEdge, midY - 15, slotW, 28, 8);
          ctx.fill();
          ctx.fillStyle = '#12294D';
          ctx.fillText(oppFit.text, oppLeftEdge + 8, midY + 5);
        } else {
          ctx.fillStyle = '#0E1B2E';
          ctx.fillText(oppFit.text, oppLeftEdge, midY + 5);
        }
        if(r.oppIsHot){
          const oppBlockRightEdge = oppLeftEdge + (isOppWin ? oppFit.w + 16 : oppFit.w);
          ctx.textAlign = 'left';
          ctx.font = `800 16px ${FONT}`;
          ctx.fillStyle = '#C68A1E';
          ctx.fillText('★', oppBlockRightEdge + 4, midY + 5);
        }
        ctx.textAlign = 'left';

        y += rowH;
      });
    } else {
      // Compact multi-column table — used once a section has more than 8 matches,
      // so a large event (up to ~26 singles) still produces a shareable-sized image
      // instead of one extremely tall column.
      const layout = sectionLayout(rows.length);
      const colGap = 20;
      const colW = (contentW - colGap*(layout.numCols-1)) / layout.numCols;
      for(let col=0; col<layout.numCols; col++){
        const colX = marginX + col*(colW+colGap);
        drawColumnHeader(colX, colW);
      }
      y += colHeaderH;
      const sectionTopY = y;
      const columns = distributeIntoColumns(rows, layout.numCols);
      for(let col=0; col<layout.numCols; col++){
        const colX = marginX + col*(colW+colGap);
        const colRows = columns[col];
        colRows.forEach((r,i)=>{
          const rowTop = sectionTopY + i*layout.rh + layout.rh/2;
          if(i > 0){
            ctx.strokeStyle = '#DFE4EE';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(colX, sectionTopY + i*layout.rh - 3);
            ctx.lineTo(colX + colW, sectionTopY + i*layout.rh - 3);
            ctx.stroke();
          }
          drawCompactRow(colX, rowTop, colW, r);
        });
      }
      y += layout.rowsPerCol * layout.rh;
    }

    ctx.save();
    ctx.shadowColor = 'rgba(14,27,46,0.08)';
    ctx.shadowBlur = 8;
    ctx.shadowOffsetY = 2;
    ctx.fillStyle = '#FFFFFF';
    ctxRoundRect(ctx, marginX, y+7, contentW, 30, 10);
    ctx.fill();
    ctx.restore();
    ctx.font = `800 13px ${FONT}`;
    ctx.fillStyle = '#12294D';
    ctx.textAlign = 'center';
    ctx.fillText(`${usPts} – ${oppPts}`, CENTER_X, y+27);
    ctx.textAlign = 'left';
    y += subtotalH;
  };

  const singlesRowsData = singles.map(s=>({
    ourLabel: s.ourName, oppLabel: s.opponentName, scoreLabel: formatMatchplayMargin(s), result: s.result
  }));

  // The "hot round" is the single lowest team score anywhere in the section —
  // stroke play, so lower is better. Every score that ties for that lowest value
  // gets a star, whether that's one team, both sides of one matchup, or several
  // different matchups.
  let hotRoundValue = Infinity;
  doubles.forEach(d=>{
    if(d.ourScore != null && d.ourScore < hotRoundValue) hotRoundValue = d.ourScore;
    if(d.oppScore != null && d.oppScore < hotRoundValue) hotRoundValue = d.oppScore;
  });
  const doublesRowsData = doubles.map(d=>({
    ourLabel: d.ourSide, oppLabel: d.opponentName, scoreLabel: formatDoublesScore(d), result: d.result,
    ourIsHot: d.ourScore != null && d.ourScore === hotRoundValue,
    oppIsHot: d.oppScore != null && d.oppScore === hotRoundValue,
    formatLabel: (d.format && d.format !== 'doubles') ? `${groupFormatLabel(d.format)} · ${groupFormatWinPoints(d.format)} pt${groupFormatWinPoints(d.format)>1?'s':''}` : null
  }));
  const anyHotRound = hotRoundValue !== Infinity;

  drawSection('Matchplay', '1 pt / win', '#FFCB57', singlesRowsData, mpUsPts, mpOppPts, 14.5);
  y += gapAfterSection;
  drawSection('Doubles', anyHotRound ? '2 pts / win  ·  ★ hot round' : '2 pts / win', '#7FB3E0', doublesRowsData, dbUsPts, dbOppPts, 13.5);

  // ---- Special / penalty points, if any were recorded for this event ----
  if(adjustments.length){
    y += gapAfterSection;
    ctx.textAlign = 'left';
    ctx.fillStyle = '#B49DDF';
    ctxRoundRect(ctx, marginX, y+11, 10, 10, 3);
    ctx.fill();
    ctx.fillStyle = '#12294D';
    ctx.font = `800 14px ${FONT}`;
    ctx.fillText('SPECIAL POINTS', marginX+18, y+21);
    y += sectionHeaderH;

    adjustments.forEach(a=>{
      ctx.strokeStyle = '#DFE4EE';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(marginX, y);
      ctx.lineTo(W-marginX, y);
      ctx.stroke();

      const teamName = a.team === 'us' ? 'Two Buff' : opponentLabel;
      const ptsText = `${a.points >= 0 ? '+' : ''}${a.points}`;
      ctx.font = `800 13px ${FONT}`;
      ctx.fillStyle = '#12294D';
      ctx.fillText(ctxTruncateText(ctx, `${ptsText} pts — ${teamName}`, contentW), marginX, y+20);
      if(a.note){
        ctx.font = `600 11px ${FONT}`;
        ctx.fillStyle = '#5C6B84';
        ctx.fillText(ctxTruncateText(ctx, a.note, contentW), marginX, y+36);
        y += adjRowH;
      } else {
        y += adjRowHNoNote;
      }
    });
  }

  // ---- 9. Round the card's corners and export ----
  const rounded = document.createElement('canvas');
  rounded.width = draw.width;
  rounded.height = draw.height;
  const rctx = rounded.getContext('2d');
  ctxRoundRect(rctx, 0, 0, draw.width, draw.height, cardRadius*scale);
  rctx.clip();
  rctx.drawImage(draw, 0, 0);

  rounded.toBlob(blob=>{
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    const safeName = `two-buff-vs-${opponentLabel}`.replace(/[^a-z0-9]+/gi, '-').toLowerCase();
    a.download = `${safeName || 'event'}-results.png`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
  }, 'image/png');
}
// Shares exactly the season currently selected via the pill buttons on the player's
// expanded stats card (or 'all' for All-Time) — same buildHistoryRows core the
// on-screen list uses, so the image always matches what's actually in view,
// including opponent team/PDGA/rank context and doubles format tags.
async function sharePlayerCard(playerId, scopeArg){
  const player = state.players.find(p=>p.id===playerId);
  if(!player){ showToast('Player not found'); return; }
  const seasons = getAvailableSeasons();
  const scope = scopeArg || state.expandedPlayerCardScope || (seasons[0] || 'all');
  const scopeLabel = scope === 'all' ? 'all-time' : scope;
  showToast('Generating image…');

  const logoEl = document.querySelector('.brand-mark img');
  const [logoImg, oppTeamsList, statsMap] = await Promise.all([
    loadImageAsync(logoEl ? logoEl.src : null), loadOppTeams(), getAllStatsData()
  ]);
  const { singlesRows, doublesRows, singlesRecordLine, doublesRecordLine } = buildHistoryRows(player, false, scope, oppTeamsList, statsMap);

  const W = 720, scale = 2, marginX = 60, cardRadius = 20;
  const CENTER_X = W / 2;
  const contentW = W - marginX*2;
  const FONT = '-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif';

  const headerH = 148, sectionHeaderH = 34, rowH = 44, emptyRowH = 40, overflowRowH = 22, gapAfterSection = 20, bottomPad = 24;
  const MAX_ROWS = 8; // per section — keeps an All-Time card with a long history shareable-sized; older results are summarized instead of dropped
  const capRows = (rows) => ({ shown: rows.slice(0, MAX_ROWS), overflow: Math.max(0, rows.length - MAX_ROWS) });
  const singlesCapped = capRows(singlesRows);
  const doublesCapped = capRows(doublesRows);
  const sectionH = (capped) => capped.shown.length === 0 ? emptyRowH : capped.shown.length*rowH + (capped.overflow ? overflowRowH : 0);
  const totalH = headerH + (sectionHeaderH + sectionH(singlesCapped)) + gapAfterSection + (sectionHeaderH + sectionH(doublesCapped)) + bottomPad;

  const draw = document.createElement('canvas');
  draw.width = W*scale;
  draw.height = totalH*scale;
  const ctx = draw.getContext('2d');
  ctx.scale(scale, scale);

  ctx.fillStyle = '#F4F6FA';
  ctx.fillRect(0, 0, W, totalH);

  // ---- Header: player name, gold accent, selected scope, and the record for that scope ----
  const headerGrad = ctx.createLinearGradient(0, 0, W, headerH);
  headerGrad.addColorStop(0, '#0A1830');
  headerGrad.addColorStop(1, '#12294D');
  ctx.fillStyle = headerGrad;
  ctx.fillRect(0, 0, W, headerH);

  if(logoImg){
    ctx.save();
    ctx.globalAlpha = 0.16;
    const logoSize = 200;
    ctx.drawImage(logoImg, W - logoSize*0.62, -logoSize*0.28, logoSize, logoSize);
    ctx.restore();
  }

  ctx.textAlign = 'left';
  ctx.fillStyle = '#FFFFFF';
  ctx.font = `800 26px ${FONT}`;
  ctx.fillText(ctxTruncateText(ctx, player.name, contentW), marginX, 54);
  ctx.fillStyle = '#FFCB57';
  ctx.fillRect(marginX, 65, 42, 4);

  ctx.fillStyle = '#FFC94A';
  ctx.font = `800 12px ${FONT}`;
  ctx.fillText((scope === 'all' ? 'All-Time Record' : `${scope} Season`).toUpperCase(), marginX, 88);

  ctx.fillStyle = '#B8C4D9';
  ctx.font = `600 14px ${FONT}`;
  const summaryParts = [];
  if(singlesRows.length) summaryParts.push(`Singles ${singlesRecordLine}`);
  if(doublesRows.length) summaryParts.push(`Doubles ${doublesRecordLine}`);
  ctx.fillText(summaryParts.length ? summaryParts.join('    ·    ') : 'No results recorded yet', marginX, 114);

  let y = headerH;

  // ---- One row: opponent/pairing on top with the result pill, opponent context
  // (team, PDGA, skill rank), score/margin, and event+date underneath. Mirrors the
  // exact fields buildHistoryRows resolves for the on-screen list. ----
  const drawRow = (rowTop, r) => {
    ctx.strokeStyle = '#DFE4EE';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(marginX, rowTop);
    ctx.lineTo(W-marginX, rowTop);
    ctx.stroke();

    const result = r.result;
    const pillColor = result==='W' ? '#12294D' : result==='T' ? '#8A6112' : '#C4453B';
    const pillBg = result==='W' ? '#E1E8F5' : result==='T' ? '#FBEFD8' : '#F5D9D6';
    const pillLabel = result || '—';

    // Result pill sits to the LEFT of the matchup info, so it's the first thing
    // your eye lands on — matches the on-screen history rows.
    ctx.font = `800 10px ${FONT}`;
    const pillW = ctx.measureText(pillLabel).width + 16;
    const pillH = 20, pillX = marginX, pillY = rowTop + 6;
    ctx.fillStyle = pillBg;
    ctxRoundRect(ctx, pillX, pillY, pillW, pillH, 10);
    ctx.fill();
    ctx.fillStyle = pillColor;
    ctx.textAlign = 'center';
    ctx.fillText(pillLabel, pillX + pillW/2, pillY + 14);
    ctx.textAlign = 'left';

    const textX = pillX + pillW + 10;
    ctx.font = `800 13.5px ${FONT}`;
    ctx.fillStyle = '#0E1B2E';
    ctx.fillText(ctxTruncateText(ctx, r.raw.title, (W - marginX) - textX), textX, rowTop + 19);

    const metaParts = [];
    if(r.raw.formatLabel) metaParts.push(r.raw.formatLabel.toUpperCase());
    if(r.raw.identifier) metaParts.push(r.raw.identifier);
    if(r.raw.scoreLabel) metaParts.push(r.raw.scoreLabel);
    if(r.raw.subLabel) metaParts.push(r.raw.subLabel);
    ctx.font = `600 10.5px ${FONT}`;
    ctx.fillStyle = '#5C6B84';
    ctx.fillText(ctxTruncateText(ctx, metaParts.join('  ·  '), (W - marginX) - textX), textX, rowTop + 35);
  };

  const drawSection = (title, subtitle, accent, capped) => {
    ctx.textAlign = 'left';
    ctx.fillStyle = accent;
    ctxRoundRect(ctx, marginX, y+11, 10, 10, 3);
    ctx.fill();
    ctx.fillStyle = '#12294D';
    ctx.font = `800 14px ${FONT}`;
    ctx.fillText(title.toUpperCase(), marginX + 18, y+21);
    ctx.fillStyle = '#5C6B84';
    ctx.font = `700 12px ${FONT}`;
    ctx.textAlign = 'right';
    ctx.fillText(subtitle, W-marginX, y+21);
    ctx.textAlign = 'left';
    y += sectionHeaderH;

    if(capped.shown.length === 0){
      ctx.fillStyle = '#5C6B84';
      ctx.font = `600 13px ${FONT}`;
      ctx.textAlign = 'center';
      ctx.fillText(`No ${title.toLowerCase()} results for ${scopeLabel}.`, CENTER_X, y+24);
      ctx.textAlign = 'left';
      y += emptyRowH;
    } else {
      capped.shown.forEach(r=>{ drawRow(y, r); y += rowH; });
      if(capped.overflow){
        ctx.fillStyle = '#5C6B84';
        ctx.font = `600 11px ${FONT}`;
        ctx.textAlign = 'center';
        ctx.fillText(`+ ${capped.overflow} earlier result${capped.overflow>1?'s':''} not shown`, CENTER_X, y+15);
        ctx.textAlign = 'left';
        y += overflowRowH;
      }
    }
  };

  drawSection('Singles', singlesRecordLine, '#FFCB57', singlesCapped);
  y += gapAfterSection;
  drawSection('Doubles', doublesRecordLine, '#7FB3E0', doublesCapped);

  // ---- Round the card's corners and export ----
  const rounded = document.createElement('canvas');
  rounded.width = draw.width;
  rounded.height = draw.height;
  const rctx = rounded.getContext('2d');
  ctxRoundRect(rctx, 0, 0, draw.width, draw.height, cardRadius*scale);
  rctx.clip();
  rctx.drawImage(draw, 0, 0);

  rounded.toBlob(blob=>{
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    const safeName = `${player.name}-${scope}`.replace(/[^a-z0-9]+/gi, '-').toLowerCase();
    a.download = `${safeName || 'player'}-stats.png`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
  }, 'image/png');
}

async function getOpponentPlayerHistory(oppPlayerId){
  const allData = await getAllStatsData();
  const history = [];
  Object.keys(allData).forEach(eventId=>{
    const ev = state.events.find(e=>e.id===eventId);
    if(!ev) return; // event deleted
    const data = allData[eventId];
    const countedDoublesFor = new Set(); // avoid listing the same doubles match twice (once per partner)
    Object.keys(data).forEach(ourPlayerId=>{
      if(ourPlayerId === '__adjustments') return; // not a player entry
      const s = data[ourPlayerId];
      const ourPlayer = state.players.find(p=>p.id===ourPlayerId);
      const ourPlayerName = ourPlayer ? ourPlayer.name : 'Former player';
      const mp = s.matchplay;
      if(mp && mp.played && mp.opponentPlayerId === oppPlayerId){
        history.push({ event: ev, kind:'matchplay', result: mp.result, ourPlayerName, partnerName: null });
      }
      const db = s.doubles ? normalizeGroupEntry(s.doubles) : null;
      if(db && db.played && (db.oppIds || []).includes(oppPlayerId) && !countedDoublesFor.has(ourPlayerId)){
        countedDoublesFor.add(ourPlayerId);
        (db.partnerIds || []).forEach(id=>countedDoublesFor.add(id));
        const partnerLabel = (db.partnerNames || []).filter(Boolean).join(' & ') || null;
        history.push({ event: ev, kind: db.format || 'doubles', result: db.result, ourPlayerName, partnerName: partnerLabel });
      }
    });
  });
  history.sort((a,b)=> b.event.date.localeCompare(a.event.date));
  return history;
}

function csvEscape(val){
  const s = (val===null || val===undefined) ? '' : String(val);
  if(/[",\n]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
  return s;
}
function downloadCSV(filename, rows){
  const csv = rows.map(r => r.map(csvEscape).join(',')).join('\r\n');
  const blob = new Blob(['\uFEFF' + csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

async function playerHasStats(id){
  try{
    const listRes = await window.storage.list('dg_stats_', true);
    const keys = (listRes && listRes.keys) || [];
    for(const k of keys){
      const raw = await storeGet(k, true);
      if(!raw) continue;
      const data = JSON.parse(raw);
      const s = data[id];
      if(s && ((s.matchplay && s.matchplay.played) || (s.doubles && s.doubles.played))) return true;
    }
  }catch(e){ /* ignore, treat as no stats */ }
  return false;
}

async function performDeletePlayer(id){
  state.players = state.players.filter(p=>p.id!==id);
  await savePlayers();
  try{
    await Promise.all(state.events.map(async (ev)=>{
      const key = 'dg_rsvp_' + ev.id + '_' + id;
      try{ await window.storage.delete(key, true); }catch(err){ /* no rsvp entry for this player at this event */ }
      if(state.rsvpCache[ev.id]) delete state.rsvpCache[ev.id][id];
      if(state.allRsvpCache && state.allRsvpCache[ev.id]) delete state.allRsvpCache[ev.id][id];
    }));
    const statsList = await window.storage.list('dg_stats_', true);
    for(const k of ((statsList && statsList.keys) || [])){
      const raw = await storeGet(k, true);
      if(!raw) continue;
      const data = JSON.parse(raw);
      if(data[id] !== undefined){
        delete data[id];
        await storeSet(k, JSON.stringify(data), true);
        state.statsCache[k.slice('dg_stats_'.length)] = data;
      }
    }
  }catch(e){ console.error(e); }
  closeModal();
  showToast('Player and all related data removed');
  render();
}

async function renderMatchups(){
