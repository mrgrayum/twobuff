<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Two Buff — Team Hub</title>
<!-- Firebase (free tier) replaces Claude's built-in window.storage for real hosting.
     Fill in YOUR_FIREBASE_CONFIG below — see SETUP.md for step-by-step instructions. -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --bg:#F4F6FA;
    --surface:#FFFFFF;
    --ink:#0E1B2E;
    --ink-soft:#5C6B84;
    --forest:#12294D;
    --forest-dark:#0A1830;
    --orange:#FF7A1A;
    --orange-dark:#E4650A;
    --teal:#2F7E92;
    --gold:#D99A2B;
    --red:#C4453B;
    --line:#DFE4EE;
    --chip-bg:#E9EDF6;
    --radius:18px;
    --radius-sm:12px;
    --shadow: 0 1px 2px rgba(14,27,46,0.05), 0 6px 16px rgba(14,27,46,0.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:84px;
    min-height:100vh;
  }
  .app{max-width:640px;margin:0 auto;position:relative;}

  /* ---------- Top bar ---------- */
  .topbar{
    position:sticky; top:0; z-index:20;
    background:var(--forest);
    color:#fff;
    padding:14px 16px 12px;
    display:flex; align-items:center; justify-content:space-between;
    box-shadow:var(--shadow);
  }
  .topbar .brand{display:flex; align-items:center; gap:10px;}
  .brand-mark{
    width:34px;height:34px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--orange), var(--orange-dark));
    display:flex;align-items:center;justify-content:center;
    font-weight:800; font-size:15px; color:#fff;
    box-shadow: inset 0 0 0 3px rgba(255,255,255,0.18);
  }
  .brand-text{line-height:1.1;}
  .brand-text .t1{font-weight:800; font-size:16px; letter-spacing:0.2px;}
  .brand-text .t2{font-size:11px; color:#B9C9E8; letter-spacing:0.6px; text-transform:uppercase;}
  .admin-toggle{display:flex;align-items:center;gap:8px; font-size:12px; color:#D8E9DF;}
  .settings-gear{background:none; border:none; color:#fff; font-size:19px; cursor:pointer; padding:2px 0; line-height:1; opacity:0.9;}
  .settings-gear:active{opacity:0.6;}
  .switch{
    width:40px;height:24px;border-radius:14px;background:#C7CEDC;
    box-shadow:inset 0 0 0 1px rgba(14,27,46,0.15);
    position:relative;cursor:pointer;transition:background .15s;flex-shrink:0;
  }
  .switch.on{background:var(--orange); box-shadow:none;}
  .switch .knob{
    position:absolute; top:3px; left:3px; width:18px;height:18px;border-radius:50%;
    background:#fff; transition:left .15s; box-shadow:0 1px 3px rgba(14,27,46,0.35);
  }
  .switch.on .knob{left:19px;}

  /* ---------- Bottom nav ---------- */
  .bottomnav{
    position:fixed; bottom:0; left:0; right:0; z-index:20;
    background:var(--surface); border-top:1px solid var(--line);
    display:flex; max-width:640px; margin:0 auto;
    box-shadow:0 -4px 16px rgba(21,36,32,0.06);
  }
  .navbtn{
    flex:1; padding:10px 4px 12px; background:none; border:none; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:3px;
    color:var(--ink-soft); font-size:11px; font-weight:700; letter-spacing:0.3px;
  }
  .navbtn .ic{font-size:20px;}
  .navbtn.active{color:var(--forest);}
  .navbtn.active .ic{transform:scale(1.08);}

  main{padding:16px; padding-bottom:24px;}

  h1,h2,h3{margin:0; color:var(--forest-dark);}
  .page-title{font-size:21px; font-weight:800; margin-bottom:2px;}
  .page-sub{color:var(--ink-soft); font-size:13px; margin-bottom:16px;}

  .card{
    background:var(--surface); border-radius:var(--radius); padding:16px;
    box-shadow:var(--shadow); margin-bottom:14px; border:1px solid var(--line);
  }

  /* ---------- Buttons ---------- */
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    border:none; border-radius:14px; font-weight:800; font-size:15px;
    padding:14px 18px; cursor:pointer; transition:transform .08s, opacity .12s;
    width:100%;
  }
  .btn:active{transform:scale(0.97);}
  .btn-primary{background:var(--forest); color:#fff;}
  .btn-orange{background:var(--orange); color:#fff;}
  .btn-outline{background:#fff; color:var(--forest); border:2px solid var(--forest);}
  .btn-ghost{background:var(--chip-bg); color:var(--ink);}
  .btn-danger{background:#fff; color:var(--red); border:2px solid var(--red);}
  .btn-sm{padding:8px 12px; font-size:13px; border-radius:10px; width:auto;}
  .btn-row{display:flex; gap:10px;}
  .btn-row .btn{flex:1;}

  /* RSVP status buttons */
  .rsvp-grid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-top:10px;}
  .rsvp-btn{
    border-radius:14px; border:2px solid var(--line); background:#fff;
    padding:12px 6px; font-weight:800; font-size:12.5px; cursor:pointer;
    text-align:center; color:var(--ink-soft); line-height:1.3;
  }
  .rsvp-btn .em{display:block; font-size:18px; margin-bottom:2px;}
  .rsvp-btn.sel-confirmed{background:var(--forest); border-color:var(--forest); color:#fff;}
  .rsvp-btn.sel-maybe{background:var(--gold); border-color:var(--gold); color:#3B2A05;}
  .rsvp-btn.sel-declined{background:var(--red); border-color:var(--red); color:#fff;}

  /* ---------- Chips / status pills ---------- */
  .pill{display:inline-flex; align-items:center; gap:5px; padding:4px 10px; border-radius:20px; font-size:11.5px; font-weight:800;}
  .pill-forest{background:#E1E8F5; color:var(--forest);}
  .pill-orange{background:#FBE4D8; color:var(--orange-dark);}
  .pill-gray{background:var(--chip-bg); color:var(--ink-soft);}

  /* ---------- Event list ---------- */
  .event-row{
    display:flex; align-items:center; gap:12px; padding:14px; background:var(--surface);
    border-radius:var(--radius); box-shadow:var(--shadow); margin-bottom:10px; cursor:pointer;
    border:1px solid var(--line);
  }
  .event-date{
    width:52px; flex-shrink:0; text-align:center; background:var(--forest); color:#fff;
    border-radius:12px; padding:8px 0; position:relative;
  }
  .home-star{
    position:absolute; top:-7px; right:-7px; width:20px; height:20px; border-radius:50%;
    background:var(--orange); color:#fff; font-size:11px; display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 0 2px #fff;
  }
  .event-date .mon{font-size:10px; text-transform:uppercase; letter-spacing:0.5px; opacity:0.85;}
  .event-date .day{font-size:19px; font-weight:800; line-height:1;}
  .event-info{flex:1; min-width:0;}
  .event-info .nm{font-weight:800; font-size:15px; margin-bottom:2px;}
  .event-info .loc{font-size:12.5px; color:var(--ink-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .event-arrow{color:var(--ink-soft); font-size:18px;}

  /* ---------- Summary stat grid ---------- */
  .stat-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:10px;}
  .stat-grid-2{display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin-top:10px;}
  .stat-box{background:var(--chip-bg); border-radius:14px; padding:12px 6px; text-align:center;}
  .stat-box .num{font-size:22px; font-weight:800; color:var(--forest-dark);}
  .stat-box .lbl{font-size:10.5px; color:var(--ink-soft); font-weight:700; text-transform:uppercase; letter-spacing:0.3px;}
  .lunch-bar-wrap{margin-top:12px;}
  .lunch-bar-track{background:var(--chip-bg); border-radius:10px; height:14px; overflow:hidden;}
  .lunch-bar-fill{background:linear-gradient(90deg, var(--orange), var(--gold)); height:100%; border-radius:10px; transition:width .3s;}

  /* ---------- Player row in event ---------- */
  .player-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:14px; margin-bottom:10px;}
  .player-card .pname{font-weight:800; font-size:15px; margin-bottom:2px;}
  .lunch-input{
    margin-top:10px; width:100%; padding:10px 12px; border-radius:10px; border:2px solid var(--line);
    font-size:14px; font-family:inherit;
  }
  .lunch-input:focus{outline:none; border-color:var(--forest);}

  .match-row{display:flex; align-items:center; gap:10px; margin-top:10px;}
  .match-label{width:64px; font-size:12px; font-weight:700; color:var(--ink-soft);}
  .wl-btn{border-radius:10px; border:2px solid var(--line); background:#fff; padding:8px 4px; font-weight:800; font-size:12px; flex:1; cursor:pointer; color:var(--ink-soft);}
  .wl-btn.win-sel{background:var(--forest); border-color:var(--forest); color:#fff;}
  .wl-btn.loss-sel{background:var(--red); border-color:var(--red); color:#fff;}
  .wl-btn.none-sel{background:var(--chip-bg); border-color:var(--chip-bg); color:var(--ink-soft);}

  /* ---------- Team tab ---------- */
  .team-row{display:flex; align-items:flex-start; justify-content:space-between; padding:14px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); margin-bottom:10px;}
  .avatar{width:38px;height:38px;border-radius:50%; background:var(--forest); color:#fff; display:flex;align-items:center;justify-content:center; font-weight:800; font-size:14px; flex-shrink:0;}
  .team-name-row{display:flex; align-items:center; gap:12px;}

  /* ---------- Stats table ---------- */
  .stats-header-row, .stats-row{display:grid; grid-template-columns: 1.6fr 1fr 1fr; gap:6px; align-items:center;}
  .stats-header-row{font-size:10.5px; font-weight:800; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.3px; padding:0 4px 8px;}
  .stats-row{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:12px; margin-bottom:8px;}
  .stats-row .pname{font-weight:800; font-size:14px;}
  .rec{text-align:center; font-weight:800; font-size:14px;}
  .rec .sub{display:block; font-size:9.5px; font-weight:700; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.3px;}

  .empty{text-align:center; padding:34px 16px; color:var(--ink-soft);}
  .empty .em{font-size:36px; display:block; margin-bottom:8px;}
  .empty p{margin:0 0 14px; font-size:14px;}

  /* ---------- Modal ---------- */
  .overlay{position:fixed; inset:0; background:rgba(18,30,25,0.55); z-index:50; display:flex; align-items:flex-end; justify-content:center;}
  .sheet{
    background:var(--surface); width:100%; max-width:640px; border-radius:22px 22px 0 0;
    padding:20px 18px 26px; max-height:88vh; overflow-y:auto;
  }
  .sheet h3{font-size:17px; margin-bottom:14px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12px; font-weight:800; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.3px; margin-bottom:6px;}
  .field input, .field select{
    width:100%; padding:12px 12px; border-radius:12px; border:2px solid var(--line); font-size:15px; font-family:inherit;
  }
  .field input:focus, .field select:focus{outline:none; border-color:var(--forest);}
  .toggle-row{display:flex; align-items:center; justify-content:space-between; padding:6px 2px;}
  .seg-row{display:flex; gap:8px;}
  .seg-btn{flex:1; padding:12px 6px; border-radius:12px; border:2px solid var(--line); background:#fff; font-weight:800; font-size:14px; cursor:pointer; color:var(--ink-soft); text-align:center;}
  .seg-btn.seg-sel{background:var(--forest); border-color:var(--forest); color:#fff;}
  .gender-badge{display:inline-flex; align-items:center; justify-content:center; width:22px; height:22px; border-radius:50%; font-size:11px; font-weight:800; flex-shrink:0;}
  .gender-badge.g-m{background:#DCEBF3; color:var(--teal);}
  .gender-badge.g-f{background:#FBE0EC; color:#C13584;}

  .section-label{font-size:11px; font-weight:800; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.5px; margin:18px 0 8px;}
  .stats-section-header{
    display:flex; align-items:center; gap:8px; font-size:16px; font-weight:800; color:var(--forest-dark);
    border-left:4px solid var(--orange); padding-left:10px; margin:22px 0 12px;
  }
  .stats-section-header:first-of-type{ margin-top:6px; }
  .divider{height:1px; background:var(--line); margin:14px 0;}
  .home-badge{background:#FBE4D8; color:var(--orange-dark); font-size:10.5px; font-weight:800; padding:3px 8px; border-radius:8px; text-transform:uppercase; letter-spacing:0.3px;}
  .toast{
    position:fixed; bottom:96px; left:50%; transform:translateX(-50%); background:var(--forest-dark); color:#fff;
    padding:10px 18px; border-radius:20px; font-size:13px; font-weight:700; z-index:110; box-shadow:var(--shadow);
    opacity:0; transition:opacity .2s;
  }
  .toast.show{opacity:1;}
  .app-gate{
    position:fixed; inset:0; z-index:100; background:var(--forest); display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .app-gate-card{
    background:#fff; border-radius:22px; padding:34px 26px; max-width:340px; width:100%; text-align:center; box-shadow:var(--shadow);
  }
  .app-gate-card .brand-mark{width:52px; height:52px; margin:0 auto 16px; font-size:19px;}
  .app-gate-card h2{font-size:19px; margin-bottom:4px;}
  .app-gate-card p{font-size:13px; color:var(--ink-soft); margin:0 0 18px;}
  .app-gate-card input{
    width:100%; padding:14px; border-radius:12px; border:2px solid var(--line); font-size:26px; text-align:center;
    letter-spacing:12px; margin-bottom:12px; font-family:inherit;
  }
  .app-gate-card input:focus{outline:none; border-color:var(--forest);}
  .app-gate-error{color:var(--red); font-size:12.5px; font-weight:700; margin:-4px 0 12px; display:none;}
  .loading-dots{text-align:center; padding:40px; color:var(--ink-soft); font-size:14px;}
  .icon-btn{background:var(--chip-bg); border:none; border-radius:10px; padding:8px 10px; font-size:15px; cursor:pointer;}
  .fab-row{display:flex; justify-content:flex-end; margin-bottom:12px;}
  .season-tabs{display:flex; gap:8px; overflow-x:auto; overflow-y:visible; padding:10px 10px 6px 2px; margin:-10px -10px 10px -2px; -webkit-overflow-scrolling:touch;}
  .season-tab{
    flex-shrink:0; padding:9px 16px; border-radius:20px; border:2px solid var(--line); background:#fff;
    font-weight:800; font-size:13px; color:var(--ink-soft); cursor:pointer; white-space:nowrap;
  }
  .season-tab.active{background:var(--forest); border-color:var(--forest); color:#fff;}
  .season-tab-wrap{position:relative; flex-shrink:0;}
  .season-tab-remove{
    position:absolute; top:-7px; right:-7px; width:19px; height:19px; border-radius:50%;
    background:var(--red); color:#fff; border:2px solid #fff; font-size:12px; font-weight:800;
    line-height:1; display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0;
  }
  .past-toggle{
    display:flex; align-items:center; justify-content:space-between; width:100%; background:var(--chip-bg);
    border:none; border-radius:14px; padding:13px 16px; font-weight:800; font-size:13px; color:var(--ink-soft);
    cursor:pointer; margin:6px 0 14px;
  }
</style>
</head>
<body>
<div class="app-gate" id="appGate">
  <div class="app-gate-card">
    <div class="brand-mark">TB</div>
    <h2>Two Buff Team Hub</h2>
    <p>Enter the team PIN to continue</p>
    <input id="app_pin_input" type="tel" inputmode="numeric" maxlength="4" placeholder="••••" onkeydown="if(event.key==='Enter') submitAppPin()">
    <div class="app-gate-error" id="app_pin_error">Incorrect PIN — try again.</div>
    <button class="btn btn-primary" onclick="submitAppPin()">Enter</button>
  </div>
</div>
<div class="app" id="mainApp" style="visibility:hidden;">
  <div class="topbar">
    <div class="brand">
      <div class="brand-mark">TB</div>
      <div class="brand-text">
        <div class="t1">Two Buff</div>
        <div class="t2">Team Hub</div>
      </div>
    </div>
    <div style="display:flex; align-items:center; gap:14px;">
      <button class="settings-gear" onclick="openSettingsModal()" aria-label="Settings">⚙️</button>
      <div class="admin-toggle">
        Admin
        <div class="switch" id="adminSwitch" onclick="toggleAdmin()"><div class="knob"></div></div>
      </div>
    </div>
  </div>

  <main id="viewRoot">
    <div class="loading-dots">Loading team hub…</div>
  </main>

  <div class="bottomnav">
    <button class="navbtn" data-view="home" onclick="setView('home')"><span class="ic">🏠</span>Home</button>
    <button class="navbtn" data-view="events" onclick="setView('events')"><span class="ic">📅</span>Events</button>
    <button class="navbtn" data-view="team" onclick="setView('team')"><span class="ic">👥</span>Team</button>
    <button class="navbtn" data-view="stats" onclick="setView('stats')"><span class="ic">🏆</span>Stats</button>
  </div>
</div>

<div id="modalRoot"></div>
<div class="toast" id="toast"></div>

<script>
/* =============================================================
   FIREBASE SETUP — fill this in with YOUR project's config.
   See SETUP.md for exactly how to get these values (it's free).
   ============================================================= */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBahXQyVDLVuKdNfsSVG8MuUNSMtjmZe1s",
  authDomain: "two-buff-team-hub.firebaseapp.com",
  projectId: "two-buff-team-hub",
  storageBucket: "two-buff-team-hub.firebasestorage.app",
  messagingSenderId: "113174498006",
  appId: "1:113174498006:web:1ddc5cc257718eb8f55777"
};

firebase.initializeApp(FIREBASE_CONFIG);
const _db = firebase.firestore();
const _KV_COLLECTION = 'kv_store';

// Drop-in replacement for Claude's built-in window.storage, backed by Firestore.
// Every call site in this app already uses shared:true, so this shim doesn't
// need to distinguish personal vs shared — it's all one shared team database.
window.storage = {
  async get(key, shared){
    const snap = await _db.collection(_KV_COLLECTION).doc(key).get();
    if(!snap.exists) throw new Error('Key not found: ' + key);
    const data = snap.data();
    return { key, value: data.value, shared: !!shared };
  },
  async set(key, value, shared){
    await _db.collection(_KV_COLLECTION).doc(key).set({ value, updatedAt: Date.now() });
    return { key, value, shared: !!shared };
  },
  async delete(key, shared){
    await _db.collection(_KV_COLLECTION).doc(key).delete();
    return { key, deleted: true, shared: !!shared };
  },
  async list(prefix, shared){
    let query = _db.collection(_KV_COLLECTION);
    if(prefix){
      query = query
        .where(firebase.firestore.FieldPath.documentId(), '>=', prefix)
        .where(firebase.firestore.FieldPath.documentId(), '<', prefix + '\uf8ff');
    }
    const snap = await query.get();
    return { keys: snap.docs.map(d => d.id), prefix, shared: !!shared };
  }
};
/* =============================== END FIREBASE SETUP =============================== */

/* ============================= STATE ============================= */
const state = {
  view: 'home',
  adminMode: false,
  isSuperAdmin: false,
  players: [],
  events: [],
  currentEventId: null,
  rsvpCache: {},   // eventId -> {playerId: {status, lunch}}
  statsCache: {},  // eventId -> {playerId: {matchplay:{played,result}, doubles:{played,result}}}
  teamResultCache: {}, // eventId -> {result: 'W'|'L'|'T'|null, ourScore: number|null, oppScore: number|null}
  loaded: false,
  selectedSeason: null,   // set on first render of the Events tab
  pastExpanded: {},       // season -> bool, whether the "past events" group is expanded
  statsScope: 'season',   // 'season' = current season only (default), 'all' = all-time
};

const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function uid(prefix){ return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove('show'), 1800);
}
function initials(name){
  return name.split(' ').filter(Boolean).slice(0,2).map(p=>p[0].toUpperCase()).join('');
}
function fmtDate(iso){
  if(!iso) return {mon:'--', day:'--'};
  const d = new Date(iso + 'T00:00:00');
  return { mon: MONTHS[d.getMonth()], day: d.getDate() };
}
function fmtDateLong(iso){
  if(!iso) return '';
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString(undefined, {weekday:'long', month:'long', day:'numeric', year:'numeric'});
}
function fmtTime(t){
  if(!t) return '';
  const [h,m] = t.split(':').map(Number);
  const period = h >= 12 ? 'PM' : 'AM';
  const h12 = h % 12 === 0 ? 12 : h % 12;
  return `${h12}:${String(m).padStart(2,'0')} ${period}`;
}
// Leagues that span a calendar-year boundary (e.g. fall through spring) get a
// "2026-2027" style label. Cutoff is July 1 — events Jul–Dec belong to the
// season starting that year; events Jan–Jun belong to the season that started
// the previous year. Purely a sensible default — admins can edit it per event.
function inferSeason(dateISO){
  if(!dateISO) return '';
  const d = new Date(dateISO + 'T00:00:00');
  const y = d.getFullYear(), m = d.getMonth();
  return m >= 6 ? `${y}-${y+1}` : `${y-1}-${y}`;
}
function effectiveSeason(e){
  return (e.season && e.season.trim()) ? e.season.trim() : inferSeason(e.date);
}

/* ============================= STORAGE ============================= */
async function storeGet(key, shared){
  try{
    const res = await window.storage.get(key, shared);
    return res ? res.value : null;
  }catch(e){ return null; }
}
async function storeSet(key, value, shared){
  try{
    const res = await window.storage.set(key, value, shared);
    return !!res;
  }catch(e){ console.error('storage set failed', key, e); return false; }
}

async function loadPlayers(){
  const raw = await storeGet('dg_players', true);
  state.players = raw ? JSON.parse(raw) : [];
}
async function savePlayers(){
  await storeSet('dg_players', JSON.stringify(state.players), true);
}
async function loadEvents(){
  const raw = await storeGet('dg_events', true);
  state.events = raw ? JSON.parse(raw) : [];
}
async function saveEvents(){
  await storeSet('dg_events', JSON.stringify(state.events), true);
}
async function loadRsvp(eventId){
  if(state.rsvpCache[eventId]) return state.rsvpCache[eventId];
  const raw = await storeGet('dg_rsvp_' + eventId, true);
  const data = raw ? JSON.parse(raw) : {};
  state.rsvpCache[eventId] = data;
  return data;
}
async function saveRsvp(eventId, data){
  state.rsvpCache[eventId] = data;
  await storeSet('dg_rsvp_' + eventId, JSON.stringify(data), true);
}
async function loadStats(eventId){
  if(state.statsCache[eventId]) return state.statsCache[eventId];
  const raw = await storeGet('dg_stats_' + eventId, true);
  const data = raw ? JSON.parse(raw) : {};
  state.statsCache[eventId] = data;
  return data;
}
async function saveStats(eventId, data){
  state.statsCache[eventId] = data;
  await storeSet('dg_stats_' + eventId, JSON.stringify(data), true);
}
async function loadTeamResult(eventId){
  if(state.teamResultCache[eventId]) return state.teamResultCache[eventId];
  const raw = await storeGet('dg_teamresult_' + eventId, true);
  const data = raw ? JSON.parse(raw) : {result:null, ourScore:null, oppScore:null};
  state.teamResultCache[eventId] = data;
  return data;
}
async function saveTeamResult(eventId, data){
  state.teamResultCache[eventId] = data;
  await storeSet('dg_teamresult_' + eventId, JSON.stringify(data), true);
}

/* ============================= INIT ============================= */
async function init(){
  await Promise.all([loadPlayers(), loadEvents()]);
  state.loaded = true;
  render();
  const gateInput = document.getElementById('app_pin_input');
  if(gateInput) gateInput.focus();
}

async function getAppPin(){
  const raw = await storeGet('dg_app_pin', true);
  return (raw && /^\d{4}$/.test(raw)) ? raw : '8888'; // basic team-wide entry PIN
}
async function submitAppPin(){
  const entered = (document.getElementById('app_pin_input').value || '').trim();
  const correct = await getAppPin();
  if(entered === correct){
    document.getElementById('appGate').style.display = 'none';
    document.getElementById('mainApp').style.visibility = 'visible';
  } else {
    document.getElementById('app_pin_error').style.display = 'block';
    showToast('Incorrect PIN');
  }
}

// Both PINs live in shared storage so they can be changed without editing code.
// Defaults match the values set when this feature was introduced.
async function getAdminPin(){
  const raw = await storeGet('dg_admin_pin', true);
  return (raw && /^\d{4}$/.test(raw)) ? raw : '0101'; // regular admin PIN
}
async function getSuperAdminPin(){
  const raw = await storeGet('dg_super_admin_pin', true);
  return (raw && /^\d{4}$/.test(raw)) ? raw : '5642'; // super admin PIN
}

function toggleAdmin(){
  if(state.adminMode){
    state.adminMode = false;
    state.isSuperAdmin = false;
    document.getElementById('adminSwitch').classList.remove('on');
    render();
    return;
  }
  openAdminPinModal();
}

function openAdminPinModal(){
  const modal = document.getElementById('modalRoot');
  modal.innerHTML = `
    <div class="overlay" onclick="closeModalIfBackdrop(event)">
      <div class="sheet" onclick="event.stopPropagation()">
        <h3>Enter Admin PIN</h3>
        <div class="field">
          <label>4-Digit PIN</label>
          <input id="admin_pin_input" type="tel" inputmode="numeric" maxlength="4" placeholder="••••" style="text-align:center; font-size:24px; letter-spacing:10px;">
        </div>
        <div id="admin_pin_error" style="color:var(--red); font-size:12.5px; font-weight:700; display:none; margin:-6px 0 8px;">Incorrect PIN — try again.</div>
        <div class="btn-row">
          <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
          <button class="btn btn-primary" onclick="submitAdminPin()">Unlock</button>
        </div>
      </div>
    </div>`;
  setTimeout(()=>{
    const inp = document.getElementById('admin_pin_input');
    if(inp){
      inp.focus();
      inp.addEventListener('keydown', e=>{ if(e.key==='Enter') submitAdminPin(); });
    }
  }, 30);
}

async function submitAdminPin(){
  const entered = (document.getElementById('admin_pin_input').value || '').trim();
  const [superPin, regularPin] = await Promise.all([getSuperAdminPin(), getAdminPin()]);
  if(entered === superPin){
    state.adminMode = true;
    state.isSuperAdmin = true;
    document.getElementById('adminSwitch').classList.add('on');
    closeModal();
    showToast('Super admin unlocked');
    render();
  } else if(entered === regularPin){
    state.adminMode = true;
    state.isSuperAdmin = false;
    document.getElementById('adminSwitch').classList.add('on');
    closeModal();
    showToast('Admin mode unlocked');
    render();
  } else {
    const err = document.getElementById('admin_pin_error');
    if(err) err.style.display = 'block';
    showToast('Incorrect PIN');
  }
}

function setView(v){
  state.view = v;
  state.currentEventId = null;
  document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active', b.dataset.view === v));
  render();
}
function openEvent(id){
  state.view = 'eventDetail';

}

/* ============================= RENDER ROOT ============================= */
async function render(){
  document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active', b.dataset.view === (state.view==='eventDetail'?'events':state.view)));
  const root = document.getElementById('viewRoot');
  if(!state.loaded){ root.innerHTML = '<div class="loading-dots">Loading team hub…</div>'; return; }

  if(state.view === 'home') root.innerHTML = await renderHome();
  else if(state.view === 'events') root.innerHTML = await renderEvents();
  else if(state.view === 'eventDetail') root.innerHTML = await renderEventDetail(state.currentEventId);
  else if(state.view === 'team') root.innerHTML = renderTeam();
  else if(state.view === 'stats') root.innerHTML = await renderStats();
}

  const d = new Date();
  return d.toISOString().slice(0,10);
}
function upcomingEvents(){
  const t = todayISO();
  return state.events.filter(e=>e.date >= t).sort((a,b)=>a.date.localeCompare(b.date));
}

function rsvpCounts(rsvp){
  const active = state.players.filter(p=>p.active !== false);
  let confirmed=0, maybe=0, declined=0, none=0, lunchResp=0;
  let femaleConfirmed=0, femaleTotal=0;
  active.forEach(p=>{
    const r = rsvp[p.id];
    const status = r ? r.status : 'none';
    if(status==='confirmed') confirmed++;
    else if(status==='maybe') maybe++;
    else if(status==='declined') declined++;
    else none++;
    if(r && r.lunch && r.lunch.trim()) lunchResp++;
    if(p.gender === 'F'){
      femaleTotal++;
      if(status==='confirmed') femaleConfirmed++;
    }
  });
  // Summary view shows three buckets: Confirmed (In), Out (declined), and Waiting
  // confirmation (maybe + no reply — anyone without a firm answer either way).
  const out = declined;
  const waiting = maybe + none;
  return {confirmed, maybe, declined, none, out, waiting, femaleConfirmed, femaleTotal, lunchResp, total: active.length};
}

/* ============================= EVENTS LIST ============================= */
function getSeasonList(){
  const set = new Set(state.events.map(e=>effectiveSeason(e)));
  set.add(inferSeason(todayISO())); // always keep the current season available, even with no events yet
  return [...set].filter(Boolean).sort().reverse(); // newest season first
}

async function renderEvents(){
  const seasons = getSeasonList();
  const current = inferSeason(todayISO());
  if(!state.selectedSeason || !seasons.includes(state.selectedSeason)){
    state.selectedSeason = seasons.includes(current) ? current : seasons[0];
  }
  const season = state.selectedSeason;
  const t = todayISO();
  const inSeason = state.events.filter(e=>effectiveSeason(e)===season).sort((a,b)=>a.date.localeCompare(b.date));
  const upcoming = inSeason.filter(e=>e.date >= t);
  const past = inSeason.filter(e=>e.date < t).reverse(); // most recently past first

  const tabsHtml = `
    <div class="season-tabs">
      ${seasons.map(s=>`
        <div class="season-tab-wrap">
          <button class="season-tab ${s===season?'active':''}" onclick="selectSeason('${s}')">${esc(s)}${s===current?' · Current':''}</button>
          ${(state.isSuperAdmin && state.adminMode) ? `<button class="season-tab-remove" onclick="event.stopPropagation(); openRemoveSeasonConfirm('${esc(s)}')" title="Remove season">×</button>` : ''}
        </div>
      `).join('')}
    </div>`;

  async function cardFor(e, past){
    const d = fmtDate(e.date);
    const rsvp = await loadRsvp(e.id);
    const counts = rsvpCounts(rsvp);
    const teamResult = await loadTeamResult(e.id);
    const resultBadge = teamResult.result ? (()=>{
      const color = teamResult.result==='W' ? 'var(--forest)' : teamResult.result==='L' ? 'var(--red)' : '#8A6112';
      const bg = teamResult.result==='W' ? '#BFE0CE' : teamResult.result==='L' ? '#F0B7B1' : '#FBEFD8';
      const label = teamResult.result==='W' ? 'WIN' : teamResult.result==='L' ? 'LOSS' : 'TIE';
      const score = (teamResult.ourScore!=null && teamResult.oppScore!=null) ? ` ${teamResult.ourScore}–${teamResult.oppScore}` : '';
      return `<span class="pill" style="background:${bg}; color:${color}; margin-top:6px;">🏁 ${label}${score}</span>`;
    })() : '';
    const cardTint = teamResult.result === 'W' ? 'background:#DCEFE3; border-color:var(--forest);'
      : teamResult.result === 'L' ? 'background:#F5D9D6; border-color:var(--red);'
      : '';
    return `
      <div class="card" style="${cardTint} ${past ? 'opacity:0.6;' : ''}">
        <div style="display:flex; justify-content:space-between; align-items:flex-start;">
          <div>
            <div class="page-sub" style="margin-bottom:4px;">${past ? 'PAST EVENT' : d.mon + ' ' + d.day}</div>
            <h3 style="font-size:18px;">${esc(e.name)} ${e.isHome ? '<span class="home-badge">🏡 Home / Lunch Spread</span>' : ''}</h3>
            <div style="color:var(--ink-soft); font-size:13px; margin-top:4px;">${fmtDateLong(e.date)}${e.time ? ' · ' + fmtTime(e.time) : ''}${e.location ? ' · ' + esc(e.location) : ''}</div>
            ${resultBadge ? `<div>${resultBadge}</div>` : ''}
          </div>
          <div class="event-date" style="width:52px; ${past ? 'background:var(--ink-soft);' : ''}">
            ${e.isHome ? '<div class="home-star">⭐</div>' : ''}
            <div class="mon">${d.mon}</div><div class="day">${d.day}</div>
          </div>
        </div>
        <div class="stat-grid">
          <div class="stat-box"><div class="num" style="color:var(--forest);">${counts.confirmed}</div><div class="lbl">Confirmed</div></div>
          <div class="stat-box"><div class="num" style="color:var(--red);">${counts.out}</div><div class="lbl">Out</div></div>
          <div class="stat-box"><div class="num" style="color:var(--gold);">${counts.waiting}</div><div class="lbl">Waiting</div></div>
        </div>
        <div style="margin-top:14px;">
          <button class="btn btn-primary" onclick="openEvent('${e.id}')">View &amp; RSVP →</button>
        </div>
      </div>`;
  }

  let upcomingHtml = '';
  for(const e of upcoming) upcomingHtml += await cardFor(e, false);
  if(!upcomingHtml){
    upcomingHtml = `<div class="card empty"><span class="em">📋</span><p>No upcoming events in ${esc(season)} yet.</p></div>`;
  }

  let pastHtml = '';
  if(past.length){
    const expanded = !!state.pastExpanded[season];
    let pastCards = '';
    if(expanded){
      for(const e of past) pastCards += await cardFor(e, true);
    }
    pastHtml = `
      <button class="past-toggle" onclick="togglePastExpanded('${season}')">
        <span>📜 ${past.length} past event${past.length===1?'':'s'} in ${esc(season)}</span>
        <span>${expanded ? '▲ Hide' : '▼ Show'}</span>
      </button>
      ${pastCards}`;
  }

  return `
    <div class="page-title">Events</div>
    <div class="page-sub">Tap an event to RSVP and see who's in.</div>
    ${tabsHtml}
    ${state.adminMode ? `<div class="fab-row"><button class="btn btn-orange btn-sm" onclick="openEventModal()">+ Add Event</button></div>` : ''}
    ${upcomingHtml}
    ${pastHtml}
  `;
}
function selectSeason(s){
  state.selectedSeason = s;
  render();
}
function togglePastExpanded(season){
  state.pastExpanded[season] = !state.pastExpanded[season];
  render();
}

/* ---- Remove an entire season (super admin only) ---- */
function openRemoveSeasonConfirm(season){
  if(!state.isSuperAdmin){ showToast('Super admin PIN required'); return; }
  const count = state.events.filter(e=>effectiveSeason(e)===season).length;
  const modal = document.getElementById('modalRoot');
  modal.innerHTML = `
    <div class="overlay" onclick="closeModalIfBackdrop(event)">
      <div class="sheet" onclick="event.stopPropagation()">
        <h3>Remove ${esc(season)}?</h3>
        <div style="font-size:13.5px; color:var(--ink-soft); line-height:1.6; margin-bottom:16px;">
          This permanently deletes all <strong style="color:var(--red);">${count} event${count===1?'':'s'}</strong> in ${esc(season)}, along with every RSVP, lunch sign-up, and stat tied to them. Player season totals for other seasons and career All-Time stats for other seasons are not affected. This can't be undone.
          <br><br>If you want a record first, cancel and use <strong>⚙️ Settings → Export Backup</strong> before removing it.
        </div>
        <div class="btn-row">
          <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
          <button class="btn btn-danger" onclick="performRemoveSeason('${esc(season)}')">Delete Permanently</button>
        </div>
      </div>
    </div>`;
}

async function performRemoveSeason(season){
  const toRemove = state.events.filter(e=>effectiveSeason(e)===season);
  state.events = state.events.filter(e=>effectiveSeason(e)!==season);
  await saveEvents();
  for(const e of toRemove){
    try{ await window.storage.delete('dg_rsvp_' + e.id, true); }catch(err){ /* key may not exist */ }
    try{ await window.storage.delete('dg_stats_' + e.id, true); }catch(err){ /* key may not exist */ }
    try{ await window.storage.delete('dg_teamresult_' + e.id, true); }catch(err){ /* key may not exist */ }
    delete state.rsvpCache[e.id];
    delete state.statsCache[e.id];
    delete state.teamResultCache[e.id];
  }
  delete state.pastExpanded[season];
  if(state.selectedSeason === season) state.selectedSeason = null; // recompute on next render
  closeModal();
  showToast(`${season} removed — ${toRemove.length} event${toRemove.length===1?'':'s'} deleted`);
  render();
}

/* ---- Add/edit event modal ---- */

function closeModalIfBackdrop(e){
  if(e.target.classList.contains('overlay')) closeModal();
}
function closeModal(){ document.getElementById('modalRoot').innerHTML = ''; }

async function saveEventFromModal(existingId){
  const name = document.getElementById('ev_name').value.trim();
  const date = document.getElementById('ev_date').value;
  const time = document.getElementById('ev_time').value;
  const season = document.getElementById('ev_season').value.trim() || inferSeason(date);
  const location = document.getElementById('ev_location').value.trim();
  const isHome = document.getElementById('ev_homeSwitch').classList.contains('on');
  if(!name || !date){ showToast('Name and date are required'); return; }
  if(existingId){
    const ev = state.events.find(e=>e.id===existingId);
    Object.assign(ev, {name, date, time, season, location, isHome});
  } else {
    state.events.push({id: uid('ev'), name, date, time, season, location, isHome});
  }
  await saveEvents();
  closeModal();
  showToast(existingId ? 'Event updated' : 'Event added');
  state.selectedSeason = season;
  render();
}
async function deleteEvent(id){
  state.events = state.events.filter(e=>e.id!==id);
  await saveEvents();
  try{ await window.storage.delete('dg_rsvp_' + id, true); }catch(err){}
  try{ await window.storage.delete('dg_stats_' + id, true); }catch(err){}
  try{ await window.storage.delete('dg_teamresult_' + id, true); }catch(err){}
  delete state.rsvpCache[id];
  delete state.statsCache[id];
  delete state.teamResultCache[id];
  closeModal();
  state.view = 'events';
  showToast('Event deleted');
  render();
}

function statusPill(status){
  if(status==='confirmed') return '<span class="pill pill-forest">✅ In</span>';
  if(status==='maybe') return '<span class="pill" style="background:#F6E6C4; color:#8A6112;">🤔 Maybe</span>';
  if(status==='declined') return '<span class="pill" style="background:#F5D9D6; color:var(--red);">❌ Out</span>';
  return '<span class="pill pill-gray">⏳ No reply</span>';
}

function renderMatchRow(eventId, playerId, stats){
  const s = (stats && stats[playerId]) || {};
  const mp = s.matchplay || {played:false, result:null};
  const db = s.doubles || {played:false, result:null};
  const wlBtns = (kind, cur) => `
    <button class="wl-btn ${cur.played && cur.result==='W' ? 'win-sel':''}" onclick="setMatchResult('${eventId}','${playerId}','${kind}','W')">Won</button>
    <button class="wl-btn ${cur.played && cur.result==='L' ? 'loss-sel':''}" onclick="setMatchResult('${eventId}','${playerId}','${kind}','L')">Lost</button>
    <button class="wl-btn ${!cur.played ? 'none-sel':''}" onclick="setMatchResult('${eventId}','${playerId}','${kind}',null)">N/A</button>
  `;
  return `
    <div class="divider"></div>
    <div style="font-size:11px; font-weight:800; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.3px; margin-bottom:2px;">Admin · Match Results</div>
    <div class="match-row"><div class="match-label">Singles</div>${wlBtns('matchplay', mp)}</div>
    <div class="match-row"><div class="match-label">Doubles</div>${wlBtns('doubles', db)}</div>
  `;
}

async function setRsvpStatus(eventId, playerId, status){
  const rsvp = await loadRsvp(eventId);
  const cur = rsvp[playerId] || {status:'none', lunch:''};
  cur.status = (cur.status === status) ? 'none' : status;
  rsvp[playerId] = cur;
  await saveRsvp(eventId, rsvp);
  render();
}
async function setLunchItem(eventId, playerId, value){
  const rsvp = await loadRsvp(eventId);
  const cur = rsvp[playerId] || {status:'none', lunch:''};
  cur.lunch = value;
  rsvp[playerId] = cur;
  await saveRsvp(eventId, rsvp);
  showToast('Lunch item saved');
}
async function setMatchResult(eventId, playerId, kind, result){
  const stats = await loadStats(eventId);
  const cur = stats[playerId] || {};
  const existing = cur[kind] || {played:false, result:null};
  if(result === null){
    cur[kind] = {played:false, result:null};
  } else if(existing.played && existing.result === result){
    cur[kind] = {played:false, result:null};
  } else {
    cur[kind] = {played:true, result:result};
  }
  stats[playerId] = cur;
  await saveStats(eventId, stats);
  render();
}

async function setTeamResult(eventId, result){
  const tr = await loadTeamResult(eventId);
  tr.result = (tr.result === result) ? null : result; // tap again to clear
  await saveTeamResult(eventId, tr);
  render();
}
async function setTeamScore(eventId, side, value){
  const tr = await loadTeamResult(eventId);
  const num = value === '' ? null : Number(value);
  if(side === 'our') tr.ourScore = (num===null || isNaN(num)) ? null : num;
  else tr.oppScore = (num===null || isNaN(num)) ? null : num;
  await saveTeamResult(eventId, tr);
  render();
}

    ${state.adminMode ? `<div class="fab-row"><button class="btn btn-orange btn-sm" onclick="openPlayerModal()">+ Add Player</button></div>` : ''}
    ${rows}
  `;
}
function openPlayerModal(existingId){
  const p = existingId ? state.players.find(pl=>pl.id===existingId) : null;
  const modal = document.getElementById('modalRoot');
  modal.innerHTML = `
    <div class="overlay" onclick="closeModalIfBackdrop(event)">
      <div class="sheet" onclick="event.stopPropagation()">
        <h3>${p ? 'Edit Player' : 'Add Player'}</h3>
        <div class="field">
          <label>Name</label>
          <input id="pl_name" type="text" placeholder="Player name" value="${p ? esc(p.name) : ''}">
        </div>
        <div class="field">
          <label>Gender</label>
          <div class="seg-row" id="pl_genderRow">
            <div class="seg-btn ${(!p || p.gender!=='F') ? 'seg-sel':''}" data-g="M" onclick="selectGender(this)">M · Male</div>
            <div class="seg-btn ${(p && p.gender==='F') ? 'seg-sel':''}" data-g="F" onclick="selectGender(this)">F · Female</div>
          </div>
        </div>
        <div class="field">
          <label>Phone</label>
          <input id="pl_phone" type="tel" placeholder="(555) 123-4567" value="${p ? esc(p.phone||'') : ''}">
        </div>
        <div class="field">
          <label>Email</label>
          <input id="pl_email" type="email" placeholder="player@email.com" value="${p ? esc(p.email||'') : ''}">
        </div>
        <div style="font-size:11.5px; color:var(--ink-soft); margin-top:-4px;">Contact info is only visible to admins — teammates browsing normally won't see it.</div>
        <div class="divider"></div>
        <div class="btn-row">
          ${p ? `<button class="btn btn-danger" onclick="openDeleteConfirm('${p.id}')">Remove</button>` : ''}
          <button class="btn btn-primary" onclick="savePlayerFromModal('${p ? p.id : ''}')">${p ? 'Save Changes' : 'Add Player'}</button>
        </div>
      </div>
    </div>`;
}
function selectGender(el){
  const row = document.getElementById('pl_genderRow');
  row.querySelectorAll('.seg-btn').forEach(b=>b.classList.remove('seg-sel'));
  el.classList.add('seg-sel');
}
async function savePlayerFromModal(existingId){
  const name = document.getElementById('pl_name').value.trim();
  const genderBtn = document.querySelector('#pl_genderRow .seg-sel');
  const gender = genderBtn ? genderBtn.dataset.g : 'M';
  const phone = document.getElementById('pl_phone').value.trim();
  const email = document.getElementById('pl_email').value.trim();
  if(!name){ showToast('Enter a name'); return; }
  if(existingId){
    const p = state.players.find(pl=>pl.id===existingId);
    p.name = name;
    p.gender = gender;
    p.phone = phone;
    p.email = email;
  } else {
    state.players.push({id: uid('pl'), name, active:true, gender, phone, email});
  }
  await savePlayers();
  closeModal();
  showToast(existingId ? 'Player updated' : 'Player added');
  render();
}
async function playerHasStats(id){
  try{
    const listRes = await window.storage.list('dg_stats_', true);
    const keys = (listRes && listRes.keys) || [];
    for(const k of keys){
      const raw = await storeGet(k, true);
      if(!raw) continue;
      const data = JSON.parse(raw);
      const s = data[id];
      if(s && ((s.matchplay && s.matchplay.played) || (s.doubles && s.doubles.played))) return true;
    }
  }catch(e){ /* ignore, treat as no stats */ }
  return false;
}

function openDeleteConfirm(id){
  const p = state.players.find(pl=>pl.id===id);
  if(!p) return;
  playerHasStats(id).then(hasStats=>{
    const modal = document.getElementById('modalRoot');
    modal.innerHTML = `
      <div class="overlay" onclick="closeModalIfBackdrop(event)">
        <div class="sheet" onclick="event.stopPropagation()">
          <h3>Remove ${esc(p.name)}?</h3>
          <div style="font-size:13.5px; color:var(--ink-soft); line-height:1.6; margin-bottom:16px;">
            This permanently deletes ${esc(p.name)} from the roster${hasStats
              ? ', including <strong style="color:var(--red);">all of their recorded match results, season stats, and RSVP/lunch history</strong>'
              : ' and any RSVP history they have'}. This can\'t be undone.
            ${hasStats ? '<br><br>If you want to keep a record first, cancel and use <strong>Export Backup</strong> below before removing them.' : ''}
          </div>
          <div class="btn-row">
            <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
            <button class="btn btn-danger" onclick="performDeletePlayer('${id}')">Delete Permanently</button>
          </div>
        </div>
      </div>`;
  });
}

async function performDeletePlayer(id){
  state.players = state.players.filter(p=>p.id!==id);
  await savePlayers();
  try{
    const rsvpList = await window.storage.list('dg_rsvp_', true);
    for(const k of ((rsvpList && rsvpList.keys) || [])){
      const raw = await storeGet(k, true);
      if(!raw) continue;
      const data = JSON.parse(raw);
      if(data[id] !== undefined){
        delete data[id];
        await storeSet(k, JSON.stringify(data), true);
        state.rsvpCache[k.slice('dg_rsvp_'.length)] = data;
      }
    }
    const statsList = await window.storage.list('dg_stats_', true);
    for(const k of ((statsList && statsList.keys) || [])){
      const raw = await storeGet(k, true);
      if(!raw) continue;
      const data = JSON.parse(raw);
      if(data[id] !== undefined){
        delete data[id];
        await storeSet(k, JSON.stringify(data), true);
        state.statsCache[k.slice('dg_stats_'.length)] = data;
      }
    }
  }catch(e){ console.error(e); }
  closeModal();
  showToast('Player and all related data removed');
  render();
}
async function togglePlayerActive(id){
  const p = state.players.find(pl=>pl.id===id);
  p.active = p.active===false ? true : false;
  await savePlayers();
  render();
}

/* ============================= STATS ============================= */
async function renderStats(){
  const FINALS_MIN_EVENTS = 3;
  const currentSeason = inferSeason(todayISO());
  if(state.statsScope === undefined) state.statsScope = 'season'; // 'season' = current season only, 'all' = all-time

  // Map every known eventId -> its season, so stats keys (which are only keyed by eventId) can be filtered.
  const seasonByEvent = {};
  state.events.forEach(e=>{ seasonByEvent[e.id] = effectiveSeason(e); });

  const record = {}; // playerId -> {mpW,mpL,dbW,dbL, eventsPlayed:Set}
  state.players.forEach(p=>{ record[p.id] = {mpW:0,mpL:0,dbW:0,dbL:0, eventsPlayed:new Set()}; });

  try{
    const listRes = await window.storage.list('dg_stats_', true);
    const keys = (listRes && listRes.keys) || [];
    for(const k of keys){
      const eventId = k.slice('dg_stats_'.length);
      const eventSeason = seasonByEvent[eventId]; // undefined if the event was deleted
      if(state.statsScope === 'season'){
        if(eventSeason !== currentSeason) continue; // skip other seasons, and orphaned events with unknown season
      }
      const raw = await storeGet(k, true);
      if(!raw) continue;
      const data = JSON.parse(raw);
      Object.keys(data).forEach(pid=>{
        if(!record[pid]) record[pid] = {mpW:0,mpL:0,dbW:0,dbL:0, eventsPlayed:new Set()};
        const s = data[pid];
        const playedThisEvent = !!((s.matchplay && s.matchplay.played) || (s.doubles && s.doubles.played));
        if(playedThisEvent) record[pid].eventsPlayed.add(eventId);
        if(s.matchplay && s.matchplay.played){
          if(s.matchplay.result==='W') record[pid].mpW++;
          else if(s.matchplay.result==='L') record[pid].mpL++;
        }
        if(s.doubles && s.doubles.played){
          if(s.doubles.result==='W') record[pid].dbW++;
          else if(s.doubles.result==='L') record[pid].dbL++;
        }
      });
    }
  }catch(e){ /* no stats yet */ }

  // ---- Team Result (Win/Loss/Tie + score) aggregation, same season/all-time scope ----
  const teamEvents = []; // {event, result, ourScore, oppScore}
  let sumOur = 0, sumTotal = 0, tW=0, tL=0, tT=0;
  try{
    const trList = await window.storage.list('dg_teamresult_', true);
    const trKeys = (trList && trList.keys) || [];
    for(const k of trKeys){
      const eventId = k.slice('dg_teamresult_'.length);
      const ev = state.events.find(e=>e.id===eventId);
      if(!ev) continue; // skip orphaned entries from deleted events
      if(state.statsScope === 'season' && effectiveSeason(ev) !== currentSeason) continue;
      const raw = await storeGet(k, true);
      if(!raw) continue;
      const data = JSON.parse(raw);
      if(!data.result && data.ourScore==null && data.oppScore==null) continue;
      teamEvents.push({event: ev, result: data.result, ourScore: data.ourScore, oppScore: data.oppScore});
      if(data.result==='W') tW++; else if(data.result==='L') tL++; else if(data.result==='T') tT++;
      if(data.ourScore!=null && data.oppScore!=null){
        sumOur += data.ourScore;
        sumTotal += data.ourScore + data.oppScore;
      }
    }
  }catch(e){ /* no team results yet */ }
  teamEvents.sort((a,b)=>b.event.date.localeCompare(a.event.date)); // most recent first
  const pointPct = sumTotal > 0 ? (sumOur/sumTotal*100) : null;

  const teamEventsHtml = teamEvents.map(te=>{
    const d = fmtDate(te.event.date);
    const color = te.result==='W' ? 'var(--forest)' : te.result==='L' ? 'var(--red)' : '#8A6112';
    const bg = te.result==='W' ? '#E1E8F5' : te.result==='L' ? '#F5D9D6' : '#FBEFD8';
    const label = te.result==='W' ? 'WIN' : te.result==='L' ? 'LOSS' : te.result==='T' ? 'TIE' : '—';
    const evPct = (te.ourScore!=null && te.oppScore!=null && (te.ourScore+te.oppScore)>0) ? ((te.ourScore/(te.ourScore+te.oppScore))*100).toFixed(1)+'%' : '—';
    return `
      <div class="stats-row" style="grid-template-columns: 1.6fr 0.8fr 0.9fr;">
        <div>
          <div class="pname" style="font-size:13.5px;">${esc(te.event.name)}</div>
          <div style="font-size:10.5px; color:var(--ink-soft); font-weight:700;">${d.mon} ${d.day}</div>
        </div>
        <div style="text-align:center;">
          <span class="pill" style="background:${bg}; color:${color};">${label}</span>
        </div>
        <div class="rec" style="color:${color};">${(te.ourScore!=null && te.oppScore!=null) ? te.ourScore+'–'+te.oppScore : '—'}<span class="sub">${evPct} PTS</span></div>
      </div>`;
  }).join('');

  const teamRecordSection = `
    <div class="stats-section-header">🏆 Team Record</div>
    <div class="card">
      <div class="stat-grid">
        <div class="stat-box"><div class="num" style="color:var(--forest);">${tW}-${tL}-${tT}</div><div class="lbl">Win-Loss-Tie</div></div>
        <div class="stat-box"><div class="num" style="color:var(--orange-dark);">${pointPct!=null ? pointPct.toFixed(1)+'%' : '—'}</div><div class="lbl">Point %</div></div>
      </div>
      <div style="font-size:11px; color:var(--ink-soft); margin-top:10px; line-height:1.5;">Point % is our team's total points scored across ${state.statsScope==='season' ? esc(currentSeason) : 'all seasons'}, divided by the total points scored by both teams combined — useful for breaking ties in the standings.</div>
    </div>
    ${teamEventsHtml ? teamEventsHtml : `<div class="card empty" style="padding:20px;"><p style="margin:0; font-size:13px;">No team results recorded yet${state.statsScope==='season' ? ' for ' + esc(currentSeason) : ''}.</p></div>`}
  `;

  const rows = [...state.players].sort((a,b)=>{
    const ra = record[a.id], rb = record[b.id];
    const qa = ra.eventsPlayed.size >= FINALS_MIN_EVENTS ? 1 : 0;
    const qb = rb.eventsPlayed.size >= FINALS_MIN_EVENTS ? 1 : 0;
    if(qb !== qa) return qb - qa;
    const totalA = ra.mpW+ra.mpL+ra.dbW+ra.dbL, totalB = rb.mpW+rb.mpL+rb.dbW+rb.dbL;
    return totalB - totalA;
  }).map(p=>{
    const r = record[p.id];
    const hasMp = (r.mpW+r.mpL) > 0;
    const hasDb = (r.dbW+r.dbL) > 0;
    const eventsPlayed = r.eventsPlayed.size;
    const qualified = eventsPlayed >= FINALS_MIN_EVENTS;
    return `
      <div class="stats-row" style="${qualified ? 'background:#FFF3E6; border-color:var(--orange);' : ''}">
        <div>
          <div class="pname">${esc(p.name)}</div>
          <div style="font-size:10.5px; font-weight:700; color:${qualified ? 'var(--orange-dark)' : 'var(--ink-soft)'}; margin-top:2px;">
            Events Played: ${eventsPlayed}${qualified ? ' ⭐' : ''}
          </div>
        </div>
        <div class="rec" style="color:${hasMp ? 'var(--forest-dark)':'var(--ink-soft)'};">${hasMp ? r.mpW+'-'+r.mpL : '—'}<span class="sub">Singles</span></div>
        <div class="rec" style="color:${hasDb ? 'var(--forest-dark)':'var(--ink-soft)'};">${hasDb ? r.dbW+'-'+r.dbL : '—'}<span class="sub">Doubles</span></div>
      </div>`;
  }).join('');

  return `
    <div class="page-title">Season Stats</div>
    <div class="page-sub">Singles matchplay &amp; doubles stroke play, tracked per event.</div>
    <div class="season-tabs">
      <button class="season-tab ${state.statsScope==='season'?'active':''}" onclick="setStatsScope('season')">${esc(currentSeason)} · Current</button>
      <button class="season-tab ${state.statsScope==='all'?'active':''}" onclick="setStatsScope('all')">All-Time</button>
    </div>
    ${teamRecordSection}
    <div class="stats-section-header">👤 Player Stats</div>
    <div class="stats-header-row">
      <div>Player</div><div style="text-align:center;">Singles W-L</div><div style="text-align:center;">Doubles W-L</div>
    </div>
    ${rows || `<div class="card empty"><span class="em">🏆</span><p>No results recorded yet${state.statsScope==='season' ? ' for ' + esc(currentSeason) : ''}. Enter results from an event page in Admin mode.</p></div>`}
    <div class="card" style="background:var(--chip-bg); border:none; box-shadow:none; margin-top:6px;">
      <div style="font-size:12.5px; color:var(--ink-soft); line-height:1.5;">${state.statsScope==='season' ? `Showing <strong>${esc(currentSeason)}</strong> only — switch to All-Time above to see career totals across every season. ` : ''}<strong style="color:var(--orange-dark);">🏁 Finals Qualified</strong> means the player has a recorded result (singles or doubles) at ${FINALS_MIN_EVENTS} or more different events within the view you're looking at — just being confirmed for an event doesn't count, only an entered result does. Stats are otherwise optional per player — someone who only plays doubles will just show a dash for Singles. Coming soon: a mock matchup builder to plan pairings against another team's roster before the round.</div>
    </div>
  `;
}
function setStatsScope(scope){
  state.statsScope = scope;
  render();
}

/* ============================= BACKUP / RESTORE ============================= */
async function exportBackup(){
  try{
    const backup = { version: 1, exportedAt: new Date().toISOString(), players: state.players, events: state.events, rsvp: {}, stats: {}, teamResults: {} };
    const rsvpList = await window.storage.list('dg_rsvp_', true);
    for(const k of ((rsvpList && rsvpList.keys) || [])){
      const raw = await storeGet(k, true);
      if(raw) backup.rsvp[k] = JSON.parse(raw);
    }
    const statsList = await window.storage.list('dg_stats_', true);
    for(const k of ((statsList && statsList.keys) || [])){
      const raw = await storeGet(k, true);
      if(raw) backup.stats[k] = JSON.parse(raw);
    }
    const teamResultList = await window.storage.list('dg_teamresult_', true);
    for(const k of ((teamResultList && teamResultList.keys) || [])){
      const raw = await storeGet(k, true);
      if(raw) backup.teamResults[k] = JSON.parse(raw);
    }
    const blob = new Blob([JSON.stringify(backup, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const stamp = new Date().toISOString().slice(0,10);
    a.href = url;
    a.download = `two-buff-team-hub-backup-${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('Backup downloaded');
  }catch(e){
    console.error(e);
    showToast('Export failed — try again');
  }
}

async function importBackup(file){
  if(!file) return;
  try{
    const text = await file.text();
    const backup = JSON.parse(text);
    if(!backup || !Array.isArray(backup.players) || !Array.isArray(backup.events)){
      showToast('That file doesn\'t look like a valid backup');
      return;
    }
    state.players = backup.players;
    state.events = backup.events;
    await savePlayers();
    await saveEvents();
    for(const k of Object.keys(backup.rsvp || {})){
      await storeSet(k, JSON.stringify(backup.rsvp[k]), true);
    }
    for(const k of Object.keys(backup.stats || {})){
      await storeSet(k, JSON.stringify(backup.stats[k]), true);
    }
    for(const k of Object.keys(backup.teamResults || {})){
      await storeSet(k, JSON.stringify(backup.teamResults[k]), true);
    }
    state.rsvpCache = {};
    state.statsCache = {};
    state.teamResultCache = {};
    showToast('Backup restored');
    render();
  }catch(e){
    console.error(e);
    showToast('Restore failed — check the file');
  }
}

function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function cleanPhoneHref(phone){
  // Keep a leading + (country code) and digits only, for sms:/tel: links.
  const trimmed = String(phone||'').trim();
  const plus = trimmed.startsWith('+') ? '+' : '';
  return plus + trimmed.replace(/[^0-9]/g,'');
}

/* ============================= GO ============================= */
init();
</script>
