    --bg:#F4F6FA;
    --surface:#FFFFFF;
    --ink:#0E1B2E;
    --ink-soft:#5C6B84;
    --forest:#12294D;
    --forest-dark:#0A1830;
    --orange:#FF7A1A;
    --orange-dark:#E4650A;
    --teal:#2F7E92;
    --gold:#D99A2B;
    --red:#C4453B;
    --line:#DFE4EE;
    --chip-bg:#E9EDF6;
    --radius:18px;
    --radius-sm:12px;
    --shadow: 0 1px 2px rgba(14,27,46,0.05), 0 6px 16px rgba(14,27,46,0.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:84px;
    min-height:100vh;
  }
  .app{max-width:640px;margin:0 auto;position:relative;}

  /* ---------- Top bar ---------- */
  .topbar{
    position:sticky; top:0; z-index:20;
    background:var(--forest);
    color:#fff;
    padding:14px 16px 12px;
    display:flex; align-items:center; justify-content:space-between;
    box-shadow:var(--shadow);
  }
  .topbar .brand{display:flex; align-items:center; gap:10px;}
  .brand-mark{
    width:34px;height:34px;border-radius:50%;
    background:var(--forest-dark);
    overflow:hidden;
    box-shadow: inset 0 0 0 2px rgba(255,255,255,0.18);
  }
  .brand-mark img{width:100%; height:100%; object-fit:cover; display:block;}
  .brand-text{line-height:1.1;}
  .brand-text .t1{font-weight:800; font-size:16px; letter-spacing:0.2px;}
  .brand-text .t2{font-size:11px; color:#B9C9E8; letter-spacing:0.6px; text-transform:uppercase;}
  .admin-toggle{display:flex;align-items:center;gap:8px; font-size:12px; color:#D8E9DF;}
  .settings-gear{background:none; border:none; color:#fff; font-size:19px; cursor:pointer; padding:2px 0; line-height:1; opacity:0.9;}
  .settings-gear:active{opacity:0.6;}
  .switch{
    width:40px;height:24px;border-radius:14px;background:#C7CEDC;
    box-shadow:inset 0 0 0 1px rgba(14,27,46,0.15);
    position:relative;cursor:pointer;transition:background .15s;flex-shrink:0;
  }
  .switch.on{background:var(--orange); box-shadow:none;}
  .switch .knob{
    position:absolute; top:3px; left:3px; width:18px;height:18px;border-radius:50%;
    background:#fff; transition:left .15s; box-shadow:0 1px 3px rgba(14,27,46,0.35);
  }
  .switch.on .knob{left:19px;}

  /* ---------- Bottom nav ---------- */
  .bottomnav{
    position:fixed; bottom:0; left:0; right:0; z-index:20;
    background:var(--surface); border-top:1px solid var(--line);
    display:flex; max-width:640px; margin:0 auto;
    box-shadow:0 -4px 16px rgba(21,36,32,0.06);
  }
  .navbtn{
    flex:1; padding:9px 2px 11px; background:none; border:none; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:2px;
    color:var(--ink-soft); font-size:10px; font-weight:700; letter-spacing:0.2px;
  }
  .navbtn .ic{font-size:18px;}
  .navbtn.active{color:var(--forest);}
  .navbtn.active .ic{transform:scale(1.08);}

  main{padding:16px; padding-bottom:24px;}

  h1,h2,h3{margin:0; color:var(--forest-dark);}
  .page-title{font-size:21px; font-weight:800; margin-bottom:2px;}
  .page-sub{color:var(--ink-soft); font-size:13px; margin-bottom:16px;}

  .card{
    background:var(--surface); border-radius:var(--radius); padding:16px;
    box-shadow:var(--shadow); margin-bottom:14px; border:1px solid var(--line);
  }

  /* ---------- Buttons ---------- */
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    border:none; border-radius:14px; font-weight:800; font-size:15px;
    padding:14px 18px; cursor:pointer; transition:transform .08s, opacity .12s;
    width:100%;
  }
  .btn:active{transform:scale(0.97);}
  .btn-primary{background:var(--forest); color:#fff;}
  .btn-orange{background:var(--orange); color:#fff;}
  .btn-outline{background:#fff; color:var(--forest); border:2px solid var(--forest);}
  .btn-ghost{background:var(--chip-bg); color:var(--ink);}
  .btn-danger{background:#fff; color:var(--red); border:2px solid var(--red);}
  .btn-sm{padding:8px 12px; font-size:13px; border-radius:10px; width:auto;}
  .btn-row{display:flex; gap:10px;}
  .btn-row .btn{flex:1;}

  /* RSVP status buttons */
  .rsvp-grid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-top:10px;}
  .rsvp-btn{
    border-radius:14px; border:2px solid var(--line); background:#fff;
    padding:12px 6px; font-weight:800; font-size:12.5px; cursor:pointer;
    text-align:center; color:var(--ink-soft); line-height:1.3;
  }
  .rsvp-btn .em{display:block; font-size:18px; margin-bottom:2px;}
  .rsvp-btn.sel-confirmed{background:var(--forest); border-color:var(--forest); color:#fff;}
  .rsvp-btn.sel-maybe{background:var(--gold); border-color:var(--gold); color:#3B2A05;}
  .rsvp-btn.sel-declined{background:var(--red); border-color:var(--red); color:#fff;}

  /* ---------- Chips / status pills ---------- */
  .pill{display:inline-flex; align-items:center; gap:5px; padding:4px 10px; border-radius:20px; font-size:11.5px; font-weight:800;}
  .pill.pill-hist{max-width:100%; box-sizing:border-box; white-space:normal; overflow-wrap:anywhere; text-align:right;}
  .pill-forest{background:#E1E8F5; color:var(--forest);}
  .pill-orange{background:#FBE4D8; color:var(--orange-dark);}
  .pill-gray{background:var(--chip-bg); color:var(--ink-soft);}

  /* ---------- Event list ---------- */
  .event-row{
    display:flex; align-items:center; gap:12px; padding:14px; background:var(--surface);
    border-radius:var(--radius); box-shadow:var(--shadow); margin-bottom:10px; cursor:pointer;
    border:1px solid var(--line);
  }
  .event-date{
    width:52px; flex-shrink:0; text-align:center; background:var(--forest); color:#fff;
    border-radius:12px; padding:8px 0; position:relative;
  }
  .home-star{
    position:absolute; top:-7px; right:-7px; width:20px; height:20px; border-radius:50%;
    background:var(--orange); color:#fff; font-size:11px; display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 0 2px #fff;
  }
  .event-date .mon{font-size:10px; text-transform:uppercase; letter-spacing:0.5px; opacity:0.85;}
  .event-date .day{font-size:19px; font-weight:800; line-height:1;}
  .event-info{flex:1; min-width:0;}
  .event-info .nm{font-weight:800; font-size:15px; margin-bottom:2px;}
  .event-info .loc{font-size:12.5px; color:var(--ink-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .event-arrow{color:var(--ink-soft); font-size:18px;}

  /* ---------- Summary stat grid ---------- */
  .stat-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:10px;}
  .stat-grid-2{display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin-top:10px;}
  .stat-box{background:var(--chip-bg); border-radius:14px; padding:12px 6px; text-align:center;}
  .stat-box .num{font-size:22px; font-weight:800; color:var(--forest-dark);}
  .stat-box .lbl{font-size:10.5px; color:var(--ink-soft); font-weight:700; text-transform:uppercase; letter-spacing:0.3px;}
  .lunch-bar-wrap{margin-top:12px;}
  .lunch-bar-track{background:var(--chip-bg); border-radius:10px; height:14px; overflow:hidden;}
  .lunch-bar-fill{background:linear-gradient(90deg, var(--orange), var(--gold)); height:100%; border-radius:10px; transition:width .3s;}

  /* ---------- Player row in event ---------- */
  .player-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:14px; margin-bottom:10px;}
  .player-card .pname{font-weight:800; font-size:15px; margin-bottom:2px;}
  .lunch-input{
    margin-top:10px; width:100%; padding:10px 12px; border-radius:10px; border:2px solid var(--line);
    font-size:14px; font-family:inherit;
  }
  .lunch-input:focus{outline:none; border-color:var(--forest);}

  .match-row{display:flex; align-items:center; gap:10px; margin-top:10px;}
  .match-label{width:64px; font-size:12px; font-weight:700; color:var(--ink-soft);}
  .wl-btn{border-radius:10px; border:2px solid var(--line); background:#fff; padding:8px 4px; font-weight:800; font-size:12px; flex:1; cursor:pointer; color:var(--ink-soft);}
  .wl-btn.win-sel{background:var(--forest); border-color:var(--forest); color:#fff;}
  .wl-btn.tie-sel{background:var(--gold); border-color:var(--gold); color:#3B2A05;}
  .wl-btn.loss-sel{background:var(--red); border-color:var(--red); color:#fff;}
  .wl-btn.none-sel{background:var(--chip-bg); border-color:var(--chip-bg); color:var(--ink-soft);}

  /* ---------- Team tab ---------- */
  .team-row{display:flex; align-items:flex-start; justify-content:space-between; padding:14px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); margin-bottom:10px;}
  .avatar{width:38px;height:38px;border-radius:50%; background:var(--forest); color:#fff; display:flex;align-items:center;justify-content:center; font-weight:800; font-size:14px; flex-shrink:0;}
  .team-name-row{display:flex; align-items:center; gap:12px;}

  /* ---------- Stats table ---------- */
  .stats-header-row, .stats-row{display:grid; grid-template-columns: 1.6fr 1fr 1fr; gap:6px; align-items:center;}
  .stats-header-row{font-size:10.5px; font-weight:800; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.3px; padding:0 4px 8px;}
  .stats-row{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:12px; margin-bottom:8px;}
  .stats-row .pname{font-weight:800; font-size:14px;}
  .player-stat-card{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:12px; margin-bottom:8px; cursor:pointer;}
  .player-stat-card .row-grid{display:grid; grid-template-columns: 1.6fr 1fr 1fr; gap:6px; align-items:center;}
  .player-stat-card .pname{font-weight:800; font-size:14px;}
  .rec{text-align:center; font-weight:800; font-size:14px;}
  .rec .sub{display:block; font-size:9.5px; font-weight:700; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.3px;}

  .empty{text-align:center; padding:34px 16px; color:var(--ink-soft);}
  .empty .em{font-size:36px; display:block; margin-bottom:8px;}
  .empty p{margin:0 0 14px; font-size:14px;}

  /* ---------- Modal ---------- */
  .overlay{position:fixed; inset:0; background:rgba(18,30,25,0.55); z-index:50; display:flex; align-items:flex-end; justify-content:center;}
  .sheet{
    background:var(--surface); width:100%; max-width:640px; border-radius:22px 22px 0 0;
    padding:20px 18px 26px; max-height:88vh; overflow-y:auto;
  }
  .sheet h3{font-size:17px; margin-bottom:14px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12px; font-weight:800; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.3px; margin-bottom:6px;}
  .field input, .field select{
    width:100%; padding:12px 12px; border-radius:12px; border:2px solid var(--line); font-size:15px; font-family:inherit;
  }
  .field input:focus, .field select:focus{outline:none; border-color:var(--forest);}
  .toggle-row{display:flex; align-items:center; justify-content:space-between; padding:6px 2px;}
  .seg-row{display:flex; gap:8px;}
  .seg-btn{flex:1; padding:12px 6px; border-radius:12px; border:2px solid var(--line); background:#fff; font-weight:800; font-size:14px; cursor:pointer; color:var(--ink-soft); text-align:center;}
  .seg-btn.seg-sel{background:var(--forest); border-color:var(--forest); color:#fff;}
  .gender-badge{display:inline-flex; align-items:center; justify-content:center; width:22px; height:22px; border-radius:50%; font-size:11px; font-weight:800; flex-shrink:0;}
  .gender-badge.g-m{background:#DCEBF3; color:var(--teal);}
  .gender-badge.g-f{background:#FBE0EC; color:#C13584;}

  .section-label{font-size:11px; font-weight:800; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.5px; margin:18px 0 8px;}
  .stats-section-header{
    display:flex; align-items:center; gap:8px; font-size:16px; font-weight:800; color:var(--forest-dark);
    border-left:4px solid var(--orange); padding-left:10px; margin:22px 0 12px;
  }
  .stats-section-header:first-of-type{ margin-top:6px; }
  .divider{height:1px; background:var(--line); margin:14px 0;}
  .home-badge{background:#FBE4D8; color:var(--orange-dark); font-size:10.5px; font-weight:800; padding:3px 8px; border-radius:8px; text-transform:uppercase; letter-spacing:0.3px;}
  .venue-badge{background:var(--chip-bg); color:var(--ink-soft); font-size:10.5px; font-weight:800; padding:3px 8px; border-radius:8px; text-transform:uppercase; letter-spacing:0.3px;}
  .suggest-rank{display:inline-flex; align-items:center; justify-content:center; min-width:16px; height:16px; padding:0 4px; border-radius:8px; background:var(--forest); color:#fff; font-size:10px; font-weight:800; vertical-align:middle;}
  .toast{
    position:fixed; bottom:96px; left:50%; transform:translateX(-50%); background:var(--forest-dark); color:#fff;
    padding:10px 18px; border-radius:20px; font-size:13px; font-weight:700; z-index:110; box-shadow:var(--shadow);
    opacity:0; transition:opacity .2s;
  }
  .toast.show{opacity:1;}
  .app-gate{
    position:fixed; inset:0; z-index:100; background:var(--forest); display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .app-gate-card{
    background:#fff; border-radius:22px; padding:34px 26px; max-width:340px; width:100%; text-align:center; box-shadow:var(--shadow);
  }
  .app-gate-card .brand-mark{width:52px; height:52px; margin:0 auto 16px; font-size:19px;}
  .app-gate-card h2{font-size:19px; margin-bottom:4px;}
  .app-gate-card p{font-size:13px; color:var(--ink-soft); margin:0 0 18px;}
  .app-gate-card input{
    width:100%; padding:14px; border-radius:12px; border:2px solid var(--line); font-size:26px; text-align:center;
    letter-spacing:12px; margin-bottom:12px; font-family:inherit;
  }
  .app-gate-card input:focus{outline:none; border-color:var(--forest);}
  .app-gate-error{color:var(--red); font-size:12.5px; font-weight:700; margin:-4px 0 12px; display:none;}
  .loading-dots{text-align:center; padding:40px; color:var(--ink-soft); font-size:14px;}
  .icon-btn{background:var(--chip-bg); border:none; border-radius:10px; padding:8px 10px; font-size:15px; cursor:pointer;}
  .fab-row{display:flex; justify-content:flex-end; margin-bottom:12px;}
  .season-tabs{display:flex; gap:8px; overflow-x:auto; overflow-y:visible; padding:10px 10px 6px 2px; margin:-10px -10px 10px -2px; -webkit-overflow-scrolling:touch;}
  .season-tab{
    flex-shrink:0; padding:9px 16px; border-radius:20px; border:2px solid var(--line); background:#fff;
    font-weight:800; font-size:13px; color:var(--ink-soft); cursor:pointer; white-space:nowrap;
  }
  .season-tab.active{background:var(--forest); border-color:var(--forest); color:#fff;}
  .season-tab-sm{
    flex-shrink:0; padding:5px 11px; border-radius:14px; border:2px solid var(--line); background:#fff;
    font-weight:800; font-size:11px; color:var(--ink-soft); cursor:pointer; white-space:nowrap;
  }
  .season-tab-sm.active{background:var(--forest); border-color:var(--forest); color:#fff;}
  .season-tab-wrap{position:relative; flex-shrink:0;}
  .season-tab-remove{
    position:absolute; top:-7px; right:-7px; width:19px; height:19px; border-radius:50%;
    background:var(--red); color:#fff; border:2px solid #fff; font-size:12px; font-weight:800;
    line-height:1; display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0;
  }
  .past-toggle{
    display:flex; align-items:center; justify-content:space-between; width:100%; background:var(--chip-bg);
    border:none; border-radius:14px; padding:13px 16px; font-weight:800; font-size:13px; color:var(--ink-soft);
    cursor:pointer; margin:6px 0 14px;
  }
  .matchup-cols{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px;}
  .matchup-col-label{font-size:11px; font-weight:800; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.4px; margin-bottom:8px; text-align:center;}
  .matchup-chip{
    display:block; width:100%; text-align:left; background:#fff; border:2px solid var(--line); border-radius:12px;
    padding:10px 12px; margin-bottom:8px; font-size:13.5px; font-weight:700; color:var(--ink); cursor:pointer;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
  }
  .matchup-chip.armed{background:var(--orange); border-color:var(--orange); color:#fff;}
  .matchup-chip.paired{background:#E1E8F5; border-color:var(--forest); color:var(--forest);}
  .matchup-chip .sub{display:block; font-size:10.5px; font-weight:700; opacity:0.8; margin-top:2px;}
  .matchup-pair-row{
    display:flex; align-items:center; justify-content:space-between; background:var(--chip-bg); border-radius:12px;
    padding:10px 12px; margin-bottom:8px;
  }
  .matchup-pair-row .vs{font-size:13px; font-weight:800; color:var(--ink);}
  .matchup-paired-card{display:flex; align-items:center; gap:8px; margin-bottom:9px;}
  .matchup-chip.opp-paired{background:#FBE4D8; border-color:var(--orange); color:var(--orange-dark);}
  .matchup-connector{flex-shrink:0; font-size:11px; font-weight:800; color:var(--ink-soft); text-transform:uppercase;}
  .matchup-format-pill{
    display:inline-flex; align-items:center; gap:6px; background:#E1E8F5; border:2px solid var(--forest); color:var(--forest);
    border-radius:20px; padding:7px 16px; font-size:13px; font-weight:800; cursor:pointer; user-select:none; -webkit-user-select:none;
  }
  .matchup-format-pill:active{transform:scale(0.97);}
  .matchup-team-pill{flex-shrink:0; padding:9px 16px; border-radius:20px; border:2px solid var(--line); background:#fff; font-weight:800; font-size:13px; color:var(--ink-soft); cursor:pointer; white-space:nowrap;}
  .matchup-team-pill.active{background:var(--forest); border-color:var(--forest); color:#fff;}
</style>
</head>
<body>

// Force long-polling instead of Firestore's default streaming connection —
// this app only does one-off reads/writes (no realtime listeners), and
// long-polling reconnects far more reliably on mobile networks after the
// app has been backgrounded (iOS kills the default streaming connection).
_db.settings({ experimentalForceLongPolling: true });
const _KV_COLLECTION = 'kv_store';

// Drop-in replacement for Claude's built-in window.storage, backed by Firestore.
// Every call site in this app already uses shared:true, so this shim doesn't
// need to distinguish personal vs shared — it's all one shared team database.
window.storage = {
  async get(key, shared){
    const snap = await _db.collection(_KV_COLLECTION).doc(key).get();
    if(!snap.exists) throw new Error('Key not found: ' + key);
    const data = snap.data();
    return { key, value: data.value, shared: !!shared };
  },
  async set(key, value, shared){
    await _db.collection(_KV_COLLECTION).doc(key).set({ value, updatedAt: Date.now() });
    return { key, value, shared: !!shared };
  },
  async delete(key, shared){
    await _db.collection(_KV_COLLECTION).doc(key).delete();
    return { key, deleted: true, shared: !!shared };
  },
  async list(prefix, shared){
    let query = _db.collection(_KV_COLLECTION);
    if(prefix){
      query = query
        .where(firebase.firestore.FieldPath.documentId(), '>=', prefix)
        .where(firebase.firestore.FieldPath.documentId(), '<', prefix + '\uf8ff');
    }
    const snap = await query.get();
    const values = {};
    snap.docs.forEach(d => { values[d.id] = d.data().value; });
    return { keys: snap.docs.map(d => d.id), values, prefix, shared: !!shared };
  }
};

function initials(name){

function fmtDate(iso){
  if(!iso) return {mon:'--', day:'--'};
  const d = new Date(iso + 'T00:00:00');
  return { mon: MONTHS[d.getMonth()], day: d.getDate() };
}
function fmtDateLong(iso){
  if(!iso) return '';
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString(undefined, {weekday:'long', month:'long', day:'numeric', year:'numeric'});
}
function fmtTime(t){
  if(!t) return '';
  const [h,m] = t.split(':').map(Number);
  const period = h >= 12 ? 'PM' : 'AM';
  const h12 = h % 12 === 0 ? 12 : h % 12;
  return `${h12}:${String(m).padStart(2,'0')} ${period}`;
}
// Leagues that span a calendar-year boundary (e.g. fall through spring) get a
// "2026-2027" style label. Cutoff is July 1 — events Jul–Dec belong to the
// season starting that year; events Jan–Jun belong to the season that started
// the previous year. Purely a sensible default — admins can edit it per event.
function inferSeason(dateISO){
  if(!dateISO) return '';
  const d = new Date(dateISO + 'T00:00:00');
  const y = d.getFullYear(), m = d.getMonth();
  return m >= 6 ? `${y}-${y+1}` : `${y-1}-${y}`;
}
function effectiveSeason(e){
  return (e.season && e.season.trim()) ? e.season.trim() : inferSeason(e.date);
}

/* ============================= STORAGE ============================= */
async function storeGet(key, shared){
  try{
    const res = await window.storage.get(key, shared);
    return res ? res.value : null;
  }catch(e){ return null; }
}
async function storeSet(key, value, shared){
  try{
    const res = await window.storage.set(key, value, shared);
    return !!res;
  }catch(e){ console.error('storage set failed', key, e); return false; }
}

// RSVPs are stored one key PER PLAYER PER EVENT (dg_rsvp_<eventId>_<playerId>) rather
// than one shared blob per event. This means two different people RSVPing at the same
// moment write to entirely different keys and can never overwrite each other — the only
// remaining collision is two writes to the exact same person's own entry at the same
// instant, which is an accepted, much narrower edge case.
async function loadRsvp(eventId){
  if(state.rsvpCache[eventId]) return state.rsvpCache[eventId];
  const prefix = 'dg_rsvp_' + eventId + '_';
  const data = {};
  try{
    const listRes = await window.storage.list(prefix, true);
    const keys = (listRes && listRes.keys) || [];
    if(listRes && listRes.values){
      keys.forEach(k=>{
        const raw = listRes.values[k];
        if(raw) data[k.slice(prefix.length)] = JSON.parse(raw);
      });
    } else {
      const raws = await Promise.all(keys.map(k=>storeGet(k, true)));
      keys.forEach((k,i)=>{
        if(!raws[i]) return;
        data[k.slice(prefix.length)] = JSON.parse(raws[i]);
      });
    }
    // One-time migration: RSVPs used to be saved as a single blob under the bare event
    // key (no trailing player id). If no per-player keys were found but that legacy blob
    // exists, adopt its data now and quietly split it into per-player keys in the
    // background so existing responses aren't orphaned by the new storage scheme.
    if(Object.keys(data).length === 0){
      const legacyRaw = await storeGet('dg_rsvp_' + eventId, true);
      if(legacyRaw){
        const legacyData = JSON.parse(legacyRaw);
        Object.keys(legacyData).forEach(pid => { data[pid] = legacyData[pid]; });
        Promise.all(Object.keys(legacyData).map(pid =>
          storeSet('dg_rsvp_' + eventId + '_' + pid, JSON.stringify(legacyData[pid]), true)
        )).then(() => window.storage.delete('dg_rsvp_' + eventId, true)).catch(()=>{});
      }
    }
  }catch(e){ /* no rsvp entries yet for this event */ }
  state.rsvpCache[eventId] = data;
  return data;
}
// Writes exactly ONE player's RSVP entry — never touches anyone else's key.
async function saveRsvpEntry(eventId, playerId, entry){
  if(!state.rsvpCache[eventId]) state.rsvpCache[eventId] = {};
  state.rsvpCache[eventId][playerId] = entry;
  if(state.allRsvpCache){
    if(!state.allRsvpCache[eventId]) state.allRsvpCache[eventId] = {};
    state.allRsvpCache[eventId][playerId] = entry;
  }
  await storeSet('dg_rsvp_' + eventId + '_' + playerId, JSON.stringify(entry), true);
}
// Deletes every per-player RSVP key for an event (used when the whole event is removed).
async function deleteAllRsvpForEvent(eventId){
  try{
    const prefix = 'dg_rsvp_' + eventId + '_';
    const listRes = await window.storage.list(prefix, true);
    const keys = (listRes && listRes.keys) || [];
    await Promise.all(keys.map(k => window.storage.delete(k, true).catch(()=>{})));
  }catch(err){ /* nothing to delete */ }
  try{ await window.storage.delete('dg_rsvp_' + eventId, true); }catch(err){ /* legacy key may not exist */ }
}
async function getAllRsvpData(){
  if(state.allRsvpCache) return state.allRsvpCache;
  const map = {}; // eventId -> {playerId: {status, lunch}}
  state.events.forEach(ev => { map[ev.id] = {}; });
  try{
    const listRes = await window.storage.list('dg_rsvp_', true);
    const keys = (listRes && listRes.keys) || [];
    const applyEntry = (key, raw) => {
      if(!raw) return;
      // Match against a known event ID rather than trying to parse the key apart —
      // both event and player IDs can themselves contain underscores, so splitting
      // dg_rsvp_<eventId>_<playerId> back out would be ambiguous otherwise.
      const ev = state.events.find(e => key.startsWith('dg_rsvp_' + e.id + '_'));
      if(!ev) return; // legacy/orphaned key (e.g. a deleted event) — ignore
      const playerId = key.slice(('dg_rsvp_' + ev.id + '_').length);
      map[ev.id][playerId] = JSON.parse(raw);
    };
    if(listRes && listRes.values){
      keys.forEach(k => applyEntry(k, listRes.values[k]));
    } else {
      const raws = await Promise.all(keys.map(k=>storeGet(k, true)));
      keys.forEach((k,i) => applyEntry(k, raws[i]));
    }
  }catch(e){ /* no rsvp data yet */ }
  // Populate the per-event cache too, so visiting an event's own detail page
  // right after Home doesn't trigger a second, redundant fetch for that event.
  state.events.forEach(ev => { state.rsvpCache[ev.id] = map[ev.id]; });
  state.allRsvpCache = map;
  return map;
}

// Per-event lineup bench: who is present but sitting out a given format. Two independent
// lists so a player (ours or an opponent) can sit out Singles but still play Doubles, or
// vice versa. Only meaningful when a specific event is selected on the Matchups page.
async function loadBench(eventId){
  if(state.benchCache[eventId]) return state.benchCache[eventId];
  const raw = await storeGet('dg_bench_' + eventId, true);
  const parsed = raw ? JSON.parse(raw) : {};
  const data = { singles: Array.isArray(parsed.singles) ? parsed.singles : [], doubles: Array.isArray(parsed.doubles) ? parsed.doubles : [] };
  state.benchCache[eventId] = data;
  return data;
}
async function saveBench(eventId, data){
  state.benchCache[eventId] = data;
  await storeSet('dg_bench_' + eventId, JSON.stringify(data), true);
}
async function toggleBench(playerId, format){
  const ms = state.matchupStateCache;
  const eventId = ms && ms.eventIdByTeam[ms.currentTeamId];
  if(!eventId){ showToast('Select an event first'); return; }
  const bench = await loadBench(eventId);
  const list = format === 'doubles' ? bench.doubles : bench.singles;
  const i = list.indexOf(playerId);
  if(i === -1){
    list.push(playerId);
    // Benching a player who was already matched up should free that matchup automatically,
    // so no stale pairing lingers with someone who's sitting the round out.
    if(format === 'singles') clearSinglesPairingFor(ms, eventId, playerId);
    else clearDoublesPairingFor(ms, eventId, playerId);
  } else {
    list.splice(i, 1);
  }
  render();
  saveBench(eventId, bench).catch(err=>console.error('Bench save failed', err));
}
// Removes any singles pairing involving playerId (as the Two Buff player OR the opponent),
// clearing the recorded result too. Saves matchup state.
function clearSinglesPairingFor(ms, eventId, playerId){
  const singles = getSinglesBucket(ms);
  let changed = false;
  Object.keys(singles).forEach(tbId=>{
    if(tbId === playerId || singles[tbId] === playerId){
      if(eventId) clearSinglesResultIfExists(eventId, tbId);
      delete singles[tbId];
      changed = true;
    }
  });
  if(changed) saveMatchupState(ms).catch(err=>console.error('Matchup save failed', err));
}
// Removes any doubles/triples group that includes playerId on either side, clearing the
// recorded result too. Saves matchup state.
function clearDoublesPairingFor(ms, eventId, playerId){
  const doubles = getDoublesBucket(ms);
  let changed = false;
  for(let idx = doubles.length - 1; idx >= 0; idx--){
    const m = doubles[idx];
    if((m.tb || []).includes(playerId) || (m.opp || []).includes(playerId)){
      if(eventId && m.tb && m.tb[0]) clearDoublesResultIfExists(eventId, m.tb[0]);
      doubles.splice(idx, 1);
      changed = true;
    }
  }
  if(changed) saveMatchupState(ms).catch(err=>console.error('Matchup save failed', err));
}

async function loadMatchupState(){
  const raw = await storeGet('dg_matchup', true);
  const data = raw ? JSON.parse(raw) : null;
  if(!data) return { currentTeamId: null, singlesByTeam: {}, doublesByTeam: {}, eventIdByTeam: {}, singlesByEvent: {}, doublesByEvent: {} };

  // Doubles used to just be Two Buff pairs (no opponent link). That shape can't represent
  // a real doubles-vs-doubles matchup, so old groupings are cleared rather than guessed at —
  // they're quick to re-create under the new tap-two-on-each-side system.
  const normalizeDoubles = (dbt) => {
    const out = {};
    Object.keys(dbt || {}).forEach(teamId=>{
      const arr = dbt[teamId] || [];
      const isNewShape = arr.every(m => m && typeof m === 'object' && Array.isArray(m.tb) && Array.isArray(m.opp));
      // Stamp a format on any group that predates the singles/triples feature (all were doubles).
      out[teamId] = isNewShape ? arr.map(m => m.format ? m : { ...m, format: 'doubles' }) : [];
    });
    return out;
  };

  if(data.singlesByTeam && data.doublesByTeam && data.eventIdByTeam){
    return {
      ...data,
      doublesByTeam: normalizeDoubles(data.doublesByTeam), // defensive re-normalize
      singlesByEvent: data.singlesByEvent || {},
      doublesByEvent: normalizeDoubles(data.doublesByEvent || {})
    };
  }
  if(data.singlesByTeam){
    // Migrate from the shape with per-team singles but no event linking / old-style doubles.
    return {
      currentTeamId: data.currentTeamId || null,
      singlesByTeam: data.singlesByTeam,
      doublesByTeam: {},
      eventIdByTeam: {},
      singlesByEvent: {},
      doublesByEvent: {}
    };
  }
  // Migrate from the original flat shape (one shared singles+doubles slot for whichever team was selected)
  return {
    currentTeamId: data.teamId || null,
    singlesByTeam: data.teamId ? { [data.teamId]: data.singles || {} } : {},
    doublesByTeam: {},
    eventIdByTeam: {},
    singlesByEvent: {},
    doublesByEvent: {}
  };
}
async function saveMatchupState(ms){
  await storeSet('dg_matchup', JSON.stringify(ms), true);
}
// Trial pairings (made with no event selected) and event-linked pairings are kept
// completely separate, so testing lineups never disturbs what's recorded for a real event.
function getSinglesBucket(ms){
  const eventId = ms.eventIdByTeam[ms.currentTeamId];
  if(eventId){
    if(!ms.singlesByEvent[eventId]) ms.singlesByEvent[eventId] = {};
    return ms.singlesByEvent[eventId];
  }
  if(!ms.singlesByTeam[ms.currentTeamId]) ms.singlesByTeam[ms.currentTeamId] = {};
  return ms.singlesByTeam[ms.currentTeamId];
}
function getDoublesBucket(ms){
  const eventId = ms.eventIdByTeam[ms.currentTeamId];
  if(eventId){
    if(!ms.doublesByEvent[eventId]) ms.doublesByEvent[eventId] = [];
    return ms.doublesByEvent[eventId];
  }
  if(!ms.doublesByTeam[ms.currentTeamId]) ms.doublesByTeam[ms.currentTeamId] = [];
  return ms.doublesByTeam[ms.currentTeamId];
}

/* ============================= INIT ============================= */
// A deliberate, full page reload — available to everyone in the topbar. Chosen over
// selectively clearing individual in-memory caches (rsvpCache, statsCache, etc.) because
// a real reload can't have a bug where one cache gets missed and gives false confidence
// that the data on screen is current when it isn't.
async function hardRefresh(){
  await refreshAllData();
  render();
  showToast('Data refreshed');
}
// ---- Per-device unlock ("trust this device") ----
// Entering a valid PIN trusts THIS device (browser) for a set window, so people aren't
// re-prompted every time they open the app. Team and regular-admin unlocks last 30 days;
// the super-admin unlock deliberately lasts only 1 hour, since it governs PIN changes and
// other destructive settings and should stay inconvenient.
//   Storage note: this trust is device-specific, so it must NOT live in the shared
//   Firestore-backed window.storage (that's synced across everyone). We use localStorage,
//   which is per-browser. If localStorage is unavailable (e.g. the artifact-preview sandbox),
//   we transparently fall back to an in-memory record for the session; the real hosted app
//   on GitHub Pages uses localStorage and persists across reloads.
const TRUST_MS = { team: 30*24*60*60*1000, admin: 30*24*60*60*1000, super: 60*60*1000 };
let _memoryTrust = null; // fallback when localStorage is blocked
function writeDeviceTrust(level){
  const rec = { level, expiresAt: Date.now() + (TRUST_MS[level] || TRUST_MS.team) };
  _memoryTrust = rec;
  try{ localStorage.setItem('dg_device_trust', JSON.stringify(rec)); }catch(e){}
}
function readDeviceTrust(){
  let rec = null;
  try{ const raw = localStorage.getItem('dg_device_trust'); if(raw) rec = JSON.parse(raw); }
  catch(e){ /* blocked — fall back to the in-memory record */ }
  if(!rec) rec = _memoryTrust;
  if(!rec || typeof rec.expiresAt !== 'number' || Date.now() >= rec.expiresAt) return null;
  return rec; // { level, expiresAt }
}
function clearDeviceTrust(){
  _memoryTrust = null;
  try{ localStorage.removeItem('dg_device_trust'); }catch(e){}
}
// Reveal the app for an already-trusted device, skipping the PIN gate. Returns whether it did.
function applyTrustedUnlock(){
  const trust = readDeviceTrust();
  if(!trust) return false;
  state.adminMode    = (trust.level === 'admin' || trust.level === 'super');
  state.isSuperAdmin = (trust.level === 'super');
  state.unlocked = true;
  const gate = document.getElementById('appGate');
  const main = document.getElementById('mainApp');
  if(gate) gate.style.display = 'none';
  if(main) main.style.visibility = 'visible';
  const adminSwitch = document.getElementById('adminSwitch');
  if(adminSwitch) adminSwitch.classList.toggle('on', state.adminMode);
  return true;
}

// ---- Refresh on return, decoupled from the PIN ----
// The old design re-locked the app after ~90s in the background, partly for security but
// mostly so re-entering the PIN would force a data refresh. With unlocks now persisting per
// device, that re-lock is gone; instead, simply returning to the app after a short absence
// pulls fresh data. Firebase's free tier (50k reads/day) makes this a non-issue at this team's
// size; the 10-second threshold only skips the pointless double-fetch when someone flips away
// and straight back. On return we also re-check device trust, which enforces the super-admin
// 1-hour window (team/admin trust lasts 30 days, so it isn't affected in practice).
const REFRESH_AFTER_BG_MS = 10 * 1000; // 10 seconds
let _backgroundedAt = null;
document.addEventListener('visibilitychange', async () => {
  if(document.hidden){ _backgroundedAt = Date.now(); return; }
  if(_backgroundedAt === null) return;
  const awayMs = Date.now() - _backgroundedAt;
  _backgroundedAt = null;
  if(!state.loaded || !state.unlocked) return;
  if(!readDeviceTrust()){ relockApp(); return; } // trust window lapsed (super admin) — re-lock
  if(awayMs >= REFRESH_AFTER_BG_MS){
    await refreshAllData();
    render();
  }
});
// Sends the app back to the PIN gate. Now only fires when a device's trust window has lapsed
// (in practice, the super-admin 1-hour cap).
function relockApp(){
  clearDeviceTrust();
  state.unlocked = false;
  state.adminMode = false;
  state.isSuperAdmin = false;
  closeModal();
  const gate = document.getElementById('appGate');
  const main = document.getElementById('mainApp');
  const input = document.getElementById('app_pin_input');
  const error = document.getElementById('app_pin_error');
  if(gate) gate.style.display = ''; // clear the inline override so the CSS default (flex) shows again
  if(main) main.style.visibility = 'hidden';
  if(input) input.value = '';
  if(error) error.style.display = 'none';
  const adminSwitch = document.getElementById('adminSwitch');
  if(adminSwitch) adminSwitch.classList.toggle('on', false);
  if(input) input.focus();
}
async function init(){
  await Promise.all([loadPlayers(), loadEvents()]);
  state.loaded = true;
  render();
  if(applyTrustedUnlock()){
    // This device is already trusted — skip the gate and make sure the data is current.
    await refreshAllData();
    render();
  } else {
    const gateInput = document.getElementById('app_pin_input');
    if(gateInput) gateInput.focus();
  }
  backfillDoublesPartnerEntries(); // one-time, self-guarding — runs quietly in the background
}
// ONE-TIME MIGRATION: before doubles results were mirrored to both partners, only the
// first-tapped player got a doubles stats entry (the partner's card showed nothing).
// This walks every event's stats once and, for any doubles entry naming a partner who
// lacks their own played doubles entry, creates the missing mirror. It's careful to:
//   - never overwrite a partner who already has their own played entry (idempotent)
//   - never touch matchplay, adjustments, or anything else
//   - skip entirely after its first successful run, via a stored version flag
async function backfillDoublesPartnerEntries(){
  try{
    const done = await storeGet('dg_migration_doubles_mirror', true);
    if(done) return; // already run — do nothing
    const listRes = await window.storage.list('dg_stats_', true);
    const keys = (listRes && listRes.keys) || [];
    for(const key of keys){
      const raw = await storeGet(key, true);
      if(!raw) continue;
      const data = JSON.parse(raw);
      let changed = false;
      // Snapshot the player ids up front so mirrors we add don't get re-processed this pass.
      const playerIds = Object.keys(data).filter(pid => pid !== '__adjustments');
      for(const pid of playerIds){
        const s = data[pid];
        const db = s && s.doubles;
        if(!db || !db.played || !db.partnerId) continue;
        const partnerId = db.partnerId;
        const partnerRec = data[partnerId];
        const partnerHasEntry = partnerRec && partnerRec.doubles && partnerRec.doubles.played;
        if(partnerHasEntry) continue; // partner already covered — leave untouched
        // Build the partner's mirror: same shared result, but pointing back at this player.
        const partnerName = (state.players.find(p=>p.id===partnerId) || {}).name || db.partnerName || '';
        const mirror = {
          played:true, result: db.result,
          powerRank: db.powerRank || 5,
          partnerId: pid,
          partnerName: (state.players.find(p=>p.id===pid) || {}).name || '',
          opp1Id: db.opp1Id ?? null, opp1Name: db.opp1Name || '',
          opp2Id: db.opp2Id ?? null, opp2Name: db.opp2Name || '',
          ourScore: db.ourScore ?? null, oppScore: db.oppScore ?? null, playoffHoles: db.playoffHoles ?? null
        };
        const partnerCur = data[partnerId] || {};
        partnerCur.doubles = mirror;
        data[partnerId] = partnerCur;
        // Also make sure this player's own entry correctly names the partner (older
        // entries always did, but this is cheap insurance).
        if(!db.partnerName && partnerName){ db.partnerName = partnerName; }
        changed = true;
      }
      if(changed){
        await storeSet(key, JSON.stringify(data), true);
        state.statsCache[key.slice('dg_stats_'.length)] = data;
      }
    }
    state.allStatsCache = null; // force a fresh bulk read next time stats are shown
    await storeSet('dg_migration_doubles_mirror', 'done', true);
    render();
  }catch(e){ console.error('Doubles backfill migration failed', e); }
}

async function getAppPin(){

async function submitAppPin(){
  const entered = (document.getElementById('app_pin_input').value || '').trim();
  const [superPin, regularPin, teamPin] = await Promise.all([getSuperAdminPin(), getAdminPin(), getAppPin()]);
  let matched = true, level = null;
  if(entered === superPin){
    state.adminMode = true;
    state.isSuperAdmin = true;
    level = 'super';
  } else if(entered === regularPin){
    state.adminMode = true;
    state.isSuperAdmin = false;
    level = 'admin';
  } else if(entered === teamPin){
    state.adminMode = false;
    state.isSuperAdmin = false;
    level = 'team';
  } else {
    matched = false;
  }
  if(matched){
    // Trust this device so we don't re-prompt: 30 days for team/admin, 1 hour for super admin.
    writeDeviceTrust(level);
    state.unlocked = true;
    document.getElementById('adminSwitch').classList.toggle('on', state.adminMode);
    document.getElementById('appGate').style.display = 'none';
    document.getElementById('mainApp').style.visibility = 'visible';
    if(state.adminMode) showToast(state.isSuperAdmin ? 'Super admin unlocked' : 'Admin mode unlocked');
    // Unlocking is also a natural moment to pull fresh data.
    await refreshAllData();
    render();
  } else {
    document.getElementById('app_pin_error').style.display = 'block';
    showToast('Incorrect PIN');
  }
}
// Clears every in-memory cache and re-fetches the core data, without a full page

}

  if(state.adminMode){
    state.adminMode = false;
    state.isSuperAdmin = false;
    document.getElementById('adminSwitch').classList.remove('on');

    return;
  }
  // If this device is already trusted at an admin level, honor it without re-prompting —
  // consistent with the persisted unlock, so toggling admin back on isn't more work than a reload.
  const trust = readDeviceTrust();

/* ============================= RENDER ROOT ============================= */
async function render(){
  document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active', b.dataset.view === (state.view==='eventDetail'?'events':state.view)));
  const root = document.getElementById('viewRoot');
  if(!state.loaded){ root.innerHTML = '<div class="loading-dots">Loading team hub…</div>'; return; }

  // Guard against a slow/stale render finishing after the user has already
  // navigated elsewhere — without this, a delayed load could overwrite
  // whatever tab the person is now looking at.
  state.renderToken = (state.renderToken || 0) + 1;
  const myToken = state.renderToken;

  let html;
  try{
    if(state.view === 'home') html = await renderHome();
    else if(state.view === 'events') html = await renderEvents();
    else if(state.view === 'eventDetail') html = await renderEventDetail(state.currentEventId);
    else if(state.view === 'team') html = await renderTeam();
    else if(state.view === 'stats') html = await renderStats();
    else if(state.view === 'matchups') html = await renderMatchups();
    else if(state.view === 'opponents') html = await renderTeamsPage();
  }catch(err){
    console.error('Render failed for view', state.view, err);
    if(state.renderToken === myToken){
      root.innerHTML = `
        <div class="card empty">
          <span class="em">⚠️</span>
          <p>Something went wrong loading this page.</p>
          <button class="btn btn-outline" onclick="render()">↺ Try Again</button>
        </div>`;
    }
    return;
  }
  if(state.renderToken === myToken){
    root.innerHTML = html; // only apply if nothing newer has started since we began
  }
}

function todayISO(){
  const d = new Date();
  return d.toISOString().slice(0,10);
}
function upcomingEvents(){
  const t = todayISO();
  return state.events.filter(e=>e.date >= t).sort((a,b)=>a.date.localeCompare(b.date));
}

            <div style="font-size:10.5px; color:var(--ink-soft); font-weight:700; margin-top:4px;">${fmtNoteDate(n.createdAt)}</div>

function rsvpCounts(rsvp){
  const active = state.players.filter(p=>p.active !== false);
  let confirmed=0, maybe=0, declined=0, none=0, lunchResp=0;
  let femaleConfirmed=0, femaleTotal=0;
  active.forEach(p=>{
    const r = rsvp[p.id];
    const status = r ? r.status : 'none';
    if(status==='confirmed') confirmed++;
    else if(status==='maybe') maybe++;
    else if(status==='declined') declined++;
    else none++;
    // Lunch % is scoped to confirmed attendees only — a maybe/out RSVP shouldn't
    // drag the percentage down just because they haven't (and won't) bring food.
    if(status==='confirmed' && r && r.lunch && r.lunch.trim()) lunchResp++;
    if(p.gender === 'F'){
      femaleTotal++;
      if(status==='confirmed') femaleConfirmed++;
    }
  });
  // Summary view shows three buckets: Confirmed (In), Out (declined), and Waiting
  // confirmation (maybe + no reply — anyone without a firm answer either way).
  const out = declined;
  const waiting = maybe + none;
  return {confirmed, maybe, declined, none, out, waiting, femaleConfirmed, femaleTotal, lunchResp, total: active.length};
}

/* ============================= EVENTS LIST ============================= */
function getSeasonList(){
  const set = new Set(state.events.map(e=>effectiveSeason(e)));
  set.add(inferSeason(todayISO())); // always keep the current season available, even with no events yet
  return [...set].filter(Boolean).sort().reverse(); // newest season first
}

async function renderEvents(){
  const seasons = getSeasonList();
  const current = inferSeason(todayISO());
  if(!state.selectedSeason || !seasons.includes(state.selectedSeason)){
    state.selectedSeason = seasons.includes(current) ? current : seasons[0];
  }
  const season = state.selectedSeason;
  const t = todayISO();
  const inSeason = state.events.filter(e=>effectiveSeason(e)===season).sort((a,b)=>a.date.localeCompare(b.date));
  const upcoming = inSeason.filter(e=>e.date >= t);
  const past = inSeason.filter(e=>e.date < t).reverse(); // most recently past first

  const tabsHtml = `
    <div class="season-tabs">
      ${seasons.map(s=>`
        <div class="season-tab-wrap">
          <button class="season-tab ${s===season?'active':''}" onclick="selectSeason('${s}')">${esc(s)}${s===current?' · Current':''}</button>
          ${(state.isSuperAdmin && state.adminMode) ? `<button class="season-tab-remove" onclick="event.stopPropagation(); openRemoveSeasonConfirm('${esc(s)}')" title="Remove season">×</button>` : ''}
        </div>

  const needsOppTeams = inSeason.some(e=>e.opponentTeamId);
  const [oppTeamsForList, allRsvp, allStats] = await Promise.all([
    needsOppTeams ? loadOppTeams() : Promise.resolve([]),
    getAllRsvpData(),
    getAllStatsData()
  ]);
  function resolveOpponentName(e){
    if(e.opponentTeamId){
      const t = oppTeamsForList.find(x=>x.id===e.opponentTeamId);
      return t ? t.name : '';
    }
    return e.opponentName || '';
  }

  function cardFor(e, past){
    const d = fmtDate(e.date);
    const rsvp = allRsvp[e.id] || {};
    const counts = rsvpCounts(rsvp);
    const opponentName = resolveOpponentName(e);
    const details = computeMatchDetailsFromData(allStats[e.id] || {});
    const teamResult = { result: details.result, ourScore: details.totalUsPts, oppScore: details.totalOppPts };
    const resultBadge = teamResult.result ? (()=>{
      const color = teamResult.result==='W' ? 'var(--forest)' : teamResult.result==='L' ? 'var(--red)' : '#8A6112';
      const bg = teamResult.result==='W' ? '#BFE0CE' : teamResult.result==='L' ? '#F0B7B1' : '#FBEFD8';
      const label = teamResult.result==='W' ? 'WIN' : teamResult.result==='L' ? 'LOSS' : 'TIE';
      const score = (teamResult.ourScore!=null && teamResult.oppScore!=null) ? ` ${teamResult.ourScore}–${teamResult.oppScore}` : '';
      return `<span class="pill" style="background:${bg}; color:${color}; margin-top:6px;">🏁 ${label}${score}</span>`;
    })() : '';
    const cardTint = teamResult.result === 'W' ? 'background:#DCEFE3; border-color:var(--forest);'
      : teamResult.result === 'L' ? 'background:#F5D9D6; border-color:var(--red);'
      : '';
    return `
      <div class="card" style="${cardTint} ${past ? 'opacity:0.6;' : ''}">
        <div style="display:flex; justify-content:space-between; align-items:flex-start;">
          <div>
            <div class="page-sub" style="margin-bottom:4px;">${past ? 'PAST EVENT' : d.mon + ' ' + d.day}</div>
            <h3 style="font-size:18px;">${esc(e.name)} ${e.isHome ? '<span class="home-badge">🏡 Home / Lunch Spread</span>' : ''}</h3>
            <div style="color:var(--ink-soft); font-size:13px; margin-top:4px;">${fmtDateLong(e.date)}${e.time ? ' · ' + fmtTime(e.time) : ''}${e.location ? ' · ' + esc(e.location) : ''}${opponentName ? ' · vs ' + esc(opponentName) : ''}</div>
            ${resultBadge ? `<div>${resultBadge}</div>` : ''}
          </div>
          <div class="event-date" style="width:52px; ${past ? 'background:var(--ink-soft);' : ''}">
            ${e.isHome ? '<div class="home-star">⭐</div>' : ''}
            <div class="mon">${d.mon}</div><div class="day">${d.day}</div>
          </div>
        </div>
        <div class="stat-grid">
          <div class="stat-box"><div class="num" style="color:var(--forest);">${counts.confirmed}</div><div class="lbl">Confirmed</div></div>
          <div class="stat-box"><div class="num" style="color:var(--red);">${counts.out}</div><div class="lbl">Out</div></div>
          <div class="stat-box"><div class="num" style="color:var(--gold);">${counts.waiting}</div><div class="lbl">Waiting</div></div>
        </div>
        <div style="margin-top:14px; display:flex; gap:8px;">
          <button class="btn btn-primary" style="flex:1;" onclick="openEvent('${e.id}')">View &amp; RSVP →</button>
          <button class="icon-btn" onclick="event.stopPropagation(); openAddToCalendarModal('${e.id}')" aria-label="Add to calendar">📅</button>
        </div>
      </div>`;
  }

  let upcomingHtml = '';
  if(upcoming.length){
    upcomingHtml = upcoming.map(e=>cardFor(e, false)).join('');
  } else {
    upcomingHtml = `<div class="card empty"><span class="em">📋</span><p>No upcoming events in ${esc(season)} yet.</p></div>`;
  }

  let pastHtml = '';
  if(past.length){

    let pastCards = '';
    if(expanded){
      pastCards = past.map(e=>cardFor(e, true)).join('');
    }
    pastHtml = `
      <button class="past-toggle" onclick="togglePastExpanded('${season}')">
        <span>📜 ${past.length} past event${past.length===1?'':'s'} in ${esc(season)}</span>
        <span>${expanded ? '▲ Hide' : '▼ Show'}</span>
      </button>
      ${pastCards}`;
  }

  return `
    <div class="page-title">Events</div>
    <div class="page-sub">Tap an event to RSVP and see who's in.</div>
    ${tabsHtml}
    ${state.adminMode ? `<div class="fab-row"><button class="btn btn-orange btn-sm" onclick="openEventModal()">+ Add Event</button></div>` : ''}
    ${upcomingHtml}

}

async function performRemoveSeason(season){
  const toRemove = state.events.filter(e=>effectiveSeason(e)===season);
  state.events = state.events.filter(e=>effectiveSeason(e)!==season);
  await saveEvents();
  for(const e of toRemove){
    await deleteAllRsvpForEvent(e.id);
    try{ await window.storage.delete('dg_stats_' + e.id, true); }catch(err){ /* key may not exist */ }
    try{ await window.storage.delete('dg_teamresult_' + e.id, true); }catch(err){ /* key may not exist */ }
    delete state.rsvpCache[e.id];
    delete state.statsCache[e.id];
  }
  delete state.pastExpanded[season];
  if(state.selectedSeason === season) state.selectedSeason = null; // recompute on next render
  closeModal();
  showToast(`${season} removed — ${toRemove.length} event${toRemove.length===1?'':'s'} deleted`);
  render();
}

/* ============================= ADD TO CALENDAR ============================= */
async function resolveOpponentDisplayNameForEvent(ev){
  if(ev.opponentTeamId){
    const teams = await loadOppTeams();
    const t = teams.find(x=>x.id===ev.opponentTeamId);
    return t ? t.name : '';
  }
  return ev.opponentName || '';
}
function icsEscape(str){
  return String(str||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
}
function pad2(n){ return String(n).padStart(2,'0'); }
function buildICS(ev, opponentName){
  const dt = ev.date.replace(/-/g,'');
  let dtStartLine, dtEndLine;
  if(ev.time){
    const [hh, mm] = ev.time.split(':');
    dtStartLine = `DTSTART:${dt}T${pad2(hh)}${pad2(mm)}00`;
    const startDate = new Date(ev.date + 'T' + ev.time + ':00');
    const endDate = new Date(startDate.getTime() + 3*60*60*1000); // default 3-hour round
    dtEndLine = `DTEND:${endDate.getFullYear()}${pad2(endDate.getMonth()+1)}${pad2(endDate.getDate())}T${pad2(endDate.getHours())}${pad2(endDate.getMinutes())}00`;
  } else {
    const startDate = new Date(ev.date + 'T00:00:00');
    const endDate = new Date(startDate.getTime() + 24*60*60*1000);
    dtStartLine = `DTSTART;VALUE=DATE:${dt}`;
    dtEndLine = `DTEND;VALUE=DATE:${endDate.getFullYear()}${pad2(endDate.getMonth()+1)}${pad2(endDate.getDate())}`;
  }
  const now = new Date();
  const stamp = now.toISOString().replace(/[-:]/g,'').split('.')[0] + 'Z';
  const venueLine = eventVenue(ev) === 'home' ? 'Home event — lunch spread' : eventVenue(ev) === 'neutral' ? 'Neutral site' : 'Away event';
  const descLines = [venueLine, opponentName ? `Opponent: ${opponentName}` : ''].filter(Boolean);
  const lines = [
    'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Two Buff Team Hub//EN', 'CALSCALE:GREGORIAN',
    'BEGIN:VEVENT',
    `UID:${ev.id}@twobuffteamhub`,
    `DTSTAMP:${stamp}`,
    dtStartLine, dtEndLine,
    `SUMMARY:${icsEscape(ev.name)}`,
    ev.location ? `LOCATION:${icsEscape(ev.location)}` : '',
    descLines.length ? `DESCRIPTION:${icsEscape(descLines.join('\n'))}` : '',
    'END:VEVENT', 'END:VCALENDAR'
  ].filter(Boolean);
  return lines.join('\r\n');
}
function openAddToCalendarModal(eventId){
  const modal = document.getElementById('modalRoot');
  modal.innerHTML = `
    <div class="overlay" onclick="closeModalIfBackdrop(event)">
      <div class="sheet" onclick="event.stopPropagation()">
        <h3>📅 Add to Calendar</h3>
        <div style="font-size:12.5px; color:var(--ink-soft); margin-bottom:16px;">Choose how you'd like to save this event.</div>
        <div style="display:flex; flex-direction:column; gap:10px; margin-bottom:14px;">
          <button class="btn btn-primary" onclick="downloadEventICS('${eventId}')">⬇️ Download File (Apple / Outlook)</button>
          <button class="btn btn-outline" onclick="addToGoogleCalendar('${eventId}')">📆 Add to Google Calendar</button>
        </div>
        <div class="btn-row">
          <button class="btn btn-ghost" onclick="closeModal()">Close</button>
        </div>
      </div>
    </div>`;
}
async function downloadEventICS(eventId){
  const ev = state.events.find(e=>e.id===eventId);
  if(!ev) return;
  const opponentName = await resolveOpponentDisplayNameForEvent(ev);
  const icsContent = buildICS(ev, opponentName);
  const blob = new Blob([icsContent], {type: 'text/calendar;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${ev.name.replace(/[^a-z0-9]+/gi, '-')}.ics`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  closeModal();
  showToast('Calendar file downloaded');
}
async function addToGoogleCalendar(eventId){
  const ev = state.events.find(e=>e.id===eventId);
  if(!ev) return;
  const opponentName = await resolveOpponentDisplayNameForEvent(ev);
  let datesParam;
  if(ev.time){
    const startDate = new Date(ev.date + 'T' + ev.time + ':00');
    const endDate = new Date(startDate.getTime() + 3*60*60*1000);
    const fmt = d => `${d.getUTCFullYear()}${pad2(d.getUTCMonth()+1)}${pad2(d.getUTCDate())}T${pad2(d.getUTCHours())}${pad2(d.getUTCMinutes())}00Z`;
    datesParam = `${fmt(startDate)}/${fmt(endDate)}`;
  } else {
    const startDate = new Date(ev.date + 'T00:00:00');
    const endDate = new Date(startDate.getTime() + 24*60*60*1000);
    const fmt = d => `${d.getFullYear()}${pad2(d.getMonth()+1)}${pad2(d.getDate())}`;
    datesParam = `${fmt(startDate)}/${fmt(endDate)}`;
  }
  const gcalVenueLine = eventVenue(ev) === 'home' ? 'Home event — lunch spread' : eventVenue(ev) === 'neutral' ? 'Neutral site' : 'Away event';
  const details = [gcalVenueLine, opponentName ? `Opponent: ${opponentName}` : ''].filter(Boolean).join('\n');
  const url = new URL('https://calendar.google.com/calendar/render');
  url.searchParams.set('action', 'TEMPLATE');
  url.searchParams.set('text', ev.name);
  url.searchParams.set('dates', datesParam);
  if(ev.location) url.searchParams.set('location', ev.location);
  if(details) url.searchParams.set('details', details);
  window.open(url.toString(), '_blank');
  closeModal();
}

/* ============================= EVENT DETAIL ============================= */
async function renderEventDetail(eventId){
  const ev = state.events.find(e=>e.id===eventId);
  if(!ev) return `<div class="empty"><p>Event not found.</p></div>`;
  const [rsvp, teamResult, oppTeams] = await Promise.all([
    loadRsvp(eventId),
    computeTeamResult(eventId),
    ev.opponentTeamId ? loadOppTeams() : Promise.resolve([])
  ]);
  const oppTeamForEvent = ev.opponentTeamId ? oppTeams.find(t=>t.id===ev.opponentTeamId) : null;
  const opponentDisplayName = oppTeamForEvent ? oppTeamForEvent.name : (ev.opponentName || '');
  const liveTitle = buildEventTitle(ev, oppTeams);
  const counts = rsvpCounts(rsvp);
  const roster = state.players.filter(p=>p.active !== false);
  const lunchPct = counts.confirmed ? Math.round((counts.lunchResp / counts.confirmed) * 100) : 0;

  let playerCards = '';
  for(const p of roster){
    const r = rsvp[p.id] || {status:'none', lunch:''};
    playerCards += `
      <div class="player-card">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <div style="display:flex; align-items:center; gap:6px;">
            <div class="pname">${esc(p.name)}</div>
            <span class="gender-badge ${p.gender==='F' ? 'g-f':'g-m'}">${p.gender==='F' ? 'F':'M'}</span>
          </div>
          ${statusPill(r.status)}
        </div>
        <div class="rsvp-grid">
          <div class="rsvp-btn ${r.status==='confirmed'?'sel-confirmed':''}" onclick="setRsvpStatus('${eventId}','${p.id}','confirmed')"><span class="em">✅</span>In</div>
          <div class="rsvp-btn ${r.status==='maybe'?'sel-maybe':''}" onclick="setRsvpStatus('${eventId}','${p.id}','maybe')"><span class="em">🤔</span>Maybe</div>
          <div class="rsvp-btn ${r.status==='declined'?'sel-declined':''}" onclick="setRsvpStatus('${eventId}','${p.id}','declined')"><span class="em">❌</span>Out</div>
        </div>
        ${ev.isHome ? `
          <input class="lunch-input" placeholder="🍽️ What are they bringing to the lunch spread?" value="${esc(r.lunch||'')}"
            onchange="setLunchItem('${eventId}','${p.id}', this.value)">
        ` : ''}
      </div>
    `;
  }

  return `
    <button class="btn btn-ghost btn-sm" style="width:auto; margin-bottom:12px;" onclick="setView('events')">← All Events</button>
    <div class="page-title">${esc(liveTitle)} ${ev.isHome ? '<span class="home-badge">🏡 Home / Lunch Spread</span>' : eventVenue(ev)==='neutral' ? '<span class="venue-badge">⚖️ Neutral</span>' : '<span class="venue-badge">✈️ Away</span>'}</div>
    <div class="page-sub">${fmtDateLong(ev.date)}${ev.time ? ' · ' + fmtTime(ev.time) : ''}${ev.location ? ' · ' + esc(ev.location) : ''}</div>

    <div class="btn-row" style="margin-bottom:14px;">
      <button class="btn btn-outline btn-sm" onclick="openAddToCalendarModal('${ev.id}')">📅 Add to Calendar</button>
    </div>

    ${state.adminMode ? `
      <div class="btn-row" style="margin-bottom:14px;">
        <button class="btn btn-ghost btn-sm" onclick="openEventModal('${ev.id}')">✏️ Edit Event</button>
      </div>` : ''}

    ${teamResult.result ? `
      <div class="card" style="background:${teamResult.result==='W' ? '#DCEFE3' : teamResult.result==='L' ? '#F5D9D6' : '#FBEFD8'}; border:none;">
        <div style="font-weight:800; font-size:15px; color:${teamResult.result==='W' ? 'var(--forest)' : teamResult.result==='L' ? 'var(--red)' : '#8A6112'}; text-align:center; margin-bottom:4px;">
          🏁 Final: ${teamResult.result==='W' ? 'WIN' : teamResult.result==='L' ? 'LOSS' : 'TIE'}
        </div>
        ${renderScoreboard('Two Buff', teamResult.ourScore, teamResult.oppScore, opponentDisplayName || 'Opponent', true)}
      </div>
    ` : ''}

    ${state.adminMode ? `
      <div class="card" style="background:var(--chip-bg); border:none; box-shadow:none;">
        <div style="font-size:12.5px; color:var(--ink-soft); line-height:1.5;">The event score is calculated automatically from each player's Matchplay and Doubles results (1 point per singles win, 2 per doubles win). Enter those results from the 🎯 Mockup Matchups page — set this event as an opponent team's linked event there, then tap Won/Lost right on each matchup.</div>
      </div>
    ` : ''}

    <div class="card">
      <div class="section-label" style="margin-top:0;">Event Summary</div>
      <div class="stat-grid">
        <div class="stat-box" style="background:${counts.confirmed >= 18 ? '#DCEFE3' : '#F5D9D6'};"><div class="num" style="color:${counts.confirmed >= 18 ? 'var(--forest)' : 'var(--red)'};">${counts.confirmed}</div><div class="lbl">Confirmed</div></div>
        <div class="stat-box"><div class="num" style="color:var(--red);">${counts.out}</div><div class="lbl">Out</div></div>
        <div class="stat-box"><div class="num" style="color:var(--gold);">${counts.waiting}</div><div class="lbl">Waiting confirmation</div></div>
      </div>
      ${counts.femaleTotal > 0 ? `
        <div class="lunch-bar-wrap" style="display:flex; align-items:center; justify-content:space-between; background:${counts.femaleConfirmed >= 2 ? '#DCEFE3' : '#F5D9D6'}; border-radius:14px; padding:12px 14px; margin-top:12px;">
          <div style="font-size:13px; font-weight:800; color:${counts.femaleConfirmed >= 2 ? 'var(--forest)' : 'var(--red)'};"><span class="gender-badge ${counts.femaleConfirmed >= 2 ? 'g-f-ok' : 'g-f'}" style="margin-right:6px; ${counts.femaleConfirmed >= 2 ? 'background:#BFE0CE; color:var(--forest);' : 'background:#F0B7B1; color:var(--red);'}">F</span>Female players confirmed</div>
          <div style="font-size:17px; font-weight:800; color:${counts.femaleConfirmed >= 2 ? 'var(--forest)' : 'var(--red)'};">${counts.femaleConfirmed} <span style="font-size:12px; font-weight:700; opacity:0.75;">/ ${counts.femaleTotal}</span></div>
        </div>
      ` : ''}
      ${ev.isHome ? `
        <div class="lunch-bar-wrap">
          <div style="display:flex; justify-content:space-between; font-size:12px; font-weight:700; color:var(--ink-soft); margin-bottom:6px;">
            <span>🍽️ Lunch sign-ups</span><span>${lunchPct}%</span>
          </div>
          <div class="lunch-bar-track"><div class="lunch-bar-fill" style="width:${lunchPct}%;"></div></div>
        </div>
      ` : ''}
    </div>

    <div class="section-label">Roster (${roster.length})</div>
    ${playerCards || '<div class="card empty"><span class="em">👥</span><p>Add players in the Team tab first.</p></div>'}
  `;
}

function statusPill(status){
  if(status==='confirmed') return '<span class="pill pill-forest">✅ In</span>';
  if(status==='maybe') return '<span class="pill" style="background:#F6E6C4; color:#8A6112;">🤔 Maybe</span>';
  if(status==='declined') return '<span class="pill" style="background:#F5D9D6; color:var(--red);">❌ Out</span>';
  return '<span class="pill pill-gray">⏳ No reply</span>';
}

async function setRsvpStatus(eventId, playerId, status){
  const rsvp = await loadRsvp(eventId);
  const cur = rsvp[playerId] || {status:'none', lunch:''};
  cur.status = (cur.status === status) ? 'none' : status;
  rsvp[playerId] = cur;
  render();
  saveRsvpEntry(eventId, playerId, cur).catch(err=>console.error('RSVP save failed', err));
}
async function setLunchItem(eventId, playerId, value){
  const rsvp = await loadRsvp(eventId);
  const cur = rsvp[playerId] || {status:'none', lunch:''};
  cur.lunch = value;
  rsvp[playerId] = cur;
  await saveRsvpEntry(eventId, playerId, cur);
  showToast('Lunch item saved');
}
function blankResultEntry(kind){
  return kind === 'doubles'
    ? {played:false, result:null, format:'doubles', powerRank:null, partnerIds:[], partnerNames:[], oppIds:[], oppNames:[], ourScore:null, oppScore:null, playoffHoles:null}
    : {played:false, result:null, powerRank:null, opponentPlayerId:null, opponentName:'', marginUp:null, holesRemaining:null};
}
// The ".doubles" stats slot now holds any stroke-play GROUP result — singles-stroke,
// doubles, or triples. Older saved entries used single-partner (partnerId/partnerName)
// and fixed opp1/opp2 fields; this upgrades them to the array shape on read so every
// downstream reader can assume arrays + a format. Non-destructive: callers that save
// go through the array shape from here on.
function normalizeGroupEntry(db){
  if(!db) return db;
  if(Array.isArray(db.partnerIds) && Array.isArray(db.oppIds) && db.format){
    return db; // already new shape
  }
  const partnerIds = [];
  const partnerNames = [];
  if(Array.isArray(db.partnerIds)){
    db.partnerIds.forEach((id,i)=>{ if(id){ partnerIds.push(id); partnerNames.push((db.partnerNames && db.partnerNames[i]) || ''); } });
  } else if(db.partnerId){
    partnerIds.push(db.partnerId); partnerNames.push(db.partnerName || '');
  }
  const oppIds = [];
  const oppNames = [];
  if(Array.isArray(db.oppIds)){
    db.oppIds.forEach((id,i)=>{ if(id){ oppIds.push(id); oppNames.push((db.oppNames && db.oppNames[i]) || ''); } });
  } else {
    if(db.opp1Id){ oppIds.push(db.opp1Id); oppNames.push(db.opp1Name || ''); }
    if(db.opp2Id){ oppIds.push(db.opp2Id); oppNames.push(db.opp2Name || ''); }
  }
  // Infer format from team size when not explicitly stored (all legacy entries are doubles).
  const teamSize = partnerIds.length + 1;
  const format = db.format || (teamSize === 1 ? 'singles' : teamSize === 3 ? 'triples' : 'doubles');
  return {
    played: !!db.played, result: db.result ?? null, format,
    powerRank: db.powerRank ?? null,
    partnerIds, partnerNames, oppIds, oppNames,
    ourScore: db.ourScore ?? null, oppScore: db.oppScore ?? null, playoffHoles: db.playoffHoles ?? null
  };
}
// Points a WIN is worth for a given group format (a tie splits this evenly).
function groupFormatWinPoints(format){
  return format === 'singles' ? 1 : format === 'triples' ? 3 : 2;
}
function groupFormatLabel(format){
  return format === 'singles' ? 'Stroke Singles' : format === 'triples' ? 'Triples' : 'Doubles';
}
// Venue is 'home' | 'away' | 'neutral'. Older events only have the boolean isHome,
// so derive from that when venue isn't set: isHome -> home, otherwise away.
function eventVenue(ev){
  if(ev && (ev.venue === 'home' || ev.venue === 'away' || ev.venue === 'neutral')) return ev.venue;
  return ev && ev.isHome ? 'home' : 'away';
}
function formatMatchupTitle(ev, opponentLabel){
  const v = eventVenue(ev);
  if(v === 'home') return `${opponentLabel} @ Two Buff`;
  if(v === 'neutral') return `Two Buff vs ${opponentLabel}`; // neutral site — no host
  return `Two Buff @ ${opponentLabel}`;
}
// Resolve the opponent's display name for an event, whether it's a linked team or a
// typed-in custom name. Returns '' when no opponent is set yet.
function resolveOpponentLabel(ev, teams){
  if(!ev) return '';
  if(ev.opponentTeamId){
    const t = (teams || []).find(x=>x.id===ev.opponentTeamId);
    if(t) return t.name;
  }
  return ev.opponentName || '';
}
// The canonical event title, derived from venue + opponent. This replaces the old
// manually-typed event name. When no opponent is set, fall back to a neutral label
// so the event still has a usable title everywhere.
function buildEventTitle(ev, teams){
  const opp = resolveOpponentLabel(ev, teams);
  if(!opp) return 'Two Buff Event';
  return formatMatchupTitle(ev, opp);
}
// "Matt Grayum" -> "Matt G." ; single-word names are left as-is.
function abbrevName(name){
  if(!name) return name;
  const parts = String(name).trim().split(/\s+/);
  if(parts.length < 2) return name;
  return `${parts[0]} ${parts[parts.length-1][0]}.`;
}
// Handles single names and doubles pairs like "Matt Grayum & Jon Doe".
function abbrevNameLabel(label){
  if(!label) return label;
  return label.includes(' & ')
    ? label.split(' & ').map(s=>abbrevName(s.trim())).join(' & ')
    : abbrevName(label);
}
function formatMatchplayMargin(entry){
  if(entry.marginUp == null) return '';
  const holesLeft = entry.holesRemaining || 0;
  return holesLeft > 0 ? `${entry.marginUp} & ${holesLeft}` : `${entry.marginUp} UP`;
}
function formatDoublesScore(entry){
  if(entry.ourScore == null || entry.oppScore == null) return '';
  const base = `${entry.ourScore} - ${entry.oppScore}`;
  return entry.playoffHoles ? `${base} (${entry.playoffHoles}h playoff)` : base;
}
async function setSinglesMargin(eventId, tbId, value){
  const stats = await loadStats(eventId);
  const cur = stats[tbId] || {};
  const existing = cur.matchplay || blankResultEntry('matchplay');
  if(!existing.played) return;
  const num = value === '' ? null : Math.max(0, Number(value));
  existing.marginUp = (num===null || isNaN(num)) ? null : num;
  cur.matchplay = existing;
  stats[tbId] = cur;
  render();
  saveStats(eventId, stats).catch(err=>console.error('Score save failed', err));
}
async function setSinglesHolesRemaining(eventId, tbId, value){
  const stats = await loadStats(eventId);
  const cur = stats[tbId] || {};
  const existing = cur.matchplay || blankResultEntry('matchplay');
  if(!existing.played) return;
  const num = value === '' ? null : Math.max(0, Number(value));
  existing.holesRemaining = (num===null || isNaN(num)) ? null : num;
  cur.matchplay = existing;
  stats[tbId] = cur;
  render();
